${L('<div class="props">\n<strong>One forward pass per (query, doc) pair.</strong> The query and document are concatenated as a single input; self-attention lets them interact at every layer.<br><br>\n<strong>✓ Much more accurate</strong> — the model can form query-specific representations and catch subtle relational signals.<br>\n<strong>✗ Nothing can be pre-computed.</strong> Every query means re-running the model on every candidate.<br>\n<strong>✗ Scales only to hundreds</strong> of candidates per query — impractical as a first-stage retriever.<br><br>\n<strong>Examples:</strong> ms-marco-MiniLM-L-12-v2, bge-reranker-large, Cohere rerank, Voyage rerank-2.\n</div>','<div class="props">\n<strong>Ein Forward-Pass pro (Anfrage, Dokument)-Paar.</strong> Anfrage und Dokument werden zu einer einzigen Eingabe konkateniert; Self-Attention lässt sie in jeder Schicht interagieren.<br><br>\n<strong>✓ Viel genauer</strong> — das Modell kann anfragespezifische Repräsentationen bilden und subtile relationale Signale erfassen.<br>\n<strong>✗ Nichts lässt sich vorberechnen.</strong> Jede Anfrage bedeutet, das Modell auf jedem Kandidaten neu laufen zu lassen.<br>\n<strong>✗ Skaliert nur auf Hunderte</strong> Kandidaten pro Anfrage — als Erststufen-Retriever unpraktikabel.<br><br>\n<strong>Beispiele:</strong> ms-marco-MiniLM-L-12-v2, bge-reranker-large, Cohere rerank, Voyage rerank-2.\n</div>')}
</div>
</div>`;

  // The two-stage pipeline explanation
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">The two-stage pipeline · fast filter + precise judge</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Die zweistufige Pipeline · schneller Filter + präziser Richter</h3>`);
  h += L(`<p class="stage-desc">Neither architecture alone is ideal. Production RAG systems combine them: the bi-encoder scans the entire corpus to produce a shortlist of ~50–100 candidates, then the cross-encoder re-scores those candidates precisely. You get bi-encoder speed <em>and</em> cross-encoder quality.</p>`,`<p class="stage-desc">Keine der beiden Architekturen ist allein ideal. Produktive RAG-Systeme kombinieren sie: Der Bi-Encoder durchsucht den gesamten Korpus und erzeugt eine Shortlist von ~50–100 Kandidaten, dann bewertet der Cross-Encoder diese Kandidaten präzise neu. Man bekommt Bi-Encoder-Geschwindigkeit <em>und</em> Cross-Encoder-Qualität.</p>`);
  h += `<div class="formula">${L('corpus (10M docs)','Korpus (10 Mio. Dokumente)')}&nbsp;→&nbsp;<span class="hl">Bi-Encoder Top-100</span>&nbsp;→&nbsp;<span class="rust">Cross-Encoder Top-5</span>&nbsp;→&nbsp;${L('LLM context','LLM-Kontext')}</div>`;

  // Latency comparison chart (scaling with corpus size)
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">📊 Latency at scale · why two stages are necessary</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">📊 Latenz im großen Maßstab · warum zwei Stufen nötig sind</h3>`);
  h += L(`<p class="stage-desc">The bar chart below shows approximate query latency (in ms) for each approach, assuming a realistic mix of CPU vector index + GPU cross-encoder. Note the different time scales.</p>`,`<p class="stage-desc">Das Balkendiagramm unten zeigt die ungefähre Anfrage-Latenz (in ms) für jeden Ansatz, bei einer realistischen Mischung aus CPU-Vektorindex + GPU-Cross-Encoder. Beachte die unterschiedlichen Zeitskalen.</p>`);
  const scenarios = [
    {name: L('Corpus: 1k docs','Korpus: 1k Dokumente'),   bi: 2,    crossFull: 100,   twoStage: 12},
    {name: L('Corpus: 100k docs','Korpus: 100k Dokumente'), bi: 5,    crossFull: 10000, twoStage: 15},
    {name: L('Corpus: 10M docs','Korpus: 10 Mio. Dokumente'),  bi: 12,   crossFull: 1000000, twoStage: 22},
  ];
  h += `<div class="latency-chart">`;
  scenarios.forEach(s => {
    h += `<div style="font-family:var(--mono);font-size:0.75rem;color:var(--txt);font-weight:600;margin:0.7rem 0 0.3rem;">${s.name}</div>`;
    // Scale bars relative to max of this scenario
    const maxLat = Math.max(s.bi, s.crossFull, s.twoStage);
    const fmtLat = ms => ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms/1000).toFixed(1)} s` : `${(ms/60000).toFixed(1)} min`;
    h += `<div class="lat-row"><span class="lat-label">Bi-Encoder</span><div class="lat-bar"><div class="lat-fill" style="width:${(s.bi/maxLat)*100}%;background:var(--acc);"></div></div><span class="lat-val">${fmtLat(s.bi)}</span></div>`;
    h += `<div class="lat-row"><span class="lat-label">Cross-Encoder (naiv)</span><div class="lat-bar"><div class="lat-fill" style="width:100%;background:var(--red);"></div></div><span class="lat-val">${fmtLat(s.crossFull)}</span></div>`;
    h += `<div class="lat-row"><span class="lat-label">${L('two-stage','zweistufig')}</span><div class="lat-bar"><div class="lat-fill" style="width:${(s.twoStage/maxLat)*100}%;background:var(--rust);"></div></div><span class="lat-val">${fmtLat(s.twoStage)}</span></div>`;
  });
  h += `</div>`;

  h += L(`<div class="info ir"><div class="il">Notice the scaling</div>
At 10M documents, a naive cross-encoder would take <strong>~16 minutes per query</strong> — obviously unusable. The two-stage pipeline stays around <strong>~22 ms</strong> regardless of corpus size, because the cross-encoder only runs on a fixed shortlist of 100 candidates. This decoupling is the entire reason production systems use both architectures.</div>`,`<div class="info ir"><div class="il">Beachte die Skalierung</div>
Bei 10 Mio. Dokumenten bräuchte ein naiver Cross-Encoder <strong>~16 Minuten pro Anfrage</strong> — offensichtlich unbrauchbar. Die zweistufige Pipeline bleibt unabhängig von der Korpusgröße bei etwa <strong>~22 ms</strong>, weil der Cross-Encoder nur auf einer festen Shortlist von 100 Kandidaten läuft. Diese Entkopplung ist der ganze Grund, warum produktive Systeme beide Architekturen nutzen.</div>`);

  // Re-ranking before/after demo
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Re-ranking in action · before vs after</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Re-Ranking in Aktion · vorher vs. nachher</h3>`);
  h += L(`<p class="stage-desc">Below is a simulated re-ranking of the top-5 results for the current query. The cross-encoder scores are hand-crafted to show how re-ranking can shuffle the order — a document that was rank 4 in bi-encoder scores can jump to rank 1 because the cross-encoder reads it more carefully.</p>`,`<p class="stage-desc">Unten ein simuliertes Re-Ranking der Top-5-Ergebnisse für die aktuelle Anfrage. Die Cross-Encoder-Scores sind handgesetzt, um zu zeigen, wie Re-Ranking die Reihenfolge durchmischen kann — ein Dokument, das bei den Bi-Encoder-Scores auf Rang 4 lag, kann auf Rang 1 springen, weil der Cross-Encoder es genauer liest.</p>`);

  // Take top-5 bi-encoder
  const top5 = scored.slice(0, 5);
  // Simulate cross-encoder re-ranking: permute with a deterministic "better" order
  // We boost docs whose text length matches query topic more precisely
  const crossScores = top5.map((d, i) => ({
    ...d,
    // Simulated cross-encoder: amplifies differences, injects some reshuffling
    crossScore: +(0.5 + 0.4 * Math.sin(d.score * 7 + i * 2.3) + d.score * 0.1).toFixed(3)
  }));
  const afterRerank = [...crossScores].sort((a, b) => b.crossScore - a.crossScore);

  h += `<div class="rerank-grid">
<div class="rerank-col before">
<h4>${L('Before · bi-encoder top-5','Vorher · Bi-Encoder Top-5')}</h4>`;
  top5.forEach((d, i) => {
    h += `<div class="rerank-item"><span class="rank">${i + 1}</span><span class="id">${d.id}</span><span class="score">${fmt(d.score)}</span></div>`;
  });
  h += `</div>
<div class="rerank-arrow">→</div>
<div class="rerank-col after">
<h4>${L('After · cross-encoder re-scored','Nachher · vom Cross-Encoder neu bewertet')}</h4>`;
  afterRerank.forEach((d, newRank) => {
    const oldRank = top5.findIndex(t => t.id === d.id);
    const moved = newRank < oldRank ? 'moved-up' : newRank > oldRank ? 'moved-down' : '';
    const arrow = newRank < oldRank ? '↑' : newRank > oldRank ? '↓' : '·';
    h += `<div class="rerank-item ${moved}"><span class="rank">${newRank + 1}</span><span class="id">${d.id}</span><span style="color:var(--txt3);font-family:var(--mono);font-size:0.66rem;">${arrow} ${L('was','war')} ${oldRank + 1}</span><span class="score">${fmt(d.crossScore)}</span></div>`;
  });
  h += `</div>
</div>`;

  h += L(`<div class="info iac"><div class="il">Why re-ranking matters in practice</div>
The bi-encoder has to decide "is this doc relevant?" without ever looking at the doc and query together. The cross-encoder can notice things like "the query asks about <em>causes</em> but this passage only lists <em>effects</em>" — a relational distinction that a single dot product cannot capture. Empirically, re-ranking typically improves NDCG@10 by <strong>5–15 percentage points</strong> over bi-encoder-only retrieval (Nogueira &amp; Cho 2019; Thakur et al. 2021).</div>`,`<div class="info iac"><div class="il">Warum Re-Ranking in der Praxis wichtig ist</div>
Der Bi-Encoder muss „Ist dieses Dokument relevant?" entscheiden, ohne Dokument und Anfrage je zusammen zu sehen. Der Cross-Encoder kann Dinge bemerken wie „die Anfrage fragt nach <em>Ursachen</em>, aber diese Passage listet nur <em>Wirkungen</em>" — eine relationale Unterscheidung, die ein einzelnes Skalarprodukt nicht erfassen kann. Empirisch verbessert Re-Ranking NDCG@10 typischerweise um <strong>5–15 Prozentpunkte</strong> gegenüber reinem Bi-Encoder-Retrieval (Nogueira &amp; Cho 2019; Thakur et al. 2021).</div>`);

  h += L(`<div class="info ig"><div class="il">Library analogy</div>
<strong>Bi-encoder</strong> is like reading only the book titles on a shelf. You can scan thousands of books per minute, and you'll narrow a library down to 20 plausible candidates. But you'll sometimes miss a great book whose title doesn't match what you expected.<br><br>
<strong>Cross-encoder</strong> is like actually opening each book and skimming it with your specific question in mind. Much slower — a minute per book — but now you can tell which ones <em>really</em> answer the question.<br><br>
You wouldn't skim every book in the library, but skimming the 20 candidates the title-scan gave you? Perfectly manageable. That's retrieve-then-rerank in one sentence.</div>`,`<div class="info ig"><div class="il">Bibliotheks-Analogie</div>
Der <strong>Bi-Encoder</strong> ist, als würde man nur die Buchtitel im Regal lesen. Man schafft Tausende Bücher pro Minute und grenzt eine Bibliothek auf 20 plausible Kandidaten ein. Aber manchmal übersieht man ein großartiges Buch, dessen Titel nicht zu dem passt, was man erwartet hat.<br><br>
Der <strong>Cross-Encoder</strong> ist, als würde man jedes Buch tatsächlich aufschlagen und mit der konkreten Frage im Kopf überfliegen. Viel langsamer — eine Minute pro Buch — aber jetzt erkennt man, welche die Frage <em>wirklich</em> beantworten.<br><br>
Man würde nicht jedes Buch der Bibliothek überfliegen, aber die 20 Kandidaten aus dem Titel-Scan? Gut machbar. Das ist Retrieve-then-Rerank in einem Satz.</div>`);

  return h;
}},

// ───────────────────── 9. AUGMENT PROMPT ─────────────────────
{id: 'augment', get title(){return L('Prompt Augmentation','Prompt-Anreicherung');}, get group(){return L('Generation','Generierung');},
render() {
  const {query, retrieved} = computeRetrieval();
  let h = L(`<div class="stage-title">Step 7 · Augment the Prompt <span class="tag tst">AUGMENT</span></div>`,`<div class="stage-title">Schritt 7 · Den Prompt anreichern <span class="tag tst">AUGMENT</span></div>`);
  h += L(`<p class="stage-desc">Now we assemble the final prompt. The retrieved chunks are concatenated into a <strong>context block</strong>, wrapped with system instructions that tell the LLM to answer <em>only based on the provided context</em>, and the user's query is appended at the end.</p>`,`<p class="stage-desc">Jetzt bauen wir den endgültigen Prompt zusammen. Die abgerufenen Chunks werden zu einem <strong>Kontextblock</strong> konkateniert, eingerahmt von Systemanweisungen, die dem LLM sagen, <em>nur auf Basis des bereitgestellten Kontexts</em> zu antworten, und die Nutzeranfrage wird am Ende angehängt.</p>`);

  h += L(`<div class="info ist"><div class="il">The prompt template</div>
Typically looks like:
<div class="formula" style="margin:0.6rem 0;">[SYSTEM]&nbsp;<span class="cm">rules for the model</span><br>[CONTEXT]&nbsp;<span class="cm">retrieved chunks, numbered</span><br>[QUERY]&nbsp;<span class="cm">user question</span><br>[ANSWER]&nbsp;<span class="cm">← LLM completes from here</span></div>
The exact wording varies but the structure is universal.</div>`,`<div class="info ist"><div class="il">Die Prompt-Vorlage</div>
Sieht typischerweise so aus:
<div class="formula" style="margin:0.6rem 0;">[SYSTEM]&nbsp;<span class="cm">Regeln für das Modell</span><br>[CONTEXT]&nbsp;<span class="cm">abgerufene Chunks, nummeriert</span><br>[QUERY]&nbsp;<span class="cm">Nutzerfrage</span><br>[ANSWER]&nbsp;<span class="cm">← ab hier vervollständigt das LLM</span></div>
Die genaue Formulierung variiert, aber die Struktur ist universell.</div>`);

  // Build the actual prompt
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">The augmented prompt (what actually gets sent to the LLM)</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Der angereicherte Prompt (was tatsächlich an das LLM geschickt wird)</h3>`);
  let promptText = `<span class="label">${L('System instructions','Systemanweisungen')}</span><span class="sys">You are a helpful assistant. Answer the user's question using ONLY the provided context. If the answer is not in the context, say "I don't know." Cite sources by their doc_id.</span>

<span class="label">${L('Retrieved context','Abgerufener Kontext')} (top-${TOP_K})</span>`;
  retrieved.forEach((d, i) => {
    promptText += `\n<span class="ctx">[${d.id}] ${d.text}</span>`;
  });
  promptText += `\n\n<span class="label">${L('User query','Nutzeranfrage')}</span><span class="q">${query.text}</span>

<span class="label">${L('Answer','Antwort')}</span><span class="a">___</span>`;
  h += `<div class="prompt-box">${promptText}</div>`;

  h += L(`<div class="info iac"><div class="il">Why the explicit instructions?</div>
Without the "use ONLY the provided context" clause, the LLM will happily blend its own memorized knowledge with the retrieved passages — defeating the grounding guarantee. Well-engineered RAG prompts are extremely firm about this: "if the answer is not in the context, say so." The stricter the instructions, the more auditable the system.</div>`,`<div class="info iac"><div class="il">Warum die expliziten Anweisungen?</div>
Ohne die Klausel „NUR den bereitgestellten Kontext verwenden" vermischt das LLM munter sein eigenes auswendig gelerntes Wissen mit den abgerufenen Passagen — und die Fundierungsgarantie ist dahin. Gut gebaute RAG-Prompts sind hier extrem streng: „Wenn die Antwort nicht im Kontext steht, sag es." Je strenger die Anweisungen, desto überprüfbarer das System.</div>`);

  h += L(`<div class="info ig"><div class="il">Context window budget</div>
Every chunk in the context takes up tokens in the LLM's context window. For a 16k-token window:<br>
• System prompt: ~200 tokens<br>
• User query: ~50 tokens<br>
• Room for context: ~15 000 tokens<br>
• At 500 tokens/chunk, that's a hard ceiling of ~30 chunks per query.<br><br>
In practice you want <em>far fewer</em> — 3 to 10 well-chosen chunks beat 30 mediocre ones, because the LLM's attention dilutes as context grows ("lost in the middle" effect).</div>`,`<div class="info ig"><div class="il">Budget des Kontextfensters</div>
Jeder Chunk im Kontext belegt Token im Kontextfenster des LLM. Bei einem 16k-Token-Fenster:<br>
• System-Prompt: ~200 Token<br>
• Nutzeranfrage: ~50 Token<br>
• Platz für Kontext: ~15 000 Token<br>
• Bei 500 Token/Chunk ist das eine harte Obergrenze von ~30 Chunks pro Anfrage.<br><br>
In der Praxis will man <em>viel weniger</em> — 3 bis 10 gut gewählte Chunks schlagen 30 mittelmäßige, weil die Aufmerksamkeit des LLM mit wachsendem Kontext verwässert („Lost in the middle"-Effekt).</div>`);

  return h;
}},

// ───────────────────── 10. GENERATION ─────────────────────
{id: 'generation', get title(){return L('Generation','Generierung');}, get group(){return L('Generation','Generierung');},
render() {
  const {query, retrieved} = computeRetrieval();
  let h = L(`<div class="stage-title">Step 8 · LLM Generation <span class="tag tac">GENERATE</span></div>`,`<div class="stage-title">Schritt 8 · LLM-Generierung <span class="tag tac">GENERATE</span></div>`);
  h += L(`<p class="stage-desc">Finally, the augmented prompt is sent to a language model, which generates an answer conditioned on the retrieved context. Because the model sees specific factual passages, it can <strong>quote them, paraphrase them, and cite them</strong> — rather than pulling answers from its training memory.</p>`,`<p class="stage-desc">Schließlich wird der angereicherte Prompt an ein Sprachmodell geschickt, das eine auf den abgerufenen Kontext bedingte Antwort generiert. Weil das Modell konkrete Faktenpassagen sieht, kann es sie <strong>zitieren, paraphrasieren und belegen</strong> — statt Antworten aus seinem Trainingsgedächtnis zu ziehen.</p>`);

  h += `<div class="formula">answer = LLM( <span class="hl">augmented_prompt</span> )&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('standard autoregressive generation','gewöhnliche autoregressive Generierung')}</span></div>`;

  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">With retrieval vs without retrieval</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Mit Retrieval vs. ohne Retrieval</h3>`);
  h += L(`<p class="stage-desc">The same query, asked of the same LLM, with and without the retrieved context. Notice how RAG produces specific, grounded, citable answers, while the closed-book version either hedges or confabulates.</p>`,`<p class="stage-desc">Dieselbe Anfrage an dasselbe LLM, mit und ohne abgerufenen Kontext. Beachte, wie RAG konkrete, fundierte, belegbare Antworten liefert, während die Closed-Book-Version entweder ausweicht oder konfabuliert.</p>`);

  h += `<div class="answer-grid">
<div class="answer-card bad">
<div class="lbl">${L('Without RAG · closed-book','Ohne RAG · Closed-Book')}</div>
<div class="txt">${query.withoutRag}</div>
</div>
<div class="answer-card good">
<div class="lbl">${L('With RAG · grounded','Mit RAG · fundiert')}</div>
<div class="txt">${query.withRag}</div>
</div>
</div>`;

  h += L(`<div class="info iac"><div class="il">What makes a good RAG answer</div>
<strong>1. Faithful</strong> — every claim traces back to a retrieved passage, nothing invented.<br>
<strong>2. Cited</strong> — each factual statement points to the chunk it came from.<br>
<strong>3. Complete</strong> — uses all the relevant retrieved information, not just the first chunk.<br>
<strong>4. Honest about gaps</strong> — if the context doesn't contain the answer, the model says so instead of filling in from memory.</div>`,`<div class="info iac"><div class="il">Was eine gute RAG-Antwort ausmacht</div>
<strong>1. Treu</strong> — jede Aussage lässt sich auf eine abgerufene Passage zurückführen, nichts ist erfunden.<br>
<strong>2. Belegt</strong> — jede Faktenaussage verweist auf den Chunk, aus dem sie stammt.<br>
<strong>3. Vollständig</strong> — nutzt alle relevanten abgerufenen Informationen, nicht nur den ersten Chunk.<br>
<strong>4. Ehrlich bei Lücken</strong> — enthält der Kontext die Antwort nicht, sagt das Modell das, statt aus dem Gedächtnis aufzufüllen.</div>`);

  h += L(`<div class="info ig"><div class="il">The LLM is frozen too</div>
Notice that in standard RAG, the LLM itself is never trained or fine-tuned. It's used as-is. All the "knowledge" lives in the vector database, and updating knowledge means updating the database — no retraining, no fine-tuning, no re-deployment of the model. This is RAG's biggest operational advantage: the model and the knowledge are decoupled.</div>`,`<div class="info ig"><div class="il">Auch das LLM ist eingefroren</div>
Beachte, dass im Standard-RAG das LLM selbst nie trainiert oder feinjustiert wird. Es wird so verwendet, wie es ist. Das gesamte „Wissen" lebt in der Vektordatenbank, und Wissen zu aktualisieren heißt, die Datenbank zu aktualisieren — kein Neutraining, kein Fine-Tuning, kein erneutes Ausrollen des Modells. Das ist der größte operative Vorteil von RAG: Modell und Wissen sind entkoppelt.</div>`);

  // ── Temperature section ──
  h += L(`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">Where does temperature fit in?</h3>`,`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">Wo passt die Temperatur hinein?</h3>`);
  h += L(`<p class="stage-desc">At the very end of this step, when the LLM actually generates tokens, the standard sampling hyperparameters apply — <code>temperature</code>, <code>top-k</code>, <code>top-p</code>. They operate on the <strong>final softmax over the vocabulary</strong>, exactly as in any non-RAG LLM. The retrieval pipeline has no influence on them and they have no influence on the retrieval pipeline.</p>`,`<p class="stage-desc">Ganz am Ende dieses Schritts, wenn das LLM tatsächlich Token erzeugt, gelten die üblichen Sampling-Hyperparameter — <code>temperature</code>, <code>top-k</code>, <code>top-p</code>. Sie wirken auf den <strong>finalen Softmax über das Vokabular</strong>, genau wie bei jedem LLM ohne RAG. Die Retrieval-Pipeline hat keinen Einfluss auf sie, und sie haben keinen Einfluss auf die Retrieval-Pipeline.</p>`);

  h += L(`<div class="info ip"><div class="il">Temperature recap (from the GPT decoder simulator)</div>
Temperature <code>T</code> divides the final logits before softmax:
<div class="formula" style="margin:0.6rem 0;">P(next token) = softmax( logits / <span class="hl">T</span> )</div>
<strong>T &lt; 1</strong> → sharper distribution, more deterministic output. Good for factual RAG answers where you want the model to commit to what the context says.<br>
<strong>T = 1</strong> → the model's natural distribution.<br>
<strong>T &gt; 1</strong> → flatter distribution, more creative/varied output. Rarely what you want in RAG — it can cause the model to wander away from the retrieved facts.</div>`,`<div class="info ip"><div class="il">Temperatur-Rekapitulation (aus dem GPT-Decoder-Simulator)</div>
Die Temperatur <code>T</code> teilt die finalen Logits vor dem Softmax:
<div class="formula" style="margin:0.6rem 0;">P(next token) = softmax( logits / <span class="hl">T</span> )</div>
<strong>T &lt; 1</strong> → schärfere Verteilung, deterministischere Ausgabe. Gut für faktische RAG-Antworten, bei denen sich das Modell auf das festlegen soll, was der Kontext sagt.<br>
<strong>T = 1</strong> → die natürliche Verteilung des Modells.<br>
<strong>T &gt; 1</strong> → flachere Verteilung, kreativere/variablere Ausgabe. In RAG selten gewünscht — das Modell kann sich von den abgerufenen Fakten entfernen.</div>`);

  h += L(`<div class="info iac"><div class="il">Recommended temperature for RAG</div>
Most production RAG systems set <strong>temperature = 0 to 0.3</strong>, deliberately pushing the model toward deterministic, committed answers:<br><br>
<strong>Why low?</strong> You retrieved specific passages for a reason. You want the model to <em>use</em> those facts, not to improvise around them. High temperature makes the model more likely to paraphrase loosely, fill in gaps from memory, or pick a less-supported token — all of which weaken the grounding guarantee that RAG is supposed to provide.<br><br>
<strong>Exception:</strong> if the task is generative rather than factual (e.g., "write a marketing blurb using these product specs"), a moderate temperature (0.5–0.7) can help produce varied phrasings while the retrieved context still anchors the content.</div>`,`<div class="info iac"><div class="il">Empfohlene Temperatur für RAG</div>
Die meisten produktiven RAG-Systeme setzen <strong>Temperatur = 0 bis 0,3</strong> und drängen das Modell bewusst zu deterministischen, festgelegten Antworten:<br><br>
<strong>Warum niedrig?</strong> Man hat aus gutem Grund konkrete Passagen abgerufen. Das Modell soll diese Fakten <em>nutzen</em>, nicht um sie herum improvisieren. Eine hohe Temperatur macht es wahrscheinlicher, dass das Modell locker paraphrasiert, Lücken aus dem Gedächtnis füllt oder einen weniger gestützten Token wählt — all das schwächt die Fundierungsgarantie, die RAG eigentlich bieten soll.<br><br>
<strong>Ausnahme:</strong> Ist die Aufgabe generativ statt faktisch (z. B. „schreibe einen Werbetext anhand dieser Produktdaten"), kann eine moderate Temperatur (0,5–0,7) helfen, abwechslungsreiche Formulierungen zu erzeugen, während der abgerufene Kontext den Inhalt weiterhin verankert.</div>`);

  // Pipeline diagram showing where temperature lives
  h += `<div class="arch-wrap">
<svg viewBox="0 0 660 180" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <defs>
    <marker id="arrT2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8778"/>
    </marker>
  </defs>

  <!-- Augmented prompt -->
  <rect x="20" y="60" width="140" height="50" rx="8" fill="#57534e22" stroke="#57534e" stroke-width="2"/>
  <text x="90" y="82" text-anchor="middle" font-size="11" fill="#57534e" ${L('font-weight="700">Augmented prompt</text>','font-weight="700">Angereicherter Prompt</text>')}
  <text x="90" y="98" text-anchor="middle" font-size="9" fill="#57534e" font-family="DM Mono, monospace">sys + ctx + query</text>

  <line x1="160" y1="85" x2="200" y2="85" stroke="#8b8778" stroke-width="2" marker-end="url(#arrT2)"/>

  <!-- LLM forward -->
  <rect x="200" y="60" width="130" height="50" rx="8" fill="#16653428" stroke="#166534" stroke-width="2"/>
  <text x="265" y="82" text-anchor="middle" font-size="11" fill="#166534" ${L('font-weight="700">LLM forward pass</text>','font-weight="700">LLM-Forward-Pass</text>')}
  <text x="265" y="98" text-anchor="middle" font-size="9" fill="#57534e" font-family="DM Mono, monospace">attention, FFN, ...</text>

  <line x1="330" y1="85" x2="370" y2="85" stroke="#8b8778" stroke-width="2" marker-end="url(#arrT2)"/>

  <!-- Logits -->
  <rect x="370" y="60" width="100" height="50" rx="8" fill="#0369a128" stroke="#0369a1" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-size="11" fill="#0369a1" font-weight="700">Logits</text>
  <text x="420" y="98" text-anchor="middle" font-size="9" fill="#57534e" font-family="DM Mono, monospace">[V]</text>

  <line x1="470" y1="85" x2="510" y2="85" stroke="#8b8778" stroke-width="2" marker-end="url(#arrT2)"/>
  <text x="490" y="78" text-anchor="middle" font-size="9" fill="#7e22ce" font-family="DM Mono, monospace">÷ T</text>

  <!-- Softmax + sample -->
  <rect x="510" y="60" width="130" height="50" rx="8" fill="#7e22ce28" stroke="#7e22ce" stroke-width="2"/>
  <text x="575" y="82" text-anchor="middle" font-size="11" fill="#7e22ce" ${L('font-weight="700">Softmax → sample</text>','font-weight="700">Softmax → Sampling</text>')}
  <text x="575" y="98" text-anchor="middle" font-size="9" fill="#57534e" font-family="DM Mono, monospace">top-k, top-p</text>

  <!-- RAG scope bracket (left) -->
  <line x1="20" y1="140" x2="330" y2="140" stroke="#c2410c" stroke-width="2"/>
  <line x1="20" y1="140" x2="20" y2="130" stroke="#c2410c" stroke-width="2"/>
  <line x1="330" y1="140" x2="330" y2="130" stroke="#c2410c" stroke-width="2"/>
  <text x="175" y="158" text-anchor="middle" font-size="10" fill="#c2410c" ${L('font-weight="600">RAG pipeline (retrieval + prompt)</text>','font-weight="600">RAG-Pipeline (Retrieval + Prompt)</text>')}

  <!-- Sampling scope bracket (right) -->
  <line x1="370" y1="140" x2="640" y2="140" stroke="#7e22ce" stroke-width="2"/>
  <line x1="370" y1="140" x2="370" y2="130" stroke="#7e22ce" stroke-width="2"/>
  <line x1="640" y1="140" x2="640" y2="130" stroke="#7e22ce" stroke-width="2"/>
  <text x="505" y="158" text-anchor="middle" font-size="10" fill="#7e22ce" ${L('font-weight="600">Sampling (temperature, top-k, top-p)</text>','font-weight="600">Sampling (Temperatur, top-k, top-p)</text>')}

  <!-- Title -->
  <text x="330" y="25" text-anchor="middle" font-size="12" fill="#1c1a15" ${L('font-weight="700">Two independent stages</text>','font-weight="700">Zwei unabhängige Stufen</text>')}
  <text x="330" y="42" text-anchor="middle" font-size="10" fill="#57534e" ${L('font-style="italic">RAG controls what goes in; sampling controls how tokens come out</text>','font-style="italic">RAG steuert, was hineingeht; Sampling steuert, wie Token herauskommen</text>')}
</svg>
</div>`;

  // Cheat sheet — which knob lives where
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Parameter cheat sheet · which knob lives where</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Parameter-Spickzettel · welcher Regler wo sitzt</h3>`);
  h += L(`<div class="glossary"><table>
<tr><th>Parameter</th><th>Stage</th><th>What it controls</th></tr>
<tr><td class="sym" style="color:var(--rust);">chunk size, overlap</td><td class="val">Indexing</td><td><strong>How the corpus is split.</strong> Decided once when building the vector database. Affects what the retriever can see.</td></tr>
<tr><td class="sym" style="color:var(--rust);">embedding model</td><td class="val">Indexing</td><td><strong>The vector representation</strong> of chunks and queries. Must be consistent on both sides.</td></tr>
<tr><td class="sym" style="color:var(--acc);">top-k (retrieval)</td><td class="val">Retrieval</td><td><strong>How many chunks</strong> are fetched from the vector database and placed in the context. The slider in the header.</td></tr>
<tr><td class="sym" style="color:var(--acc);">similarity metric</td><td class="val">Retrieval</td><td>Usually cosine similarity. Could also be dot product or Euclidean distance.</td></tr>
<tr><td class="sym" style="color:var(--stone);">system prompt</td><td class="val">Prompting</td><td><strong>Instructions to the LLM</strong> about how to use the context ("answer only from context", "cite sources", etc.).</td></tr>
<tr><td class="sym" style="color:var(--purple);">temperature (T)</td><td class="val">Sampling</td><td><strong>Shape of the token distribution.</strong> Applied at the very end, after the LLM has already processed the retrieved context. <strong>Recommended: 0–0.3 for factual RAG.</strong></td></tr>
<tr><td class="sym" style="color:var(--purple);">top-k (sampling)</td><td class="val">Sampling</td><td><strong>Truncate to top-k tokens</strong> before sampling. Note: this is a <em>different</em> top-k from the retrieval one — same name, completely different stage!</td></tr>
<tr><td class="sym" style="color:var(--purple);">top-p (nucleus)</td><td class="val">Sampling</td><td><strong>Truncate to smallest set</strong> whose cumulative probability exceeds p, then sample.</td></tr>
</table></div>`,`<div class="glossary"><table>
<tr><th>Parameter</th><th>Stufe</th><th>Was er steuert</th></tr>
<tr><td class="sym" style="color:var(--rust);">Chunk-Größe, Überlappung</td><td class="val">Indexierung</td><td><strong>Wie der Korpus zerlegt wird.</strong> Einmal beim Aufbau der Vektordatenbank entschieden. Bestimmt, was der Retriever sehen kann.</td></tr>
<tr><td class="sym" style="color:var(--rust);">Embedding-Modell</td><td class="val">Indexierung</td><td><strong>Die Vektorrepräsentation</strong> von Chunks und Anfragen. Muss auf beiden Seiten konsistent sein.</td></tr>
<tr><td class="sym" style="color:var(--acc);">top-k (Retrieval)</td><td class="val">Retrieval</td><td><strong>Wie viele Chunks</strong> aus der Vektordatenbank geholt und in den Kontext gelegt werden. Der Regler im Header.</td></tr>
<tr><td class="sym" style="color:var(--acc);">Ähnlichkeitsmaß</td><td class="val">Retrieval</td><td>Meist Kosinus-Ähnlichkeit. Könnte auch Skalarprodukt oder euklidischer Abstand sein.</td></tr>
<tr><td class="sym" style="color:var(--stone);">System-Prompt</td><td class="val">Prompting</td><td><strong>Anweisungen an das LLM</strong>, wie der Kontext zu nutzen ist („nur aus dem Kontext antworten", „Quellen belegen" usw.).</td></tr>
<tr><td class="sym" style="color:var(--purple);">Temperatur (T)</td><td class="val">Sampling</td><td><strong>Form der Token-Verteilung.</strong> Ganz am Ende angewendet, nachdem das LLM den abgerufenen Kontext bereits verarbeitet hat. <strong>Empfohlen: 0–0,3 für faktisches RAG.</strong></td></tr>
<tr><td class="sym" style="color:var(--purple);">top-k (Sampling)</td><td class="val">Sampling</td><td><strong>Auf die Top-k-Token beschneiden</strong>, bevor gesampelt wird. Achtung: Das ist ein <em>anderes</em> top-k als beim Retrieval — gleicher Name, völlig andere Stufe!</td></tr>
<tr><td class="sym" style="color:var(--purple);">top-p (Nucleus)</td><td class="val">Sampling</td><td><strong>Auf die kleinste Menge beschneiden</strong>, deren kumulierte Wahrscheinlichkeit p überschreitet, dann samplen.</td></tr>
</table></div>`);

  h += L(`<div class="info ird"><div class="il">Watch out: two different top-k's!</div>
<strong>Retrieval top-k</strong> (rust, header slider) = how many chunks to fetch from the vector database.<br>
<strong>Sampling top-k</strong> (purple, an LLM generation parameter) = how many vocabulary tokens to consider at each generation step.<br><br>
Both are called "top-k" but they operate at completely different stages. In production systems you'd configure them separately — e.g., retrieval top-k = 5, sampling top-k = 50, temperature = 0.2.</div>`,`<div class="info ird"><div class="il">Vorsicht: zwei verschiedene top-k!</div>
<strong>Retrieval-top-k</strong> (rostrot, Regler im Header) = wie viele Chunks aus der Vektordatenbank geholt werden.<br>
<strong>Sampling-top-k</strong> (lila, ein Generierungsparameter des LLM) = wie viele Vokabular-Token bei jedem Generierungsschritt berücksichtigt werden.<br><br>
Beide heißen „top-k", wirken aber auf völlig verschiedenen Stufen. In produktiven Systemen konfiguriert man sie getrennt — z. B. Retrieval-top-k = 5, Sampling-top-k = 50, Temperatur = 0,2.</div>`);

  return h;
}},

// ───────────────────── 11. FAILURE MODES ─────────────────────
{id: 'failures', get title(){return L('Failure Modes','Fehlerbilder');}, get group(){return L('Deep Dive','Vertiefung');},
render() {
  let h = L(`<div class="stage-title">Failure Modes & How to Fix Them <span class="tag trd">PITFALLS</span></div>`,`<div class="stage-title">Fehlerbilder & wie man sie behebt <span class="tag trd">FALLSTRICKE</span></div>`);
  h += L(`<p class="stage-desc">RAG systems fail in predictable ways. Understanding these failure modes is key to building a reliable system.</p>`,`<p class="stage-desc">RAG-Systeme scheitern auf vorhersehbare Weise. Diese Fehlerbilder zu verstehen, ist der Schlüssel zu einem zuverlässigen System.</p>`);

  h += L(`<div class="info ird"><div class="il">1 · Retrieval miss — the right chunk is never fetched</div>
<strong>Symptom:</strong> The correct passage exists in the corpus but doesn't make it into the top-k for a reasonable query.<br>
<strong>Causes:</strong> Poor embedding model, wrong chunk size, vocabulary mismatch between query and corpus, overly aggressive filtering.<br>
<strong>Fixes:</strong> Swap in a stronger embedding model, use <strong>hybrid search</strong> (combine dense + BM25 keyword search), apply <strong>query rewriting</strong> (have the LLM rephrase the query first), try HyDE [6].</div>`,`<div class="info ird"><div class="il">1 · Retrieval-Fehlschlag — der richtige Chunk wird nie geholt</div>
<strong>Symptom:</strong> Die richtige Passage existiert im Korpus, schafft es aber bei einer vernünftigen Anfrage nicht in die Top-k.<br>
<strong>Ursachen:</strong> Schwaches Embedding-Modell, falsche Chunk-Größe, Vokabular-Mismatch zwischen Anfrage und Korpus, zu aggressive Filterung.<br>
<strong>Abhilfen:</strong> Ein stärkeres Embedding-Modell einsetzen, <strong>hybride Suche</strong> nutzen (dense + BM25-Schlüsselwortsuche kombinieren), <strong>Query-Rewriting</strong> anwenden (das LLM die Anfrage zuerst umformulieren lassen), HyDE [6] ausprobieren.</div>`);

  h += L(`<div class="info ird"><div class="il">2 · "Lost in the middle"</div>
<strong>Symptom:</strong> The relevant chunk is retrieved and placed in the context, but the LLM ignores it and answers from memory anyway.<br>
<strong>Cause:</strong> Liu et al. (2023) showed that LLMs systematically under-attend to the middle of long contexts — the beginning and end dominate.<br>
<strong>Fixes:</strong> Keep context short (fewer, better chunks), put the most important chunk <em>first</em>, use a cross-encoder re-ranker so the top-1 is really the most relevant.</div>`,`<div class="info ird"><div class="il">2 · „Lost in the middle"</div>
<strong>Symptom:</strong> Der relevante Chunk wird abgerufen und in den Kontext gelegt, aber das LLM ignoriert ihn und antwortet trotzdem aus dem Gedächtnis.<br>
<strong>Ursache:</strong> Liu et al. (2023) zeigten, dass LLMs die Mitte langer Kontexte systematisch zu wenig beachten — Anfang und Ende dominieren.<br>
<strong>Abhilfen:</strong> Kontext kurz halten (weniger, bessere Chunks), den wichtigsten Chunk <em>zuerst</em> platzieren, einen Cross-Encoder-Re-Ranker nutzen, damit der Top-1 wirklich der relevanteste ist.</div>`);

  h += L(`<div class="info ird"><div class="il">3 · Context poisoning</div>
<strong>Symptom:</strong> The retriever returns a chunk that is topically related but <em>factually wrong</em> or <em>contradicts</em> other retrieved chunks. The LLM may pick the wrong one.<br>
<strong>Causes:</strong> Corpus contains outdated or conflicting sources; the similarity metric can't distinguish "correct" from "plausible."<br>
<strong>Fixes:</strong> Add metadata filters (freshness, authority), use re-ranking with quality signals, have the LLM explicitly reason about conflicts in the context.</div>`,`<div class="info ird"><div class="il">3 · Kontextvergiftung</div>
<strong>Symptom:</strong> Der Retriever liefert einen Chunk, der thematisch passt, aber <em>faktisch falsch</em> ist oder anderen abgerufenen Chunks <em>widerspricht</em>. Das LLM wählt womöglich den falschen.<br>
<strong>Ursachen:</strong> Der Korpus enthält veraltete oder widersprüchliche Quellen; das Ähnlichkeitsmaß kann „richtig" nicht von „plausibel" unterscheiden.<br>
<strong>Abhilfen:</strong> Metadaten-Filter hinzufügen (Aktualität, Autorität), Re-Ranking mit Qualitätssignalen nutzen, das LLM explizit über Widersprüche im Kontext nachdenken lassen.</div>`);

  h += L(`<div class="info ird"><div class="il">4 · Chunk fragmentation</div>
<strong>Symptom:</strong> A fact is split across two chunks — the chunk boundary cuts through the middle of a key sentence — so neither chunk alone contains the answer.<br>
<strong>Fix:</strong> Use overlapping chunks (10–20% overlap) so straddling facts appear in both. Or use structure-aware chunking.</div>`,`<div class="info ird"><div class="il">4 · Chunk-Fragmentierung</div>
<strong>Symptom:</strong> Ein Fakt ist auf zwei Chunks verteilt — die Chunk-Grenze schneidet mitten durch einen Schlüsselsatz —, sodass kein Chunk allein die Antwort enthält.<br>
<strong>Abhilfe:</strong> Überlappende Chunks nutzen (10–20 % Überlappung), damit Fakten an der Grenze in beiden vorkommen. Oder strukturbewusstes Chunking.</div>`);

  h += L(`<div class="info ird"><div class="il">5 · Prompt leakage — model answers from its own memory anyway</div>
<strong>Symptom:</strong> The LLM confidently answers even when the retrieved context doesn't support the answer.<br>
<strong>Fix:</strong> Strict system prompts ("use ONLY the provided context"), and evaluation datasets that specifically test "I don't know" behavior. Models like Claude are generally good at this; some base models need heavy prompting.</div>`,`<div class="info ird"><div class="il">5 · Prompt-Leckage — das Modell antwortet trotzdem aus dem eigenen Gedächtnis</div>
<strong>Symptom:</strong> Das LLM antwortet selbstbewusst, obwohl der abgerufene Kontext die Antwort nicht stützt.<br>
<strong>Abhilfe:</strong> Strenge System-Prompts („NUR den bereitgestellten Kontext verwenden") und Evaluationsdatensätze, die gezielt das „Ich weiß es nicht"-Verhalten testen. Modelle wie Claude sind darin meist gut; manche Basismodelle brauchen viel Prompting.</div>`);

  h += L(`<div class="info iac"><div class="il">Evaluation matters</div>
RAG systems need different metrics than either pure retrieval or pure generation:<br>
• <strong>Retrieval metrics:</strong> recall@k, precision@k (did we get the right chunk?)<br>
• <strong>Faithfulness:</strong> does the answer match the retrieved context? (RAGAS, TruLens)<br>
• <strong>Answer relevance:</strong> does the answer actually address the question?<br>
• <strong>Context relevance:</strong> did we retrieve too much irrelevant stuff?<br><br>
Tools like <strong>RAGAS</strong>, <strong>TruLens</strong>, and <strong>DeepEval</strong> automate these evaluations.</div>`,`<div class="info iac"><div class="il">Evaluation ist wichtig</div>
RAG-Systeme brauchen andere Metriken als reines Retrieval oder reine Generierung:<br>
• <strong>Retrieval-Metriken:</strong> recall@k, precision@k (haben wir den richtigen Chunk erwischt?)<br>
• <strong>Treue (Faithfulness):</strong> Passt die Antwort zum abgerufenen Kontext? (RAGAS, TruLens)<br>
• <strong>Antwort-Relevanz:</strong> Geht die Antwort wirklich auf die Frage ein?<br>
• <strong>Kontext-Relevanz:</strong> Haben wir zu viel Irrelevantes abgerufen?<br><br>
Tools wie <strong>RAGAS</strong>, <strong>TruLens</strong> und <strong>DeepEval</strong> automatisieren diese Evaluationen.</div>`);

  return h;
}},

// ───────────────────── 12. VARIANTS ─────────────────────
{id: 'variants', get title(){return L('Advanced Variants','Fortgeschrittene Varianten');}, get group(){return L('Deep Dive','Vertiefung');},
render() {
  let h = L(`<div class="stage-title">Advanced RAG Variants <span class="tag tp">ADVANCED</span></div>`,`<div class="stage-title">Fortgeschrittene RAG-Varianten <span class="tag tp">FORTGESCHRITTEN</span></div>`);
  h += L(`<p class="stage-desc">The basic "embed → retrieve → stuff → generate" pipeline is now called "naive RAG". Over the past few years the field has developed many refinements. Gao et al. 2024 [8] is a good survey.</p>`,`<p class="stage-desc">Die einfache Pipeline „einbetten → abrufen → hineinpacken → generieren" heißt inzwischen „Naive RAG". In den letzten Jahren hat das Feld viele Verfeinerungen entwickelt. Gao et al. 2024 [8] ist ein guter Überblick.</p>`);

  h += L(`<div class="info ip"><div class="il">Query rewriting</div>
Before embedding, pass the user's raw query through an LLM that rewrites it into one or more better search queries. For example: "what did they say about the bug yesterday?" → "error log timestamp 2025-11-19 authentication failure". Handles conversational, underspecified, or ambiguous inputs.</div>`,`<div class="info ip"><div class="il">Query-Rewriting</div>
Vor dem Einbetten wird die rohe Nutzeranfrage durch ein LLM geschickt, das sie in eine oder mehrere bessere Suchanfragen umschreibt. Zum Beispiel: „what did they say about the bug yesterday?" → „error log timestamp 2025-11-19 authentication failure". Bewältigt konversationelle, unterspezifizierte oder mehrdeutige Eingaben.</div>`);

  h += L(`<div class="info ip"><div class="il">HyDE · Hypothetical Document Embeddings [6]</div>
Ask the LLM to write a fake answer to the query first, embed that fake answer, and retrieve against it. The fake answer lives closer in vector space to real answers than the question does — queries and answers often have different vocabularies.</div>`,`<div class="info ip"><div class="il">HyDE · Hypothetical Document Embeddings [6]</div>
Das LLM schreibt zuerst eine fiktive Antwort auf die Anfrage, diese wird eingebettet, und dagegen wird abgerufen. Die fiktive Antwort liegt im Vektorraum näher an echten Antworten als die Frage — Anfragen und Antworten haben oft unterschiedliche Vokabulare.</div>`);

  h += L(`<div class="info ip"><div class="il">Hybrid search</div>
Combine dense (embedding-based) retrieval with sparse (BM25 keyword) retrieval. Dense search catches semantic matches; sparse search catches exact terms and rare proper nouns. Scores are fused (e.g., <strong>reciprocal rank fusion</strong>). This is the practical default for production systems.</div>`,`<div class="info ip"><div class="il">Hybride Suche</div>
Dichtes (embedding-basiertes) Retrieval mit spärlichem (BM25-Schlüsselwort-)Retrieval kombinieren. Die dichte Suche erfasst semantische Treffer; die spärliche Suche erfasst exakte Begriffe und seltene Eigennamen. Die Scores werden fusioniert (z. B. <strong>Reciprocal Rank Fusion</strong>). Das ist der praktische Standard für produktive Systeme.</div>`);

  h += L(`<div class="info ip"><div class="il">Re-ranking</div>
After retrieving top-100 cheaply, re-score them with a slow but accurate <strong>cross-encoder</strong> and keep top-5. Adds ~100ms of latency but dramatically improves the quality of what actually reaches the LLM.</div>`,`<div class="info ip"><div class="il">Re-Ranking</div>
Nach dem billigen Abruf der Top-100 werden diese mit einem langsamen, aber genauen <strong>Cross-Encoder</strong> neu bewertet und die Top-5 behalten. Kostet ~100 ms Latenz, verbessert aber die Qualität dessen, was tatsächlich beim LLM ankommt, dramatisch.</div>`);

  h += L(`<div class="info ip"><div class="il">Multi-hop / agentic RAG</div>
For questions that need chained reasoning ("What is the capital of the country where Marie Curie was born?"), a single retrieval is not enough. An LLM agent issues multiple retrievals, reasons over intermediate results, and composes a final answer. Frameworks like <strong>LangGraph</strong>, <strong>DSPy</strong>, and <strong>LlamaIndex Agents</strong> implement this.</div>`,`<div class="info ip"><div class="il">Multi-Hop- / agentisches RAG</div>
Für Fragen, die verkettetes Schließen brauchen („Was ist die Hauptstadt des Landes, in dem Marie Curie geboren wurde?"), reicht ein einzelnes Retrieval nicht. Ein LLM-Agent setzt mehrere Abrufe ab, schließt über Zwischenergebnisse und setzt eine endgültige Antwort zusammen. Frameworks wie <strong>LangGraph</strong>, <strong>DSPy</strong> und <strong>LlamaIndex Agents</strong> setzen das um.</div>`);

  h += L(`<div class="info ip"><div class="il">GraphRAG</div>
Instead of (or alongside) a vector database, extract entities and relationships from the corpus into a knowledge graph. Retrieve by traversing the graph. Microsoft's GraphRAG paper showed strong results on global-summarization queries where vector search struggles.</div>`,`<div class="info ip"><div class="il">GraphRAG</div>
Statt (oder neben) einer Vektordatenbank werden Entitäten und Beziehungen aus dem Korpus in einen Wissensgraphen extrahiert. Abgerufen wird durch Traversieren des Graphen. Microsofts GraphRAG-Paper zeigte starke Ergebnisse bei globalen Zusammenfassungsanfragen, an denen die Vektorsuche scheitert.</div>`);

  h += L(`<div class="info ip"><div class="il">Self-RAG / Corrective RAG</div>
The LLM can emit special tokens telling the system to retrieve more, to discard the current retrieval, or to flag low-confidence answers. The retrieval becomes a learned decision rather than a fixed pipeline stage.</div>`,`<div class="info ip"><div class="il">Self-RAG / Corrective RAG</div>
Das LLM kann spezielle Token ausgeben, die dem System sagen, mehr abzurufen, den aktuellen Abruf zu verwerfen oder Antworten mit geringer Konfidenz zu markieren. Das Retrieval wird zu einer gelernten Entscheidung statt einer festen Pipeline-Stufe.</div>`);

  h += L(`<div class="info iac"><div class="il">Long-context LLMs vs RAG · complementary, not competitive</div>
A frequent question: "Now that LLMs have 1M-token context windows, do we still need RAG?" Yes. Long-context helps, but RAG still wins on:<br>
<strong>1. Cost</strong> — sending 1M tokens per query is ~1000× more expensive than retrieving and sending 10k.<br>
<strong>2. Latency</strong> — long-context forward passes are slow; retrieval + short context is faster.<br>
<strong>3. Freshness</strong> — the corpus can update independently of the model.<br>
<strong>4. Auditability</strong> — citing specific retrieved chunks is cleaner than "somewhere in the 1M tokens I fed you".<br>
<strong>5. Accuracy</strong> — even with long contexts, LLMs exhibit "lost in the middle". Focused context beats sprawling context.</div>`,`<div class="info iac"><div class="il">Long-Context-LLMs vs. RAG · ergänzend, nicht konkurrierend</div>
Eine häufige Frage: „Jetzt, wo LLMs Kontextfenster von 1 Mio. Token haben, brauchen wir RAG überhaupt noch?" Ja. Langer Kontext hilft, aber RAG gewinnt weiterhin bei:<br>
<strong>1. Kosten</strong> — 1 Mio. Token pro Anfrage zu senden ist ~1000× teurer als 10k abzurufen und zu senden.<br>
<strong>2. Latenz</strong> — Forward-Passes über langen Kontext sind langsam; Retrieval + kurzer Kontext ist schneller.<br>
<strong>3. Aktualität</strong> — der Korpus kann sich unabhängig vom Modell aktualisieren.<br>
<strong>4. Überprüfbarkeit</strong> — konkrete abgerufene Chunks zu zitieren ist sauberer als „irgendwo in der Million Token, die ich dir gegeben habe".<br>
<strong>5. Genauigkeit</strong> — auch bei langem Kontext zeigen LLMs „Lost in the middle". Fokussierter Kontext schlägt ausufernden Kontext.</div>`);

  return h;
}},

// ───────────────────── 13. QUIZ ─────────────────────
{id: 'quiz', get title(){return L('Quiz','Quiz');}, get group(){return L('Quiz','Quiz');},
render() {
  let h = L(`<div class="stage-title">Test Your Understanding <span class="tag tg">QUIZ</span></div>`,`<div class="stage-title">Teste dein Verständnis <span class="tag tg">QUIZ</span></div>`);
  h += L(`<p class="stage-desc">Seven questions covering the RAG pipeline end to end.</p>`,`<p class="stage-desc">Sieben Fragen, die die RAG-Pipeline von Anfang bis Ende abdecken.</p>`);

  const questions = [
    {
      q: L("What problem does RAG primarily solve?","Welches Problem löst RAG in erster Linie?"),
      opts: [
        {t: L("It makes the LLM faster at inference","Es macht das LLM bei der Inferenz schneller"), ok: false},
        {t: L("It grounds LLM outputs in retrieved source documents, addressing hallucination, knowledge cutoff, and lack of traceability","Es verankert LLM-Ausgaben in abgerufenen Quelldokumenten und geht damit Halluzination, Wissens-Cutoff und fehlende Nachvollziehbarkeit an"), ok: true},
        {t: L("It reduces the number of parameters in the LLM","Es reduziert die Anzahl der Parameter im LLM"), ok: false},
        {t: L("It replaces the need for any LLM","Es macht jedes LLM überflüssig"), ok: false},
      ],
      fb: L("RAG addresses four problems of closed-book LLMs simultaneously: hallucination, knowledge cutoff, lack of traceability, and expensive updating. The LLM becomes a reading-comprehension engine over a live corpus.","RAG geht vier Probleme von Closed-Book-LLMs gleichzeitig an: Halluzination, Wissens-Cutoff, fehlende Nachvollziehbarkeit und teure Updates. Das LLM wird zu einer Leseverständnis-Maschine über einem lebendigen Korpus.")
    },
    {
      q: L("Why is it critical to embed the query with the SAME model used for the corpus?","Warum ist es entscheidend, die Anfrage mit DEMSELBEN Modell einzubetten wie den Korpus?"),
      opts: [
        {t: L("For licensing reasons","Aus Lizenzgründen"), ok: false},
        {t: L("Different models produce vectors in different, incomparable vector spaces — cosine similarity across spaces is meaningless","Verschiedene Modelle erzeugen Vektoren in verschiedenen, nicht vergleichbaren Vektorräumen — Kosinus-Ähnlichkeit über Räume hinweg ist bedeutungslos"), ok: true},
        {t: L("Mixing models is slower","Modelle zu mischen ist langsamer"), ok: false},
        {t: L("It's not critical, any embedding model works","Es ist nicht entscheidend, jedes Embedding-Modell funktioniert"), ok: false},
      ],
      fb: L("Each embedding model has its own learned geometry. A vector from model A and a vector from model B live in fundamentally different spaces, so their dot product has no semantic meaning. Always use one model consistently.","Jedes Embedding-Modell hat seine eigene gelernte Geometrie. Ein Vektor aus Modell A und ein Vektor aus Modell B leben in grundlegend verschiedenen Räumen, also hat ihr Skalarprodukt keine semantische Bedeutung. Immer ein Modell konsistent verwenden.")
    },
    {
      q: L("Why are vectors L2-normalized before computing similarity?","Warum werden Vektoren vor der Ähnlichkeitsberechnung L2-normalisiert?"),
      opts: [
        {t: L("To save disk space","Um Speicherplatz zu sparen"), ok: false},
        {t: L("So cosine similarity reduces to a simple dot product, and similarity depends only on direction (meaning) not magnitude","Damit sich die Kosinus-Ähnlichkeit auf ein einfaches Skalarprodukt reduziert und die Ähnlichkeit nur von der Richtung (Bedeutung) abhängt, nicht vom Betrag"), ok: true},
        {t: L("Because it's required by the BM25 algorithm","Weil der BM25-Algorithmus es verlangt"), ok: false},
        {t: L("Because unnormalized vectors would overflow","Weil unnormalisierte Vektoren überlaufen würden"), ok: false},
      ],
      fb: L("With ||v|| = 1 for all vectors, cosine(a,b) = a·b — a single dot product instead of divisions. And the ranking depends on angle (meaning) not length (which is often an arbitrary artifact of the embedding model).","Mit ||v|| = 1 für alle Vektoren gilt cosine(a,b) = a·b — ein einziges Skalarprodukt statt Divisionen. Und die Rangfolge hängt vom Winkel (Bedeutung) ab, nicht von der Länge (die oft ein willkürliches Artefakt des Embedding-Modells ist).")
    },
    {
      q: L("What is the main disadvantage of very large chunks (~2000 tokens)?","Was ist der Hauptnachteil sehr großer Chunks (~2000 Token)?"),
      opts: [
        {t: L("They're slower to embed","Sie lassen sich langsamer einbetten"), ok: false},
        {t: L("Retrieval becomes less precise because the relevant sentence is buried among irrelevant ones, and fewer chunks fit in the LLM's context window","Das Retrieval wird unpräziser, weil der relevante Satz zwischen irrelevanten begraben liegt, und ins Kontextfenster des LLM passen weniger Chunks"), ok: true},
        {t: L("Cosine similarity doesn't work on long chunks","Kosinus-Ähnlichkeit funktioniert bei langen Chunks nicht"), ok: false},
        {t: L("They can't be stored in vector databases","Sie lassen sich nicht in Vektordatenbanken speichern"), ok: false},
      ],
      fb: L("Large chunks give you more context per chunk, but the embedding becomes a fuzzy average of many topics, hurting retrieval precision. You also can't fit many of them in the LLM's context window.","Große Chunks liefern mehr Kontext pro Chunk, aber das Embedding wird zu einem unscharfen Durchschnitt vieler Themen, was die Retrieval-Präzision verschlechtert. Außerdem passen nicht viele davon ins Kontextfenster des LLM.")
    },
    {
      q: L("What does HyDE (Hypothetical Document Embeddings) do?","Was macht HyDE (Hypothetical Document Embeddings)?"),
      opts: [
        {t: L("It embeds queries and documents into different spaces","Es bettet Anfragen und Dokumente in verschiedene Räume ein"), ok: false},
        {t: L("It asks an LLM to write a fake answer to the query first, then embeds that fake answer and retrieves against it","Es lässt ein LLM zuerst eine fiktive Antwort auf die Anfrage schreiben, bettet diese ein und ruft dagegen ab"), ok: true},
        {t: L("It uses only the first word of the query","Es nutzt nur das erste Wort der Anfrage"), ok: false},
        {t: L("It's another name for BM25","Es ist ein anderer Name für BM25"), ok: false},
      ],
      fb: L("HyDE's insight: a fake answer lives closer in vector space to real answers than a question does, because questions and answers use different vocabularies. Embed the fake answer and search with that.","Die Einsicht hinter HyDE: Eine fiktive Antwort liegt im Vektorraum näher an echten Antworten als eine Frage, weil Fragen und Antworten unterschiedliche Vokabulare nutzen. Die fiktive Antwort einbetten und damit suchen.")
    },
    {
      q: L("In the 'lost in the middle' phenomenon, what does the LLM do?","Was tut das LLM beim Phänomen „Lost in the middle\"?"),
      opts: [
        {t: L("Loses the beginning of the context","Es verliert den Anfang des Kontexts"), ok: false},
        {t: L("Systematically under-attends to information placed in the middle of a long context, favoring the beginning and end","Es beachtet Informationen in der Mitte eines langen Kontexts systematisch zu wenig und bevorzugt Anfang und Ende"), ok: true},
        {t: L("Randomly deletes tokens from the middle","Es löscht zufällig Token aus der Mitte"), ok: false},
        {t: L("Only works if the query is in the middle","Es funktioniert nur, wenn die Anfrage in der Mitte steht"), ok: false},
      ],
      fb: L("Liu et al. 2023 showed that LLMs have U-shaped attention to long contexts: they use the first few and last few chunks but often ignore what's in the middle. Keep contexts short and put the most important chunk first.","Liu et al. 2023 zeigten, dass LLMs lange Kontexte U-förmig beachten: Sie nutzen die ersten und letzten Chunks, ignorieren aber oft, was in der Mitte steht. Kontexte kurz halten und den wichtigsten Chunk zuerst platzieren.")
    },
    {
      q: L("After training, how do you update a RAG system's knowledge with new information?","Wie aktualisiert man nach dem Training das Wissen eines RAG-Systems mit neuen Informationen?"),
      opts: [
        {t: L("Re-train the LLM from scratch","Das LLM von Grund auf neu trainieren"), ok: false},
        {t: L("Fine-tune the LLM on the new data","Das LLM auf den neuen Daten feinjustieren"), ok: false},
        {t: L("Add the new documents to the vector database — the LLM doesn't need to change","Die neuen Dokumente zur Vektordatenbank hinzufügen — das LLM muss sich nicht ändern"), ok: true},
        {t: L("RAG systems can't be updated","RAG-Systeme lassen sich nicht aktualisieren"), ok: false},
      ],
      fb: L("This is RAG's biggest operational advantage: knowledge lives in the vector database, not the model weights. Updating knowledge means adding documents — no retraining, no fine-tuning, no redeployment of the LLM.","Das ist der größte operative Vorteil von RAG: Wissen lebt in der Vektordatenbank, nicht in den Modellgewichten. Wissen zu aktualisieren heißt Dokumente hinzufügen — kein Neutraining, kein Fine-Tuning, kein erneutes Ausrollen des LLM.")
    },
  ];

  questions.forEach((q, i) => {
    h += `<div class="quiz-q">
<div class="qnum">${L('Question','Frage')} ${i + 1}</div>
<div class="qtext">${q.q}</div>`;
    q.opts.forEach(o => {
      h += `<button class="quiz-opt" onclick="quizCheck(this, ${o.ok}, 'q${i}fb')">${o.t}</button>`;
    });
    h += `<div class="quiz-fb" id="q${i}fb">${q.fb}</div>`;
    h += `</div>`;
  });

  h += L(`<div class="info iac"><div class="il">Done!</div>You now understand the full RAG pipeline: from document chunking through embedding, indexing, query-time similarity search, top-k selection, prompt augmentation, and grounded generation — plus the common failure modes and advanced variants. The surveys [8] and the original RAG paper [1] are good next reads.</div>`,`<div class="info iac"><div class="il">Geschafft!</div>Du verstehst jetzt die gesamte RAG-Pipeline: von der Dokumentzerlegung über Embedding, Indexierung, Ähnlichkeitssuche zur Anfragezeit, Top-k-Auswahl und Prompt-Anreicherung bis zur fundierten Generierung — plus die häufigen Fehlerbilder und fortgeschrittenen Varianten. Der Überblick [8] und das ursprüngliche RAG-Paper [1] sind gute nächste Lektüren.</div>`);

  return h;
}},

// ═══════ APP STATE ═══════
let currentStep = 0;

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = `<div class="side-label">${L('RAG walkthrough','RAG-Rundgang')}</div>`;
  const groups = {};
  STEPS.forEach((s, i) => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(i);
  });
  Object.keys(groups).forEach((g, gi) => {
    h += `<div class="side-label" style="margin-top:0.4rem;">${g}</div>`;
    groups[g].forEach(si => {
      const s = STEPS[si];
      const cls = si === currentStep ? 'on' : si < currentStep ? 'done' : '';
      h += `<button class="step-btn ${cls}" onclick="goStep(${si})"><span class="step-num">${si < currentStep ? '✓' : si + 1}</span>${s.title}</button>`;
    });
    if (gi < Object.keys(groups).length - 1) h += `<div class="step-divider"></div>`;
  });
  sb.innerHTML = h;
}

function renderMain() {
  const el = document.getElementById('main-content');
  const s = STEPS[currentStep];
  const q = NORMALIZED_QUERIES[QUERY_IDX];
  let h = `<div class="config">`;
  h += `<div class="cfg-item">N=<span>${CORPUS.length}</span></div>`;
  h += `<div class="cfg-item">d=<span>${CORPUS[0].vec.length}</span></div>`;
  h += `<div class="cfg-item">k=<span>${TOP_K}</span></div>`;
  h += `<div class="cfg-item">query=<span>"${q.text}"</span></div>`;
  h += `<div class="cfg-item" style="margin-left:auto;">${L('step','Schritt')} <span>${currentStep+1}</span>/${STEPS.length}</div>`;
  h += `</div>`;
  h += s.render();
  h += `<div class="nav-row">`;
  h += `<button class="nav-btn nav-prev" onclick="goStep(${currentStep-1})" ${currentStep===0?'disabled':''}>${L('← Previous','← Zurück')}</button>`;
  h += `<button class="nav-btn nav-next" onclick="goStep(${currentStep+1})" ${currentStep===STEPS.length-1?'disabled':''}>${currentStep===STEPS.length-1?L('Complete','Fertig'):L('Next →','Weiter →')}</button>`;
  h += `</div>`;
  el.innerHTML = h;
}

function goStep(n) {
  if (n < 0 || n >= STEPS.length) return;
  currentStep = n;
  renderSidebar();
  renderMain();
  document.getElementById('main-content').scrollTop = 0;
}

function onQueryChange() {
  QUERY_IDX = parseInt(document.getElementById('query-select').value);
  renderMain();
}

function onKChange() {
  TOP_K = parseInt(document.getElementById('k-slider').value);
  document.getElementById('k-val').textContent = TOP_K;
  renderMain();
}

function onChunkSizeChange(v) {
  CHUNK_SIZE = parseInt(v);
  // Ensure overlap is always strictly less than chunk size
  if (CHUNK_OVERLAP >= CHUNK_SIZE) CHUNK_OVERLAP = Math.max(0, CHUNK_SIZE - 5);
  renderMain();
}

function onChunkOverlapChange(v) {
  CHUNK_OVERLAP = parseInt(v);
  if (CHUNK_OVERLAP >= CHUNK_SIZE) CHUNK_OVERLAP = Math.max(0, CHUNK_SIZE - 5);
  renderMain();
}

function quizCheck(btn, ok, fbId) {
  const q = btn.parentElement;
  if (q.dataset.answered) return;
  q.dataset.answered = '1';
  if (ok) {
    btn.classList.add('right');
  } else {
    btn.classList.add('wrong');
    q.querySelectorAll('.quiz-opt').forEach(o => {
      const oc = o.getAttribute('onclick');
      if (oc && oc.includes('true')) o.classList.add('right');
    });
  }
  document.getElementById(fbId).classList.add('show');
}

// ═══════ INIT ═══════
renderSidebar();
renderMain();
