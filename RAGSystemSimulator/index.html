// ───────────────────── 2. THE PROBLEM ─────────────────────
{id: 'problem', get title(){return L('The Problem','Das Problem');}, get group(){return L('Setup','Einstieg');},
render() {
  let h = L(`<div class="stage-title">The Problem: Closed-Book LLMs <span class="tag trd">PROBLEM</span></div>`,`<div class="stage-title">Das Problem: Closed-Book-LLMs <span class="tag trd">PROBLEM</span></div>`);
  h += L(`<p class="stage-desc">A standard LLM is a <strong>closed-book</strong> system: once training ends, all the knowledge it will ever have is compressed into its weights. This creates four hard problems that RAG directly addresses.</p>`,`<p class="stage-desc">Ein gewöhnliches LLM ist ein <strong>Closed-Book</strong>-System: Sobald das Training endet, ist alles Wissen, das es je haben wird, in seine Gewichte komprimiert. Daraus entstehen vier harte Probleme, die RAG direkt angeht.</p>`);

  h += L(`<div class="info ird"><div class="il">1 · Knowledge cutoff</div>
The model only knows what was in its training data. A GPT-4 variant trained on data up to April 2024 cannot tell you about events in 2025 — not because it's being cagey, but because those events are not encoded in its weights. Any answer it gives will be extrapolation or confabulation.</div>`,`<div class="info ird"><div class="il">1 · Wissens-Cutoff</div>
Das Modell weiß nur, was in seinen Trainingsdaten stand. Eine GPT-4-Variante, die mit Daten bis April 2024 trainiert wurde, kann nichts über Ereignisse von 2025 sagen — nicht weil sie sich ziert, sondern weil diese Ereignisse nicht in ihren Gewichten kodiert sind. Jede Antwort wäre Extrapolation oder Konfabulation.</div>`);

  h += L(`<div class="info ird"><div class="il">2 · Hallucination</div>
When asked about obscure facts, LLMs often produce confident-sounding but entirely fabricated answers. The model optimizes for "plausible next token" and has no internal signal for "I don't actually know this." RAG grounds the output in real sources so the model can either cite a fact or honestly say it wasn't found.</div>`,`<div class="info ird"><div class="il">2 · Halluzination</div>
Nach obskuren Fakten gefragt, liefern LLMs oft selbstbewusst klingende, aber völlig erfundene Antworten. Das Modell optimiert auf den „plausiblen nächsten Token" und hat kein internes Signal für „das weiß ich eigentlich nicht". RAG verankert die Ausgabe in echten Quellen, sodass das Modell entweder einen Fakt belegen oder ehrlich sagen kann, dass nichts gefunden wurde.</div>`);

  h += L(`<div class="info ird"><div class="il">3 · No traceability</div>
A closed-book answer is unauditable. You can't ask the model "where did you learn that?" and get a meaningful answer — the knowledge is diffused across billions of weights. For medical, legal, financial, and scientific applications, this is a dealbreaker.</div>`,`<div class="info ird"><div class="il">3 · Keine Nachvollziehbarkeit</div>
Eine Closed-Book-Antwort ist nicht überprüfbar. Man kann das Modell nicht fragen „Woher weißt du das?" und eine sinnvolle Antwort erwarten — das Wissen ist über Milliarden Gewichte verstreut. Für medizinische, juristische, finanzielle und wissenschaftliche Anwendungen ist das ein K.-o.-Kriterium.</div>`);

  h += L(`<div class="info ird"><div class="il">4 · Can't update cheaply</div>
Adding new knowledge means fine-tuning or re-training — expensive, slow, and error-prone. With RAG, updating the knowledge base is as simple as adding a new document to the vector database. The LLM itself never changes.</div>`,`<div class="info ird"><div class="il">4 · Keine günstigen Updates</div>
Neues Wissen hinzuzufügen bedeutet Fine-Tuning oder Neutraining — teuer, langsam und fehleranfällig. Mit RAG ist ein Update der Wissensbasis so einfach wie das Hinzufügen eines neuen Dokuments zur Vektordatenbank. Das LLM selbst ändert sich nie.</div>`);

  // Example hallucination
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">A concrete example</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Ein konkretes Beispiel</h3>`);
  h += L(`<div class="answer-grid">
<div class="answer-card bad">
<div class="lbl">Closed-book LLM</div>
<div class="txt"><em>Q: "What were Anthropic's Q4 2025 earnings?"</em><br><br>A: "In Q4 2025, Anthropic reported revenue of approximately $420 million, with year-over-year growth of 380%..."<br><br><strong style="color:var(--red);">⚠ Made up.</strong> Plausible-looking but entirely fabricated numbers.</div>
</div>
<div class="answer-card good">
<div class="lbl">RAG</div>
<div class="txt"><em>Q: "What were Anthropic's Q4 2025 earnings?"</em><br><br>A: "Based on the retrieved press release: Anthropic reported Q4 2025 revenue of $X million [source: press_release_2026_01]."<br><br><strong style="color:var(--acc);">✓ Grounded.</strong> Either answers with a real quote or says nothing was found.</div>
</div>
</div>`,`<div class="answer-grid">
<div class="answer-card bad">
<div class="lbl">Closed-Book-LLM</div>
<div class="txt"><em>Q: "What were Anthropic's Q4 2025 earnings?"</em><br><br>A: "In Q4 2025, Anthropic reported revenue of approximately $420 million, with year-over-year growth of 380%..."<br><br><strong style="color:var(--red);">⚠ Erfunden.</strong> Plausibel aussehende, aber komplett ausgedachte Zahlen.</div>
</div>
<div class="answer-card good">
<div class="lbl">RAG</div>
<div class="txt"><em>Q: "What were Anthropic's Q4 2025 earnings?"</em><br><br>A: "Based on the retrieved press release: Anthropic reported Q4 2025 revenue of $X million [source: press_release_2026_01]."<br><br><strong style="color:var(--acc);">✓ Fundiert.</strong> Antwortet entweder mit einem echten Zitat oder sagt, dass nichts gefunden wurde.</div>
</div>
</div>`);

  return h;
}},

// ───────────────────── 3. CHUNKING ─────────────────────
{id: 'chunking', get title(){return L('Chunking','Chunking');}, get group(){return L('Indexing','Indexierung');},
render() {
  let h = L(`<div class="stage-title">Step 1 · Document Chunking <span class="tag tr">INDEX</span></div>`,`<div class="stage-title">Schritt 1 · Dokumente in Chunks zerlegen <span class="tag tr">INDEX</span></div>`);
  h += L(`<p class="stage-desc">Before retrieval can happen, the source corpus (PDFs, web pages, documentation, books, emails…) must be split into small <strong>chunks</strong>. Each chunk becomes one row in the vector database. The chunking strategy matters enormously — it determines what the retriever can actually find.</p>`,`<p class="stage-desc">Bevor Retrieval stattfinden kann, muss der Quellkorpus (PDFs, Webseiten, Dokumentation, Bücher, E-Mails …) in kleine <strong>Chunks</strong> zerlegt werden. Jeder Chunk wird zu einer Zeile in der Vektordatenbank. Die Chunking-Strategie ist enorm wichtig — sie bestimmt, was der Retriever überhaupt finden kann.</p>`);

  h += L(`<div class="info ir"><div class="il">Why not just embed whole documents?</div>
Two reasons. First, embedding models have a <strong>context limit</strong> (usually 512–8192 tokens) — you physically cannot feed them a whole PDF. Second, a single vector can only represent one "gist," so embedding a 50-page manual produces a fuzzy average that matches everything and nothing. Chunking gives you many focused vectors, each representing a specific topic.</div>`,`<div class="info ir"><div class="il">Warum nicht einfach ganze Dokumente einbetten?</div>
Zwei Gründe. Erstens haben Embedding-Modelle ein <strong>Kontextlimit</strong> (meist 512–8192 Token) — ein ganzes PDF passt physisch nicht hinein. Zweitens kann ein einzelner Vektor nur einen „Kern" darstellen; ein 50-seitiges Handbuch einzubetten ergibt einen unscharfen Durchschnitt, der zu allem und nichts passt. Chunking liefert viele fokussierte Vektoren, jeder für ein konkretes Thema.</div>`);

  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Common chunking strategies</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Gängige Chunking-Strategien</h3>`);
  h += L(`<div class="glossary"><table>
<tr><th>Strategy</th><th>How it works</th><th>When to use</th></tr>
<tr><td class="sym">Fixed-size</td><td class="def">Split into N-token blocks (e.g., 512 tokens) regardless of structure.</td><td class="def">Simple baseline. Cheap but cuts sentences in half.</td></tr>
<tr><td class="sym">Sliding window</td><td class="def">Fixed-size blocks with a 10–20% <strong>overlap</strong> between consecutive chunks.</td><td class="def">Default choice for most systems. Overlap ensures facts that straddle a boundary still appear in at least one chunk.</td></tr>
<tr><td class="sym">Sentence-based</td><td class="def">Split on sentence boundaries, group sentences until a token budget is reached.</td><td class="def">Cleaner boundaries; works well for prose.</td></tr>
<tr><td class="sym">Structure-aware</td><td class="def">Split on Markdown headings, code blocks, HTML tags, PDF sections.</td><td class="def">Best for technical documentation, where headings carry meaning.</td></tr>
<tr><td class="sym">Semantic</td><td class="def">Use an embedding model to detect topic shifts and split there.</td><td class="def">Highest quality but computationally expensive.</td></tr>
</table></div>`,`<div class="glossary"><table>
<tr><th>Strategie</th><th>Funktionsweise</th><th>Wann einsetzen</th></tr>
<tr><td class="sym">Feste Größe</td><td class="def">In Blöcke von N Token (z. B. 512) zerlegen, unabhängig von der Struktur.</td><td class="def">Einfache Basislinie. Billig, schneidet aber Sätze mittendurch.</td></tr>
<tr><td class="sym">Gleitendes Fenster</td><td class="def">Blöcke fester Größe mit 10–20 % <strong>Überlappung</strong> zwischen aufeinanderfolgenden Chunks.</td><td class="def">Standardwahl für die meisten Systeme. Die Überlappung sorgt dafür, dass Fakten an einer Grenze noch in mindestens einem Chunk vorkommen.</td></tr>
<tr><td class="sym">Satzbasiert</td><td class="def">An Satzgrenzen trennen, Sätze gruppieren, bis ein Token-Budget erreicht ist.</td><td class="def">Sauberere Grenzen; funktioniert gut für Fließtext.</td></tr>
<tr><td class="sym">Strukturbewusst</td><td class="def">An Markdown-Überschriften, Codeblöcken, HTML-Tags, PDF-Abschnitten trennen.</td><td class="def">Am besten für technische Dokumentation, wo Überschriften Bedeutung tragen.</td></tr>
<tr><td class="sym">Semantisch</td><td class="def">Mit einem Embedding-Modell Themenwechsel erkennen und dort trennen.</td><td class="def">Höchste Qualität, aber rechenintensiv.</td></tr>
</table></div>`);

  h += L(`<div class="info ig"><div class="il">The chunk-size trade-off</div>
<strong>Small chunks (~100 tokens):</strong> precise retrieval, but each chunk lacks context — the LLM may not have enough surrounding information to answer.<br>
<strong>Large chunks (~2000 tokens):</strong> lots of context per chunk, but retrieval is less precise (the relevant sentence is buried among irrelevant ones) and you can fit fewer chunks in the LLM's context window.<br>
<strong>Sweet spot:</strong> most systems use <strong>200–500 token chunks with 10–20% overlap</strong>. Tune empirically for your corpus and queries.</div>`,`<div class="info ig"><div class="il">Der Zielkonflikt bei der Chunk-Größe</div>
<strong>Kleine Chunks (~100 Token):</strong> präzises Retrieval, aber jedem Chunk fehlt Kontext — das LLM hat womöglich nicht genug Umfeld, um zu antworten.<br>
<strong>Große Chunks (~2000 Token):</strong> viel Kontext pro Chunk, aber das Retrieval wird unpräziser (der relevante Satz liegt zwischen irrelevanten begraben), und ins Kontextfenster des LLM passen weniger Chunks.<br>
<strong>Sweet Spot:</strong> Die meisten Systeme nutzen <strong>Chunks von 200–500 Token mit 10–20 % Überlappung</strong>. Empirisch für den eigenen Korpus und die eigenen Anfragen tunen.</div>`);

  // ── Interactive chunking slider ──
  h += L(`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">🎛️ Try it yourself · sliding-window chunker</h3>`,`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">🎛️ Selbst ausprobieren · Sliding-Window-Chunker</h3>`);
  h += L(`<p class="stage-desc">Below is a sample paragraph about LoRA. Drag the <strong>chunk size</strong> and <strong>overlap</strong> sliders to see how the same text gets split differently. Watch what happens when chunks are very small (too many fragments, no context) vs. very large (just one or two mega-chunks) vs. what happens with zero overlap (facts at the boundary can get cut in half).</p>`,`<p class="stage-desc">Unten steht ein Beispielabsatz über LoRA. Ziehe die Regler für <strong>Chunk-Größe</strong> und <strong>Überlappung</strong>, um zu sehen, wie derselbe Text unterschiedlich zerlegt wird. Beobachte, was passiert, wenn Chunks sehr klein sind (zu viele Fragmente, kein Kontext), sehr groß (nur ein oder zwei Mega-Chunks) oder wenn die Überlappung null ist (Fakten an der Grenze können mittendurch geschnitten werden).</p>`);
  h += `<div class="inline-slider">
<div class="ctrl"><label>${L('chunk size','Chunk-Größe')}</label><input type="range" min="30" max="200" step="5" value="${CHUNK_SIZE}" oninput="onChunkSizeChange(this.value)"><span class="val" id="chunk-size-val">${CHUNK_SIZE}</span><span style="font-size:0.66rem;color:var(--txt3);font-family:var(--mono);">${L('chars','Zeichen')}</span></div>
<div class="ctrl"><label>${L('overlap','Überlappung')}</label><input type="range" min="0" max="50" step="2" value="${CHUNK_OVERLAP}" oninput="onChunkOverlapChange(this.value)"><span class="val" id="chunk-overlap-val">${CHUNK_OVERLAP}</span><span style="font-size:0.66rem;color:var(--txt3);font-family:var(--mono);">${L('chars','Zeichen')}</span></div>
</div>`;
  h += renderChunkingDemo(CHUNK_SIZE, CHUNK_OVERLAP);
  h += L(`<div class="info is"><div class="il">Things to try</div>
<strong>• Chunk size = 30, overlap = 0</strong>: see how the text shatters into tiny fragments that each carry almost no meaning.<br>
<strong>• Chunk size = 200, overlap = 0</strong>: one or two huge chunks — if the query asks about "low-rank decomposition" which appears mid-chunk, the whole chunk's embedding is dominated by other topics.<br>
<strong>• Chunk size = 80, overlap = 20</strong>: reasonable balance. Notice how the overlap region repeats across consecutive chunks — this ensures facts straddling a boundary still appear intact in at least one chunk.</div>`,`<div class="info is"><div class="il">Zum Ausprobieren</div>
<strong>• Chunk-Größe = 30, Überlappung = 0</strong>: Der Text zersplittert in winzige Fragmente, die kaum Bedeutung tragen.<br>
<strong>• Chunk-Größe = 200, Überlappung = 0</strong>: ein oder zwei riesige Chunks — fragt die Anfrage nach „low-rank decomposition", das mitten im Chunk steht, wird das Embedding des ganzen Chunks von anderen Themen dominiert.<br>
<strong>• Chunk-Größe = 80, Überlappung = 20</strong>: vernünftige Balance. Beachte, wie sich der Überlappungsbereich in aufeinanderfolgenden Chunks wiederholt — so kommen Fakten an einer Grenze in mindestens einem Chunk unversehrt vor.</div>`);

  // Show the corpus we'll use
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Our demo corpus</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Unser Demo-Korpus</h3>`);
  h += L(`<p class="stage-desc">For this simulator we use a tiny corpus of ${CORPUS.length} hand-crafted chunks covering four topics: LoRA fine-tuning, the Transformer paper, French geography, and vector similarity. In a real RAG system this corpus would be thousands to millions of chunks.</p>`,`<p class="stage-desc">Für diesen Simulator nutzen wir einen winzigen Korpus aus ${CORPUS.length} handgeschriebenen Chunks zu vier Themen: LoRA-Feintuning, das Transformer-Paper, französische Geographie und Vektorähnlichkeit. In einem echten RAG-System wären es Tausende bis Millionen Chunks.</p>`);
  h += `<div class="doc-list">`;
  CORPUS.forEach(d => h += renderDoc(d));
  h += `</div>`;

  return h;
}},

// ───────────────────── 4. EMBEDDING ─────────────────────
{id: 'embedding', get title(){return L('Embedding','Embedding');}, get group(){return L('Indexing','Indexierung');},
render() {
  let h = L(`<div class="stage-title">Step 2 · Embedding the Corpus <span class="tag tp">EMBED</span></div>`,`<div class="stage-title">Schritt 2 · Den Korpus einbetten <span class="tag tp">EMBED</span></div>`);
  h += L(`<p class="stage-desc">Each chunk is passed through an <strong>embedding model</strong> that produces a fixed-length dense vector. Semantically similar chunks land near each other in this vector space. The embedding model is trained so that <em>"dog"</em> and <em>"puppy"</em> end up close together, while <em>"dog"</em> and <em>"spreadsheet"</em> end up far apart.</p>`,`<p class="stage-desc">Jeder Chunk wird durch ein <strong>Embedding-Modell</strong> geschickt, das einen dichten Vektor fester Länge erzeugt. Semantisch ähnliche Chunks landen in diesem Vektorraum nah beieinander. Das Embedding-Modell ist so trainiert, dass <em>„dog"</em> und <em>„puppy"</em> nah zusammenliegen, während <em>„dog"</em> und <em>„spreadsheet"</em> weit auseinanderliegen.</p>`);

  h += `<div class="formula">vec(chunk) = <span class="hl">embed_model</span>( chunk_text )&nbsp;&nbsp;&nbsp;<span class="cm">// → ℝ^d, ${L('then L2-normalized','dann L2-normalisiert')}</span></div>`;

  h += L(`<div class="info ip"><div class="il">Popular embedding models</div>
<table style="font-family:var(--mono);font-size:0.75rem;width:100%;">
<tr><td><strong>all-MiniLM-L6-v2</strong></td><td>384 dims</td><td style="color:var(--txt3);">Sentence-Transformers default. Fast, small, decent quality.</td></tr>
<tr><td><strong>bge-base-en-v1.5</strong></td><td>768 dims</td><td style="color:var(--txt3);">BAAI. Strong MTEB benchmark scores.</td></tr>
<tr><td><strong>text-embedding-3-small</strong></td><td>1536 dims</td><td style="color:var(--txt3);">OpenAI. Paid API, high quality.</td></tr>
<tr><td><strong>text-embedding-3-large</strong></td><td>3072 dims</td><td style="color:var(--txt3);">OpenAI. Highest quality in the OpenAI line.</td></tr>
<tr><td><strong>voyage-3</strong></td><td>1024 dims</td><td style="color:var(--txt3);">Voyage AI. Leads several MTEB categories.</td></tr>
</table></div>`,`<div class="info ip"><div class="il">Verbreitete Embedding-Modelle</div>
<table style="font-family:var(--mono);font-size:0.75rem;width:100%;">
<tr><td><strong>all-MiniLM-L6-v2</strong></td><td>384 Dims</td><td style="color:var(--txt3);">Sentence-Transformers-Standard. Schnell, klein, ordentliche Qualität.</td></tr>
<tr><td><strong>bge-base-en-v1.5</strong></td><td>768 Dims</td><td style="color:var(--txt3);">BAAI. Starke MTEB-Benchmark-Werte.</td></tr>
<tr><td><strong>text-embedding-3-small</strong></td><td>1536 Dims</td><td style="color:var(--txt3);">OpenAI. Bezahl-API, hohe Qualität.</td></tr>
<tr><td><strong>text-embedding-3-large</strong></td><td>3072 Dims</td><td style="color:var(--txt3);">OpenAI. Höchste Qualität der OpenAI-Linie.</td></tr>
<tr><td><strong>voyage-3</strong></td><td>1024 Dims</td><td style="color:var(--txt3);">Voyage AI. Führt mehrere MTEB-Kategorien an.</td></tr>
</table></div>`);

  // Show the first few chunks and their embeddings
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Corpus embeddings (after normalization)</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Korpus-Embeddings (nach Normalisierung)</h3>`);
  h += L(`<p class="stage-desc">Each row is one chunk's embedding in our 8-dimensional toy space. Notice how related chunks have visually similar patterns — docs 1–3 (LoRA) look alike, docs 4–6 (Transformers) cluster separately, and so on.</p>`,`<p class="stage-desc">Jede Zeile ist das Embedding eines Chunks in unserem 8-dimensionalen Spielzeugraum. Beachte, wie verwandte Chunks sichtbar ähnliche Muster haben — die Docs 1–3 (LoRA) sehen sich ähnlich, die Docs 4–6 (Transformer) bilden ein eigenes Cluster usw.</p>`);

  h += `<div class="mtx-wrap"><table class="mtx" style="margin:0 auto;">`;
  h += `<tr><td class="cheader">id</td><td class="cheader">${L('topic','Thema')}</td>`;
  for (let i = 0; i < 8; i++) h += `<td class="cheader">d${i}</td>`;
  h += `</tr>`;
  const topics = ['LoRA', 'LoRA', 'LoRA', 'Transformer', 'Transformer', 'Transformer', L('Geography','Geographie'), L('Geography','Geographie'), L('Similarity','Ähnlichkeit'), L('Similarity','Ähnlichkeit')];
  CORPUS.forEach((d, i) => {
    h += `<tr><td class="cheader">${d.id}</td><td class="cheader" style="text-align:left;padding-left:0.5rem;">${topics[i]}</td>`;
    d.vec.forEach(v => h += `<td class="cp">${fmt(v)}</td>`);
    h += `</tr>`;
  });
  h += `</table></div>`;

  h += L(`<div class="info is"><div class="il">Why L2-normalize?</div>
After embedding, we scale every vector to unit length (<code>||v|| = 1</code>). This serves two purposes: (1) it makes cosine similarity reduce to a simple dot product, which is much faster to compute; (2) it ensures retrieval ranks chunks by <em>direction</em>, not <em>length</em> — two chunks about the same topic should score the same regardless of how "loud" the embedding model made them.</div>`,`<div class="info is"><div class="il">Warum L2-normalisieren?</div>
Nach dem Einbetten skalieren wir jeden Vektor auf Einheitslänge (<code>||v|| = 1</code>). Das hat zwei Zwecke: (1) Die Kosinus-Ähnlichkeit reduziert sich auf ein einfaches Skalarprodukt, das viel schneller zu berechnen ist; (2) das Retrieval ordnet Chunks nach <em>Richtung</em>, nicht nach <em>Länge</em> — zwei Chunks zum selben Thema sollten gleich bewertet werden, egal wie „laut" das Embedding-Modell sie gemacht hat.</div>`);

  h += L(`<div class="info iac"><div class="il">Key property: isometry of meaning</div>
A good embedding model makes <strong>semantic distance ≈ geometric distance</strong>. Paraphrases of the same idea become close vectors even if they share no words. This is what lets the retriever find <em>"Who authored the Transformer paper?"</em> when the corpus only contains <em>"Vaswani et al. introduced self-attention..."</em>.</div>`,`<div class="info iac"><div class="il">Kerneigenschaft: Isometrie der Bedeutung</div>
Ein gutes Embedding-Modell sorgt für <strong>semantischer Abstand ≈ geometrischer Abstand</strong>. Paraphrasen derselben Idee werden zu nahen Vektoren, auch wenn sie kein Wort gemeinsam haben. Das ermöglicht dem Retriever, <em>„Who authored the Transformer paper?"</em> zu finden, obwohl der Korpus nur <em>„Vaswani et al. introduced self-attention..."</em> enthält.</div>`);

  // ── Interactive 2D visualization ──
  h += L(`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">📊 The vector space, visualized</h3>`,`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">📊 Der Vektorraum, visualisiert</h3>`);
  h += L(`<p class="stage-desc">We can't draw 8 dimensions directly, but we can project them onto two axes for visualization. In real systems this is typically done with <strong>PCA</strong>, <strong>t-SNE</strong>, or <strong>UMAP</strong>; for this small toy corpus we use a simpler hand-picked projection that places each topic cluster at its own compass point (LoRA → right, Transformers → left, Geography → top, Similarity → bottom). The purple <strong>QUERY</strong> marker shows where the current query from the header dropdown lands — try switching queries to see it jump between clusters.</p>`,`<p class="stage-desc">8 Dimensionen lassen sich nicht direkt zeichnen, aber wir können sie zur Visualisierung auf zwei Achsen projizieren. In echten Systemen geschieht das meist mit <strong>PCA</strong>, <strong>t-SNE</strong> oder <strong>UMAP</strong>; für diesen kleinen Spielzeugkorpus nutzen wir eine einfachere, handgewählte Projektion, die jedes Themencluster auf einen eigenen Kompasspunkt legt (LoRA → rechts, Transformer → links, Geographie → oben, Ähnlichkeit → unten). Die lila <strong>QUERY</strong>-Markierung zeigt, wo die aktuelle Anfrage aus dem Header-Menü landet — wechsle die Anfrage und sieh zu, wie sie zwischen den Clustern springt.</p>`);
  h += `<div class="scatter-wrap">${renderScatter2D({showSimLines: false, showLabels: true})}</div>`;
  h += L(`<div class="scatter-caption">↑ 2D projection of the 8-dim embeddings · change the query in the header to see the purple marker move</div>`,`<div class="scatter-caption">↑ 2D-Projektion der 8-dim Embeddings · ändere die Anfrage im Header, um die lila Markierung wandern zu sehen</div>`);

  h += L(`<div class="info is"><div class="il">What this tells us</div>
Notice that the four topic clusters form <strong>clearly separated regions</strong>, even after squashing 8 dimensions down to 2. This is the property that makes retrieval work: <em>semantically related content lives near itself in vector space</em>. When a query arrives, finding the "most similar" documents is literally the same as finding the <em>geometrically closest</em> points.</div>`,`<div class="info is"><div class="il">Was uns das sagt</div>
Die vier Themencluster bilden <strong>klar getrennte Regionen</strong>, selbst nachdem 8 Dimensionen auf 2 zusammengedrückt wurden. Genau diese Eigenschaft lässt Retrieval funktionieren: <em>Semantisch verwandter Inhalt liegt im Vektorraum beieinander</em>. Kommt eine Anfrage, ist die Suche nach den „ähnlichsten" Dokumenten buchstäblich dasselbe wie die Suche nach den <em>geometrisch nächsten</em> Punkten.</div>`);

  return h;
}},

// ───────────────────── 5. VECTOR DB ─────────────────────
{id: 'vectordb', get title(){return L('Vector Database','Vektordatenbank');}, get group(){return L('Indexing','Indexierung');},
render() {
  let h = L(`<div class="stage-title">Step 3 · The Vector Database <span class="tag tr">INDEX</span></div>`,`<div class="stage-title">Schritt 3 · Die Vektordatenbank <span class="tag tr">INDEX</span></div>`);
  h += L(`<p class="stage-desc">The embedded chunks are loaded into a <strong>vector database</strong> — a data store optimized for fast nearest-neighbor search over high-dimensional vectors. When a query arrives, the database finds the top-k closest vectors in milliseconds, even if there are millions of them.</p>`,`<p class="stage-desc">Die eingebetteten Chunks werden in eine <strong>Vektordatenbank</strong> geladen — einen Datenspeicher, der auf schnelle Nächste-Nachbarn-Suche über hochdimensionale Vektoren optimiert ist. Kommt eine Anfrage, findet die Datenbank die k nächsten Vektoren in Millisekunden, selbst wenn es Millionen sind.</p>`);

  h += L(`<div class="info ir"><div class="il">What the database actually stores</div>
For each chunk, the database stores:<br>
• The <strong>embedding vector</strong> (used for similarity search)<br>
• The <strong>original text</strong> (used later by the LLM)<br>
• Optional <strong>metadata</strong>: document source, page number, timestamp, tags (used for filtering)<br><br>
The embedding is the index, the text is the payload.</div>`,`<div class="info ir"><div class="il">Was die Datenbank tatsächlich speichert</div>
Für jeden Chunk speichert die Datenbank:<br>
• den <strong>Embedding-Vektor</strong> (für die Ähnlichkeitssuche)<br>
• den <strong>Originaltext</strong> (später vom LLM verwendet)<br>
• optionale <strong>Metadaten</strong>: Dokumentquelle, Seitenzahl, Zeitstempel, Tags (zum Filtern)<br><br>
Das Embedding ist der Index, der Text ist die Nutzlast.</div>`);

  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Brute-force vs. approximate search</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Brute-Force- vs. approximative Suche</h3>`);
  h += L(`<div class="glossary"><table>
<tr><th>Approach</th><th>Complexity</th><th>When to use</th></tr>
<tr><td class="sym">Exact (brute-force)</td><td class="def">O(N·d) per query — compare against every vector.</td><td class="def">Corpus &lt; ~100k chunks. Guarantees the true top-k.</td></tr>
<tr><td class="sym">IVF (inverted file)</td><td class="def">Cluster vectors, search only nearby clusters.</td><td class="def">Mid-size corpora. Trades some recall for speed.</td></tr>
<tr><td class="sym" style="color:var(--rust);">HNSW</td><td class="def">Hierarchical Navigable Small World graph [5]. Logarithmic search via graph navigation.</td><td class="def">The modern default. Used by Pinecone, Weaviate, Qdrant, Milvus, pgvector.</td></tr>
<tr><td class="sym">PQ (product quantization)</td><td class="def">Compress vectors to 8–16× smaller footprint.</td><td class="def">Billion-scale corpora where RAM is the bottleneck.</td></tr>
</table></div>`,`<div class="glossary"><table>
<tr><th>Ansatz</th><th>Komplexität</th><th>Wann einsetzen</th></tr>
<tr><td class="sym">Exakt (Brute-Force)</td><td class="def">O(N·d) pro Anfrage — Vergleich mit jedem Vektor.</td><td class="def">Korpus &lt; ~100k Chunks. Garantiert die echten Top-k.</td></tr>
<tr><td class="sym">IVF (Inverted File)</td><td class="def">Vektoren clustern, nur nahe Cluster durchsuchen.</td><td class="def">Mittelgroße Korpora. Tauscht etwas Recall gegen Geschwindigkeit.</td></tr>
<tr><td class="sym" style="color:var(--rust);">HNSW</td><td class="def">Hierarchical-Navigable-Small-World-Graph [5]. Logarithmische Suche per Graph-Navigation.</td><td class="def">Der moderne Standard. Genutzt von Pinecone, Weaviate, Qdrant, Milvus, pgvector.</td></tr>
<tr><td class="sym">PQ (Produktquantisierung)</td><td class="def">Vektoren auf 8–16× kleineren Speicherbedarf komprimieren.</td><td class="def">Korpora im Milliardenmaßstab, wo RAM der Engpass ist.</td></tr>
</table></div>`);

  h += L(`<div class="info is"><div class="il">Popular vector databases</div>
<strong>FAISS</strong> (Meta, library) [4] · <strong>Pinecone</strong> (managed SaaS) · <strong>Weaviate</strong> (open-source, GraphQL) · <strong>Qdrant</strong> (open-source, Rust) · <strong>Milvus</strong> (open-source, Go) · <strong>Chroma</strong> (open-source, Python-first) · <strong>pgvector</strong> (PostgreSQL extension) · <strong>Elasticsearch / OpenSearch</strong> (with dense-vector fields). All of them speak roughly the same interface: insert vectors, query by vector, filter by metadata.</div>`,`<div class="info is"><div class="il">Verbreitete Vektordatenbanken</div>
<strong>FAISS</strong> (Meta, Bibliothek) [4] · <strong>Pinecone</strong> (verwaltetes SaaS) · <strong>Weaviate</strong> (Open Source, GraphQL) · <strong>Qdrant</strong> (Open Source, Rust) · <strong>Milvus</strong> (Open Source, Go) · <strong>Chroma</strong> (Open Source, Python-first) · <strong>pgvector</strong> (PostgreSQL-Erweiterung) · <strong>Elasticsearch / OpenSearch</strong> (mit Dense-Vector-Feldern). Alle sprechen ungefähr dieselbe Schnittstelle: Vektoren einfügen, per Vektor abfragen, nach Metadaten filtern.</div>`);

  // Show all embeddings as the "database"
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Our demo database</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Unsere Demo-Datenbank</h3>`);
  h += L(`<p class="stage-desc">All ${CORPUS.length} chunks have been indexed. When a query comes in, we'll compute cosine similarity against every chunk and sort by score. With only 10 vectors, brute-force is instant.</p>`,`<p class="stage-desc">Alle ${CORPUS.length} Chunks sind indexiert. Kommt eine Anfrage, berechnen wir die Kosinus-Ähnlichkeit zu jedem Chunk und sortieren nach Score. Bei nur 10 Vektoren ist Brute-Force sofort fertig.</p>`);

  h += `<div class="doc-list">`;
  CORPUS.forEach(d => h += renderDoc(d));
  h += `</div>`;

  return h;
}},

// ───────────────────── 6. QUERY EMBED ─────────────────────
{id: 'query-embed', get title(){return L('Query Embedding','Query-Embedding');}, get group(){return L('Retrieval','Retrieval');},
render() {
  const {query} = computeRetrieval();
  let h = L(`<div class="stage-title">Step 4 · Embed the Query <span class="tag tp">QUERY</span></div>`,`<div class="stage-title">Schritt 4 · Die Anfrage einbetten <span class="tag tp">QUERY</span></div>`);
  h += L(`<p class="stage-desc">When a user asks a question, the first thing we do is <strong>embed it using exactly the same model</strong> that embedded the corpus. This puts the query in the same vector space as the chunks, so cosine similarity becomes meaningful.</p>`,`<p class="stage-desc">Stellt ein Nutzer eine Frage, ist das Erste, was wir tun, sie <strong>mit exakt demselben Modell einzubetten</strong>, das den Korpus eingebettet hat. Damit liegt die Anfrage im selben Vektorraum wie die Chunks, und die Kosinus-Ähnlichkeit wird aussagekräftig.</p>`);

  h += `<div class="formula">q_vec = <span class="hl">embed_model</span>( query_text )&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('same model as the corpus!','dasselbe Modell wie beim Korpus!')}</span></div>`;

  h += L(`<div class="info ip"><div class="il">Current query</div>
<strong>"${query.text}"</strong><br>
<span style="font-size:0.78rem;color:var(--txt3);">Topic cluster: ${query.topic}</span></div>`,`<div class="info ip"><div class="il">Aktuelle Anfrage</div>
<strong>"${query.text}"</strong><br>
<span style="font-size:0.78rem;color:var(--txt3);">Themencluster: ${query.topic}</span></div>`);

  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderVec(query.vec, L('q_vec (8 dims, normalized)','q_vec (8 Dims, normalisiert)'), 'cp');
  h += `</div></div>`;

  h += L(`<div class="info ird"><div class="il">Common pitfall: model mismatch</div>
If you embed the corpus with <code>bge-base</code> but the query with <code>all-MiniLM</code>, the vectors live in <strong>different spaces</strong> and cosine similarity becomes meaningless. Always use the same model on both sides. If you ever swap embedding models, you must <strong>re-embed the entire corpus</strong>.</div>`,`<div class="info ird"><div class="il">Häufige Falle: Modell-Mismatch</div>
Bettet man den Korpus mit <code>bge-base</code> ein, die Anfrage aber mit <code>all-MiniLM</code>, leben die Vektoren in <strong>verschiedenen Räumen</strong>, und die Kosinus-Ähnlichkeit wird bedeutungslos. Immer auf beiden Seiten dasselbe Modell nutzen. Wechselt man je das Embedding-Modell, muss man <strong>den gesamten Korpus neu einbetten</strong>.</div>`);

  h += L(`<div class="info ig"><div class="il">Variant: HyDE (Hypothetical Document Embeddings)</div>
Instead of embedding the raw query, HyDE [6] first asks an LLM to <em>write a plausible answer</em> to the query, then embeds the <em>answer</em> and searches with that embedding. The intuition: a fake answer is closer in vector space to real answers than the question itself is. This often improves retrieval quality, especially for underspecified queries.</div>`,`<div class="info ig"><div class="il">Variante: HyDE (Hypothetical Document Embeddings)</div>
Statt die rohe Anfrage einzubetten, lässt HyDE [6] zuerst ein LLM <em>eine plausible Antwort schreiben</em>, bettet dann die <em>Antwort</em> ein und sucht mit diesem Embedding. Die Intuition: Eine fiktive Antwort liegt im Vektorraum näher an echten Antworten als die Frage selbst. Das verbessert die Retrieval-Qualität oft, besonders bei unterspezifizierten Anfragen.</div>`);

  return h;
}},

// ───────────────────── 7. SIMILARITY ─────────────────────
{id: 'similarity', get title(){return L('Similarity Search','Ähnlichkeitssuche');}, get group(){return L('Retrieval','Retrieval');},
render() {
  const {query, scored} = computeRetrieval();
  let h = L(`<div class="stage-title">Step 5 · Cosine Similarity Search <span class="tag ts">SEARCH</span></div>`,`<div class="stage-title">Schritt 5 · Kosinus-Ähnlichkeitssuche <span class="tag ts">SUCHE</span></div>`);
  h += L(`<p class="stage-desc">Compute the cosine similarity between the query embedding and <strong>every chunk embedding</strong> in the database. Since all vectors are L2-normalized, cosine similarity reduces to a simple dot product — fast and parallelizable.</p>`,`<p class="stage-desc">Berechne die Kosinus-Ähnlichkeit zwischen dem Query-Embedding und <strong>jedem Chunk-Embedding</strong> in der Datenbank. Da alle Vektoren L2-normalisiert sind, reduziert sich die Kosinus-Ähnlichkeit auf ein einfaches Skalarprodukt — schnell und parallelisierbar.</p>`);

  h += `<div class="formula">sim(q, d) = <span class="purple">q_vec</span> · <span class="rust">d_vec</span> = Σᵢ <span class="purple">q_vec[i]</span> · <span class="rust">d_vec[i]</span>&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('dot product (both unit length)','Skalarprodukt (beide Einheitslänge)')}</span></div>`;

  // Show a sample computation for the top-1 result
  const top = scored[0];
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Worked example · comparing the query to ${top.id}</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Rechenbeispiel · die Anfrage im Vergleich mit ${top.id}</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderVec(query.vec, 'q_vec', 'cp');
  h += `<span class="op">·</span>`;
  h += renderVec(top.vec, `${top.id} vec`, 'cr');
  h += `<span class="op">=</span>`;
  h += `<div class="mtx-block"><div class="mtx-label">sim</div><table class="mtx"><tr><td class="ca" style="font-size:0.85rem;font-weight:700;">${fmt(top.score)}</td></tr></table></div>`;
  h += `</div></div>`;

  // Show all scores as bars
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Scores for all ${CORPUS.length} chunks (sorted)</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Scores für alle ${CORPUS.length} Chunks (sortiert)</h3>`);
  h += L(`<p class="stage-desc">Each bar shows the cosine similarity between the query and one chunk. Higher = more relevant. The top few should come from the correct topic cluster.</p>`,`<p class="stage-desc">Jeder Balken zeigt die Kosinus-Ähnlichkeit zwischen der Anfrage und einem Chunk. Höher = relevanter. Die obersten sollten aus dem richtigen Themencluster stammen.</p>`);
  const maxScore = Math.max(...scored.map(s => s.score));
  h += `<div class="bar-wrap">`;
  scored.forEach((s, i) => {
    const isTop = i < TOP_K;
    const width = Math.max(2, (s.score / Math.max(maxScore, 0.01)) * 100);
    h += `<div class="bar-row">
<span class="bar-label">${s.id}</span>
<div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${isTop ? 'var(--acc)' : 'var(--stone)'};opacity:${isTop ? 1 : 0.4};"></div></div>
<span class="bar-val" style="color:${isTop ? 'var(--acc)' : 'var(--txt3)'};">${fmt(s.score)}</span>
</div>`;
  });
  h += `</div>`;

  h += L(`<div class="info iac"><div class="il">Observation</div>
The top-${TOP_K} results (highlighted in forest green) should be from the ${query.topic} cluster. The other chunks — from unrelated topics — have clearly lower scores. This is the retrieval signal: even without keyword matching, semantic embeddings pull the right documents to the top.</div>`,`<div class="info iac"><div class="il">Beobachtung</div>
Die Top-${TOP_K}-Ergebnisse (waldgrün hervorgehoben) sollten aus dem Cluster „${query.topic}" stammen. Die anderen Chunks — aus fremden Themen — haben deutlich niedrigere Scores. Das ist das Retrieval-Signal: Auch ohne Schlüsselwort-Abgleich ziehen semantische Embeddings die richtigen Dokumente nach oben.</div>`);

  // ── Interactive 2D plot with similarity lines ──
  h += L(`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">📊 Geometric view of similarity search</h3>`,`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">📊 Geometrische Sicht auf die Ähnlichkeitssuche</h3>`);
  h += L(`<p class="stage-desc">In 2D, cosine similarity is easy to see: <strong>closer points have higher scores</strong>. Each line in the plot below connects the query (purple star) to one document. <strong>Solid forest-green lines</strong> mark the top-${TOP_K} retrieved documents; <strong>dashed gray lines</strong> are everything else. The line thickness is proportional to the similarity score. Change the <strong>query</strong> and <strong>top-k</strong> controls in the header to see the lines re-route live.</p>`,`<p class="stage-desc">In 2D ist die Kosinus-Ähnlichkeit leicht zu sehen: <strong>nähere Punkte haben höhere Scores</strong>. Jede Linie im Plot unten verbindet die Anfrage (lila Stern) mit einem Dokument. <strong>Durchgezogene waldgrüne Linien</strong> markieren die Top-${TOP_K} abgerufenen Dokumente; <strong>gestrichelte graue Linien</strong> sind alle anderen. Die Linienstärke ist proportional zum Ähnlichkeits-Score. Ändere <strong>Anfrage</strong> und <strong>Top-k</strong> im Header, um die Linien live umspringen zu sehen.</p>`);
  h += `<div class="scatter-wrap">${renderScatter2D({showSimLines: true, showLabels: true, showRanks: true})}</div>`;
  h += L(`<div class="scatter-caption">↑ Query-to-document similarity lines · the top-${TOP_K} are highlighted with numbered ranks · change query and top-k in the header</div>`,`<div class="scatter-caption">↑ Ähnlichkeitslinien von der Anfrage zu den Dokumenten · die Top-${TOP_K} sind mit nummerierten Rängen hervorgehoben · Anfrage und Top-k im Header ändern</div>`);

  h += L(`<div class="info ip"><div class="il">Note on dimensionality</div>
In this toy visualization, we project the 8-dim embeddings down to 2 using a hand-picked semantic projection. In a real system, embeddings might have 768 or 1536 or 3072 dimensions, and you'd use <strong>PCA</strong>, <strong>t-SNE</strong>, or <strong>UMAP</strong> for the reduction. The important property is preserved either way: clusters that are close in high-dim space stay close in 2D.</div>`,`<div class="info ip"><div class="il">Anmerkung zur Dimensionalität</div>
In dieser Spielzeug-Visualisierung projizieren wir die 8-dim Embeddings mit einer handgewählten semantischen Projektion auf 2 Dimensionen. In einem echten System hätten Embeddings 768, 1536 oder 3072 Dimensionen, und man würde <strong>PCA</strong>, <strong>t-SNE</strong> oder <strong>UMAP</strong> zur Reduktion nutzen. Die wichtige Eigenschaft bleibt so oder so erhalten: Cluster, die im hochdimensionalen Raum nah sind, bleiben auch in 2D nah.</div>`);

  return h;
}},

// ───────────────────── 8. TOP-K ─────────────────────
{id: 'topk', get title(){return L('Top-k Selection','Top-k-Auswahl');}, get group(){return L('Retrieval','Retrieval');},
render() {
  const {retrieved} = computeRetrieval();
  let h = L(`<div class="stage-title">Step 6 · Top-k Selection <span class="tag tr">RETRIEVE</span></div>`,`<div class="stage-title">Schritt 6 · Top-k-Auswahl <span class="tag tr">RETRIEVE</span></div>`);
  h += L(`<p class="stage-desc">Keep only the <strong>k chunks with the highest similarity scores</strong>. These will be fed to the LLM as context. Everything else is discarded (for this query — the database stays intact).</p>`,`<p class="stage-desc">Behalte nur die <strong>k Chunks mit den höchsten Ähnlichkeits-Scores</strong>. Sie werden dem LLM als Kontext übergeben. Alles andere wird verworfen (für diese Anfrage — die Datenbank bleibt unverändert).</p>`);

  h += `<div class="formula">retrieved = argtop-k<sub>d ∈ corpus</sub> sim(q, d)&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('currently','aktuell')} k = ${TOP_K}</span></div>`;

  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Retrieved passages (k = ${TOP_K})</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Abgerufene Passagen (k = ${TOP_K})</h3>`);
  h += L(`<p class="stage-desc">These are the passages that will be passed to the LLM. Change the top-k slider in the header to see more or fewer.</p>`,`<p class="stage-desc">Das sind die Passagen, die an das LLM übergeben werden. Ändere den Top-k-Regler im Header, um mehr oder weniger zu sehen.</p>`);
  h += `<div class="doc-list">`;
  retrieved.forEach((d, i) => {
    h += renderDoc(d, {retrieved: true, top: i === 0, score: d.score, rank: i});
  });
  h += `</div>`;

  h += L(`<div class="info ig"><div class="il">How to pick k</div>
<strong>Small k (1–3):</strong> minimizes prompt cost and reduces the chance of distracting the LLM with irrelevant chunks. Works when retrieval is very precise.<br>
<strong>Medium k (5–10):</strong> standard default. Balances recall (catching the right chunk) with signal-to-noise.<br>
<strong>Large k (20+):</strong> for tasks needing broad coverage (summarization, multi-hop QA). Usually combined with a <em>re-ranker</em> that further filters the top-k down.</div>`,`<div class="info ig"><div class="il">Wie man k wählt</div>
<strong>Kleines k (1–3):</strong> minimiert die Prompt-Kosten und die Gefahr, das LLM mit irrelevanten Chunks abzulenken. Funktioniert, wenn das Retrieval sehr präzise ist.<br>
<strong>Mittleres k (5–10):</strong> der übliche Standard. Balanciert Recall (den richtigen Chunk erwischen) gegen das Signal-Rausch-Verhältnis.<br>
<strong>Großes k (20+):</strong> für Aufgaben, die breite Abdeckung brauchen (Zusammenfassung, Multi-Hop-QA). Meist kombiniert mit einem <em>Re-Ranker</em>, der die Top-k weiter filtert.</div>`);

  h += L(`<div class="info is"><div class="il">Advanced: re-ranking</div>
For higher-quality systems, the retrieval is a two-stage process:<br>
<strong>Stage 1:</strong> retrieve top-50 or top-100 with a cheap bi-encoder (what we just did).<br>
<strong>Stage 2:</strong> re-score those with a slow but accurate <strong>cross-encoder</strong> that reads the query and each chunk together and outputs a relevance score. Keep the top-5 after re-ranking.<br><br>
Cross-encoders (e.g., <code>ms-marco-MiniLM-L-12-v2</code>) are much more accurate than bi-encoders but can't be pre-computed — they must run per query per candidate, which is why they're only used on the shortlist.</div>`,`<div class="info is"><div class="il">Fortgeschritten: Re-Ranking</div>
In höherwertigen Systemen ist das Retrieval ein zweistufiger Prozess:<br>
<strong>Stufe 1:</strong> Top-50 oder Top-100 mit einem billigen Bi-Encoder abrufen (was wir gerade getan haben).<br>
<strong>Stufe 2:</strong> diese mit einem langsamen, aber genauen <strong>Cross-Encoder</strong> neu bewerten, der Anfrage und Chunk zusammen liest und einen Relevanz-Score ausgibt. Nach dem Re-Ranking die Top-5 behalten.<br><br>
Cross-Encoder (z. B. <code>ms-marco-MiniLM-L-12-v2</code>) sind viel genauer als Bi-Encoder, lassen sich aber nicht vorberechnen — sie müssen pro Anfrage pro Kandidat laufen, weshalb sie nur auf der Shortlist eingesetzt werden.</div>`);

  return h;
}},

${L('<div class="props">\n<strong>Two independent forward passes</strong> — one for the query, one for the document. The two vectors never interact inside the model; they only meet at the end for a fast dot product.<br><br>\n<strong>✓ Documents can be pre-computed</strong> and stored offline. At query time: one encoder call + fast vector search.<br>\n<strong>✓ Scales to billions</strong> of documents with HNSW indexing.<br>\n<strong>✗ The encoder must be generic</strong> — it has to compress everything it <em>might</em> care about into a fixed-length vector, without knowing the query.<br><br>\n<strong>Examples:</strong> Sentence-BERT, all-MiniLM, BGE, OpenAI embeddings, DPR.\n</div>','<div class="props">\n<strong>Zwei unabhängige Forward-Passes</strong> — einer für die Anfrage, einer für das Dokument. Die beiden Vektoren interagieren im Modell nie; sie treffen sich erst am Ende für ein schnelles Skalarprodukt.<br><br>\n<strong>✓ Dokumente können vorberechnet</strong> und offline gespeichert werden. Zur Anfragezeit: ein Encoder-Aufruf + schnelle Vektorsuche.<br>\n<strong>✓ Skaliert auf Milliarden</strong> Dokumente mit HNSW-Indexierung.<br>\n<strong>✗ Der Encoder muss generisch sein</strong> — er muss alles, was <em>vielleicht</em> wichtig ist, in einen Vektor fester Länge komprimieren, ohne die Anfrage zu kennen.<br><br>\n<strong>Beispiele:</strong> Sentence-BERT, all-MiniLM, BGE, OpenAI-Embeddings, DPR.\n</div>')}
</div>

<div class="encoder-card cross">
${L('<h4>Cross-encoder (a.k.a. joint encoder)</h4>','<h4>Cross-Encoder (auch: Joint Encoder)</h4>')}
${L('<div class="tagline">"Read query and doc together"</div>','<div class="tagline">„Anfrage und Dokument zusammen lesen"</div>')}
<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
