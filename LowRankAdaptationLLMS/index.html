<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRA Fine-Tuning Simulator — Step-by-Step</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23fafaf7' stroke='%23e3e1d8'/><rect x='10' y='10' width='44' height='44' rx='6' fill='%236b728028' stroke='%236b7280' stroke-width='2'/><rect x='14' y='34' width='36' height='6' rx='2' fill='%23e11d4828' stroke='%23e11d48' stroke-width='2'/><rect x='14' y='44' width='6' height='6' rx='2' fill='%2315803d28' stroke='%2315803d' stroke-width='2'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;--bg2:#f3f2ed;--bg3:#ffffff;--bg4:#ebe9e2;
  --border:#e3e1d8;--border2:#cfccc0;
  --txt:#1c1b18;--txt2:#56544c;--txt3:#928f84;
  --frozen:#6b7280;--frozenbg:#6b728028;--frozenbrd:#6b728090;
  --a:#e11d48;--abg:#e11d4828;--abrd:#e11d4890;
  --b:#15803d;--bbg:#15803d28;--bbrd:#15803d90;
  --acc:#6d28d9;--accbg:#6d28d928;--accbrd:#6d28d990;
  --purple:#be185d;--purplebg:#be185d28;--purplebrd:#be185d90;
  --teal:#0e7490;--tealbg:#0e749028;--tealbrd:#0e749090;
  --gold:#b45309;--goldbg:#b4530928;--goldbrd:#b4530990;
  --gray:#6b7280;
  --on-acc:#ffffff;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;}
::selection{background:var(--acc);color:var(--on-acc);}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
@media(max-width:860px){.app{grid-template-columns:1fr;}.sidebar{display:none;}}

/* Header */
.header{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--border);padding:0.7rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.logo{font-family:var(--mono);font-weight:500;font-size:0.85rem;color:var(--acc);letter-spacing:0.05em;display:flex;align-items:center;gap:0.55rem;}
.logo-icon{width:26px;height:26px;flex-shrink:0;display:block;}
.logo-suffix{color:var(--txt3);}
.header-meta{font-size:0.7rem;color:var(--txt3);font-family:var(--mono);}
.token-bar{display:flex;align-items:center;gap:0.5rem;margin-left:auto;flex-wrap:wrap;}
.token-bar label{font-size:0.65rem;color:var(--txt3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;}
.token-bar input[type=range]{cursor:pointer;}
.token-bar .val{font-family:var(--mono);font-size:0.74rem;color:var(--acc);font-weight:600;min-width:18px;text-align:center;}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:1rem 0;overflow-y:auto;}
.side-label{font-family:var(--mono);font-size:0.58rem;color:var(--txt3);text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1rem 0.3rem;font-weight:500;}
.step-btn{display:flex;align-items:center;gap:0.6rem;width:100%;padding:0.45rem 1rem;border:none;background:none;color:var(--txt3);font-family:var(--sans);font-size:0.74rem;cursor:pointer;transition:all .12s;text-align:left;border-left:2px solid transparent;}
.step-btn:hover{background:var(--bg3);color:var(--txt2);}
.step-btn.on{background:var(--bg3);color:var(--acc);border-left-color:var(--acc);font-weight:600;}
.step-btn.done{color:var(--txt2);}
.step-num{font-family:var(--mono);font-size:0.62rem;width:20px;height:20px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:500;border:1px solid var(--border);}
.step-btn.on .step-num{background:var(--acc);color:var(--on-acc);border-color:var(--acc);}
.step-btn.done .step-num{background:var(--b);color:var(--on-acc);border-color:var(--b);}
.step-divider{height:1px;background:var(--border);margin:0.5rem 1rem;}

/* Main */
.main{padding:1.5rem 2rem;overflow-y:auto;max-height:calc(100vh - 50px);}
@media(max-width:860px){.main{padding:1rem;max-height:none;}}
.stage-title{font-size:1.15rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:0.15rem;}
.stage-title .tag{font-family:var(--mono);font-size:0.6rem;font-weight:500;padding:0.15rem 0.45rem;border-radius:4px;margin-left:0.5rem;vertical-align:middle;}
.tf{background:var(--frozenbg);color:var(--frozen);border:1px solid var(--frozenbrd);}
.ta{background:var(--abg);color:var(--a);border:1px solid var(--abrd);}
.tb{background:var(--bbg);color:var(--b);border:1px solid var(--bbrd);}
.tac{background:var(--accbg);color:var(--acc);border:1px solid var(--accbrd);}
.tp{background:var(--purplebg);color:var(--purple);border:1px solid var(--purplebrd);}
.tt{background:var(--tealbg);color:var(--teal);border:1px solid var(--tealbrd);}
.tg{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbrd);}
.stage-desc{font-size:0.84rem;color:var(--txt2);max-width:680px;margin-bottom:1.2rem;line-height:1.7;}
.stage-desc strong{color:var(--txt);font-weight:600;}

/* Matrix display */
.mtx-wrap{margin:0.8rem 0;overflow-x:auto;}
.mtx-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;justify-content:center;}
.mtx-block{display:inline-block;vertical-align:middle;margin:0.3rem;}
.mtx-label{font-family:var(--mono);font-size:0.62rem;color:var(--txt3);text-align:center;margin-bottom:0.25rem;font-weight:500;letter-spacing:0.03em;}
.mtx{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:0.72rem;}
.mtx td{padding:0.25rem 0.4rem;text-align:center;background:var(--bg3);border:1px solid var(--border);min-width:46px;border-radius:3px;transition:all .2s;color:var(--txt2);}
.mtx td.cf{background:var(--frozenbg);color:var(--frozen);border-color:var(--frozenbrd);font-weight:500;}
.mtx td.ca{background:var(--abg);color:var(--a);border-color:var(--abrd);font-weight:500;}
.mtx td.cb{background:var(--bbg);color:var(--b);border-color:var(--bbrd);font-weight:500;}
.mtx td.cba{background:var(--purplebg);color:var(--purple);border-color:var(--purplebrd);font-weight:500;}
.mtx td.cacc{background:var(--accbg);color:var(--acc);border-color:var(--accbrd);font-weight:500;}
.mtx td.ct{background:var(--tealbg);color:var(--teal);border-color:var(--tealbrd);font-weight:500;}
.mtx td.cz{background:var(--bg4);color:var(--txt3);border-color:var(--border);font-weight:500;font-style:italic;}
.mtx td.cheader{background:var(--bg4);color:var(--txt3);font-size:0.6rem;font-weight:500;border:none;}
.op{font-family:var(--mono);font-size:1.2rem;color:var(--txt3);margin:0 0.4rem;vertical-align:middle;}

/* Lock badge for frozen matrices */
.locked{position:relative;}
.locked::after{content:"🔒";position:absolute;top:-8px;right:-6px;font-size:0.85rem;}

/* Info boxes */
.info{padding:0.75rem 1rem;border-radius:var(--r);margin:0.7rem 0;font-size:0.82rem;line-height:1.65;}
.info .il{font-family:var(--mono);font-size:0.6rem;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.2rem;}
.if{background:var(--frozenbg);border:1px solid var(--frozenbrd);}.if .il{color:var(--frozen);}
.iia{background:var(--abg);border:1px solid var(--abrd);}.iia .il{color:var(--a);}
.iib{background:var(--bbg);border:1px solid var(--bbrd);}.iib .il{color:var(--b);}
.iac{background:var(--accbg);border:1px solid var(--accbrd);}.iac .il{color:var(--acc);}
.ip{background:var(--purplebg);border:1px solid var(--purplebrd);}.ip .il{color:var(--purple);}
.it{background:var(--tealbg);border:1px solid var(--tealbrd);}.it .il{color:var(--teal);}
.ig{background:var(--goldbg);border:1px solid var(--goldbrd);}.ig .il{color:var(--gold);}

/* Formula bar */
.formula{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:0.7rem 1rem;margin:0.7rem 0;font-family:var(--mono);font-size:0.78rem;color:var(--txt2);line-height:1.8;overflow-x:auto;}
.formula .hl{color:var(--acc);font-weight:500;}
.formula .cm{color:var(--txt3);}
.formula .red{color:var(--a);font-weight:500;}
.formula .grn{color:var(--b);font-weight:500;}
.formula .gry{color:var(--frozen);font-weight:500;}

/* Nav buttons */
.nav-row{display:flex;gap:0.6rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border);}
.nav-btn{font-family:var(--sans);font-size:0.78rem;font-weight:600;padding:0.5rem 1.2rem;border-radius:var(--r);border:none;cursor:pointer;transition:all .12s;letter-spacing:0.01em;}
.nav-prev{background:var(--bg3);color:var(--txt2);border:1px solid var(--border);}.nav-prev:hover{border-color:var(--txt3);color:var(--txt);}
.nav-next{background:var(--acc);color:var(--on-acc);}.nav-next:hover{filter:brightness(1.1);}
.nav-btn:disabled{opacity:0.3;cursor:default;filter:none;}

/* Config bar */
.config{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:0.6rem 1rem;margin-bottom:1rem;display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;}
.cfg-item{font-family:var(--mono);font-size:0.68rem;color:var(--txt3);}
.cfg-item span{color:var(--acc);font-weight:500;}

/* Architecture diagram */
.arch-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;margin:0.8rem 0 1.2rem;display:flex;justify-content:center;overflow-x:auto;}
.arch-wrap svg{max-width:100%;height:auto;}

/* Glossary table */
.glossary{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:0.8rem 0;}
.glossary table{width:100%;border-collapse:collapse;font-size:0.78rem;}
.glossary th{background:var(--bg2);color:var(--txt3);font-family:var(--mono);font-weight:500;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;text-align:left;padding:0.55rem 0.9rem;border-bottom:1px solid var(--border);}
.glossary td{padding:0.55rem 0.9rem;border-bottom:1px solid var(--border);vertical-align:top;color:var(--txt2);line-height:1.55;}
.glossary tr:last-child td{border-bottom:none;}
.glossary tr:hover td{background:var(--bg2);}
.glossary td.sym{font-family:var(--mono);font-weight:500;color:var(--acc);white-space:nowrap;width:1%;}
.glossary td.val{font-family:var(--mono);color:var(--txt);font-weight:500;white-space:nowrap;width:1%;text-align:center;}
.glossary td.def strong{color:var(--txt);font-weight:600;}
.gloss-section{background:var(--bg4);color:var(--txt);font-family:var(--mono);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;padding:0.5rem 0.9rem !important;}

/* References */
.refs{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:0.9rem 1.1rem;margin:0.8rem 0;}
.refs ol{list-style:none;counter-reset:ref;padding:0;margin:0;}
.refs li{counter-increment:ref;position:relative;padding:0.5rem 0 0.5rem 2.2rem;font-size:0.78rem;line-height:1.6;color:var(--txt2);border-bottom:1px solid var(--border);}
.refs li:last-child{border-bottom:none;}
.refs li::before{content:"["counter(ref)"]";position:absolute;left:0;top:0.5rem;font-family:var(--mono);font-size:0.7rem;color:var(--acc);font-weight:600;}
.refs li .auth{color:var(--txt);font-weight:500;}
.refs li .ttl{color:var(--txt);font-style:italic;}
.refs li .ven{color:var(--txt3);font-family:var(--mono);font-size:0.72rem;}
.refs li a{color:var(--acc);text-decoration:none;font-family:var(--mono);font-size:0.72rem;border-bottom:1px dotted var(--accbrd);}
.refs li a:hover{border-bottom-style:solid;}

/* Param counter */
.param-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;margin:0.8rem 0;}
.param-card .lbl{font-family:var(--mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--txt3);margin-bottom:0.3rem;}
.param-card .big{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--acc);line-height:1;}
.param-card .sub{font-size:0.78rem;color:var(--txt2);margin-top:0.3rem;}
.param-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.8rem;margin:0.8rem 0;}

/* Bar (for savings visualization) */
.bar-wrap{margin:0.4rem 0;}
.bar-lbl{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--txt2);margin-bottom:0.25rem;font-family:var(--mono);}
.bar-track{height:18px;background:var(--bg4);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .3s;}

/* Quiz */
.quiz-q{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;margin:0.8rem 0;}
.quiz-q .qnum{font-family:var(--mono);font-size:0.6rem;color:var(--acc);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.quiz-q .qtext{font-size:0.88rem;color:var(--txt);font-weight:500;margin:0.3rem 0 0.7rem;}
.quiz-opt{display:block;width:100%;text-align:left;padding:0.55rem 0.9rem;margin:0.3rem 0;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--txt2);font-size:0.8rem;font-family:var(--sans);cursor:pointer;transition:all .12s;}
.quiz-opt:hover{border-color:var(--acc);background:var(--accbg);}
.quiz-opt.right{border-color:var(--b);background:var(--bbg);color:var(--b);font-weight:600;}
.quiz-opt.wrong{border-color:var(--a);background:var(--abg);color:var(--a);}
.quiz-fb{margin-top:0.5rem;font-size:0.78rem;color:var(--txt2);padding:0.5rem 0.7rem;background:var(--bg2);border-radius:6px;display:none;}
.quiz-fb.show{display:block;}
.lang-toggle{margin-left:0.8rem;display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:2px;}
.lang-btn{font-family:var(--mono);font-size:0.66rem;font-weight:600;letter-spacing:0.05em;padding:0.2rem 0.6rem;border-radius:999px;cursor:pointer;color:var(--txt3);user-select:none;transition:all .2s;}
.lang-btn:hover{color:var(--txt);}
.lang-btn.on{background:var(--acc);color:#fff;}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#fafaf7" stroke="#e3e1d8" stroke-width="1"/>
      <rect x="10" y="10" width="44" height="44" rx="6" fill="#6b728028" stroke="#6b7280" stroke-width="2"/>
      <rect x="14" y="34" width="36" height="6" rx="2" fill="#e11d4828" stroke="#e11d48" stroke-width="2"/>
      <rect x="14" y="44" width="6" height="6" rx="2" fill="#15803d28" stroke="#15803d" stroke-width="2"/>
    </svg>
    <span>LORA_FT<span class="logo-suffix">.sim</span></span>
  </div>
  <div class="header-meta" data-i18n="hdr-meta">low-rank adaptation · interactive walkthrough</div>
  <div class="token-bar">
    <label data-i18n="lbl-rank">Rank</label>
    <input id="rank-slider" type="range" min="1" max="4" step="1" value="2" oninput="onRankChange()" style="width:90px;accent-color:var(--acc);">
    <span class="val" id="rank-val">2</span>
    <label style="margin-left:0.6rem;">Alpha</label>
    <input id="alpha-slider" type="range" min="1" max="32" step="1" value="8" oninput="onAlphaChange()" style="width:90px;accent-color:var(--acc);">
    <span class="val" id="alpha-val">8</span>
    <div class="lang-toggle" title="Language / Sprache"><span class="lang-btn on" data-lang="en" onclick="setLang('en')">EN</span><span class="lang-btn" data-lang="de" onclick="setLang('de')">DE</span></div>
  </div>
</header>

<aside class="sidebar" id="sidebar"></aside>
<div class="main" id="main-content"></div>
</div>

<script>
// ═══════ LANGUAGE (EN / DE) ═══════
let LANG='en';
function L(en,de){return LANG==='de'?de:en;}
const STATIC_I18N={
  'lbl-rank':['Rank','Rang'],
  'hdr-meta':['low-rank adaptation · interactive walkthrough','Low-Rank Adaptation · interaktiver Rundgang']
};
function setLang(lang){
  LANG=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const e=STATIC_I18N[el.dataset.i18n];if(e)el.textContent=lang==='de'?e[1]:e[0];});
  document.documentElement.lang=lang;
  document.title=L('LoRA Fine-Tuning Simulator — Step-by-Step','LoRA-Fine-Tuning-Simulator — Schritt für Schritt');
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  if(typeof renderSidebar==='function'&&typeof STEPS!=='undefined'){renderSidebar();renderMain();}
  try{localStorage.setItem('lora_sim_lang',lang);}catch(e){}
}

// ═══════ MODEL CONFIGURATION ═══════
const D = 6;             // Hidden dimension (6×6 W matrix for clarity)
const MAX_R = 4;         // Maximum rank we'll demonstrate
let RANK = 2;            // Current LoRA rank (user-adjustable)
let ALPHA = 8;           // LoRA scaling factor (user-adjustable)

// ═══════ FROZEN PRE-TRAINED WEIGHTS ═══════
// W: a fixed 6×6 weight matrix representing one pre-trained linear layer
// (e.g., the W_Q of an attention head). In real models this would be huge.
const W = [
  [ 0.50, -0.20,  0.10,  0.40, -0.30,  0.20],
  [ 0.10,  0.60, -0.40,  0.20,  0.10, -0.30],
  [-0.30,  0.20,  0.50, -0.10,  0.40,  0.10],
  [ 0.20, -0.40,  0.30,  0.50, -0.20,  0.10],
  [-0.10,  0.30, -0.20,  0.40,  0.50, -0.30],
  [ 0.40,  0.10, -0.30,  0.20,  0.10,  0.50],
];

// ═══════ TRAINED LoRA MATRICES (after fine-tuning) ═══════
// These are what LoRA would learn for some downstream task.
// A_FULL is r=4 sized; we slice it for smaller r.
// They're hand-crafted so the math reads cleanly in the demo.
const A_FULL = [
  [ 0.40, -0.20,  0.50,  0.10, -0.30,  0.20],   // singular vector 1 (largest weight)
  [ 0.10,  0.40, -0.20,  0.30,  0.20, -0.40],   // singular vector 2
  [-0.20,  0.10,  0.30, -0.40,  0.50,  0.10],   // singular vector 3
  [ 0.30,  0.20, -0.10,  0.20, -0.40,  0.30],   // singular vector 4 (smallest)
];

const B_FULL = [
  [ 0.50,  0.20, -0.10,  0.10],
  [-0.30,  0.40,  0.20,  0.10],
  [ 0.20, -0.10,  0.30, -0.20],
  [ 0.40,  0.30, -0.20,  0.10],
  [-0.10, -0.20,  0.40,  0.30],
  [ 0.30,  0.50, -0.10, -0.20],
];

// Demo input vector
const X = [1.0, 0.5, -0.3, 0.8, -0.2, 0.4];

// ═══════ MATH UTILITIES ═══════
function matmul(M1, M2) {
  const m = M1.length, n = M2[0].length, p = M2.length;
  const out = [];
  for (let i = 0; i < m; i++) {
    out[i] = [];
    for (let j = 0; j < n; j++) {
      let s = 0;
      for (let k = 0; k < p; k++) s += M1[i][k] * M2[k][j];
      out[i][j] = +s.toFixed(4);
    }
  }
  return out;
}
function matvec(M, v) {
  return M.map(row => +row.reduce((s, x, i) => s + x * v[i], 0).toFixed(4));
}
function addMat(M1, M2) {
  return M1.map((row, i) => row.map((v, j) => +(v + M2[i][j]).toFixed(4)));
}
function scaleMat(M, s) {
  return M.map(row => row.map(v => +(v * s).toFixed(4)));
}
function zeros(rows, cols) {
  return Array.from({length: rows}, () => Array(cols).fill(0));
}

// ═══════ DERIVED STATE ═══════
function getAB(r) {
  const A = A_FULL.slice(0, r).map(row => row.slice());
  const B = B_FULL.map(row => row.slice(0, r));
  return {A, B};
}

function computeState() {
  const r = RANK;
  const {A, B} = getAB(r);
  const BA = matmul(B, A);                     // (D×r) × (r×D) = D×D
  const scale = ALPHA / r;
  const scaledBA = scaleMat(BA, scale);
  const W_eff = addMat(W, scaledBA);            // W + (α/r)·BA
  // Forward pass
  const Wx = matvec(W, X);
  const Ax = matvec(A, X);                     // r-dim
  const BAx = matvec(B, Ax);                   // D-dim
  const scaledBAx = BAx.map(v => +(v * scale).toFixed(4));
  const h = Wx.map((v, i) => +(v + scaledBAx[i]).toFixed(4));
  // Param counts
  const fullParams = D * D;                    // d²
  const loraParams = 2 * D * r;                // 2dr (A: r×d, B: d×r)
  return {A, B, BA, scaledBA, W_eff, Wx, Ax, BAx, scaledBAx, h, fullParams, loraParams, r, scale};
}

function fmt(v, dec = 2) {
  if (v === 0) return '0.00';
  return typeof v === 'number' ? v.toFixed(dec) : v;
}

function renderMtx(M, label, cls, rowLabels, colLabels) {
  let h = `<div class="mtx-block"><div class="mtx-label">${label}</div><table class="mtx">`;
  if (colLabels) {
    h += '<tr>';
    if (rowLabels) h += '<td class="cheader"></td>';
    colLabels.forEach(c => h += `<td class="cheader">${c}</td>`);
    h += '</tr>';
  }
  M.forEach((row, i) => {
    h += '<tr>';
    if (rowLabels) h += `<td class="cheader">${rowLabels[i]}</td>`;
    row.forEach(v => h += `<td class="${cls}">${fmt(v)}</td>`);
    h += '</tr>';
  });
  return h + '</table></div>';
}

function renderVec(v, label, cls) {
  let h = `<div class="mtx-block"><div class="mtx-label">${label}</div><table class="mtx">`;
  v.forEach(x => h += `<tr><td class="${cls}">${fmt(x)}</td></tr>`);

}

  h += `<div class="formula">${L('Full fine-tuning','Volles Fine-Tuning')}: <span class="gry">W</span><sub>new</sub> = <span class="gry">W</span> + ΔW &nbsp;&nbsp;&nbsp;<span class="cm">// ${L('every entry of ΔW is a learnable parameter','jeder Eintrag von ΔW ist ein lernbarer Parameter')}</span></div>`;

  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderMtx(W, `W (${L('pretrained','vortrainiert')}, ${D}×${D})`, 'cf');
  h += `<span class="op">+</span>`;
  h += renderMtx(W.map(r => r.map(() => '?')), L('ΔW (all learnable)','ΔW (alles lernbar)'), 'cba');
  h += `</div></div>`;

  h += L(`<div class="info if"><div class="il">The cost in numbers</div>
For GPT-3 (175 B parameters) with the Adam optimizer:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• Model weights (fp16):</td><td style="padding-left:1rem;">~350 GB</td></tr>
<tr><td>• Adam momentum (fp32):</td><td style="padding-left:1rem;">~700 GB</td></tr>
<tr><td>• Adam variance (fp32):</td><td style="padding-left:1rem;">~700 GB</td></tr>
<tr><td>• Gradients (fp16):</td><td style="padding-left:1rem;">~350 GB</td></tr>
<tr><td><strong>• Total optimizer state:</strong></td><td style="padding-left:1rem;"><strong>~2.1 TB</strong></td></tr>
</table>
<br>This is far beyond a single GPU (even an 80 GB A100). You'd need a multi-node training cluster just to fine-tune <em>one</em> task. And you'd produce a 350 GB checkpoint <em>per task</em>.</div>`,`<div class="info if"><div class="il">Die Kosten in Zahlen</div>
Für GPT-3 (175 B Parameter) mit dem Adam-Optimizer:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• Modellgewichte (fp16):</td><td style="padding-left:1rem;">~350 GB</td></tr>
<tr><td>• Adam-Momentum (fp32):</td><td style="padding-left:1rem;">~700 GB</td></tr>
<tr><td>• Adam-Varianz (fp32):</td><td style="padding-left:1rem;">~700 GB</td></tr>
<tr><td>• Gradienten (fp16):</td><td style="padding-left:1rem;">~350 GB</td></tr>
<tr><td><strong>• Gesamter Optimizer-Zustand:</strong></td><td style="padding-left:1rem;"><strong>~2,1 TB</strong></td></tr>
</table>
<br>Das liegt weit jenseits einer einzelnen GPU (selbst einer 80-GB-A100). Man bräuchte einen Trainingscluster mit mehreren Knoten, nur um <em>eine</em> Aufgabe feinzujustieren. Und man erzeugt einen 350-GB-Checkpoint <em>pro Aufgabe</em>.</div>`);

  h += L(`<div class="info ig"><div class="il">The catalog problem</div>
If you want to deploy 100 specialized variants of GPT-3 (one per customer, language, domain, …), full fine-tuning means storing <strong>100 × 350 GB = 35 TB</strong> of model weights, plus the cost of training each one. This doesn't scale.</div>`,`<div class="info ig"><div class="il">Das Katalog-Problem</div>
Will man 100 spezialisierte Varianten von GPT-3 ausrollen (eine pro Kunde, Sprache, Domäne …), bedeutet volles Fine-Tuning <strong>100 × 350 GB = 35 TB</strong> Modellgewichte zu speichern, plus die Trainingskosten für jede einzelne. Das skaliert nicht.</div>`);

  return h;
}},

// ───────────────────── 3. THE INSIGHT ─────────────────────
{id: 'insight', get title(){return L('Low-Rank Insight','Low-Rank-Einsicht');}, get group(){return L('Setup','Einstieg');},
render() {
  let h = L(`<div class="stage-title">The Insight: Updates Have Low Intrinsic Rank <span class="tag tt">INSIGHT</span></div>`,`<div class="stage-title">Die Einsicht: Updates haben niedrigen intrinsischen Rang <span class="tag tt">EINSICHT</span></div>`);
  h += L(`<p class="stage-desc">Aghajanyan et al. (2020) [2] empirically showed that fine-tuning a large pre-trained model can be done in a <strong>much smaller subspace</strong> than the full parameter space. This means the effective update <code>ΔW</code> isn't really using all <code>d²</code> degrees of freedom — it has low <em>intrinsic dimensionality</em>.</p>`,`<p class="stage-desc">Aghajanyan et al. (2020) [2] zeigten empirisch, dass sich das Fine-Tuning eines großen vortrainierten Modells in einem <strong>viel kleineren Unterraum</strong> als dem vollen Parameterraum durchführen lässt. Das heißt, das effektive Update <code>ΔW</code> nutzt gar nicht alle <code>d²</code> Freiheitsgrade — es hat eine niedrige <em>intrinsische Dimensionalität</em>.</p>`);

  h += L(`<p class="stage-desc">LoRA's hypothesis (Hu et al. 2021 [1]): if <code>ΔW</code> has low intrinsic rank, we can <strong>directly parameterize it as a low-rank matrix</strong>. Any rank-<code>r</code> matrix factors as the product of two skinny matrices:</p>`,`<p class="stage-desc">LoRAs Hypothese (Hu et al. 2021 [1]): Wenn <code>ΔW</code> einen niedrigen intrinsischen Rang hat, können wir es <strong>direkt als Low-Rank-Matrix parametrisieren</strong>. Jede Matrix vom Rang <code>r</code> faktorisiert als Produkt zweier schmaler Matrizen:</p>`);

  h += `<div class="formula">ΔW &nbsp;≈&nbsp; <span class="grn">B</span> · <span class="red">A</span><br><span class="cm">// ${L('where','wobei')}</span> <span class="grn">B</span> <span class="cm">${L('is','die Form')}</span> [d × r], <span class="red">A</span> <span class="cm">${L('is','die Form')}</span> [r × d]${L('',' hat')}, <span class="cm">${L('and','und')}</span> r ≪ d</div>`;

  // Visual: rank-r factorization shape
  h += `<div class="arch-wrap">
<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">
  <!-- ΔW big square -->
  <rect x="20" y="40" width="120" height="120" rx="6" fill="#be185d28" stroke="#be185d" stroke-width="2"/>
  <text x="80" y="105" text-anchor="middle" font-size="20" fill="#be185d" font-weight="700">ΔW</text>
  <text x="80" y="125" text-anchor="middle" font-size="11" fill="#56544c" font-family="DM Mono, monospace">d × d</text>
  <text x="80" y="180" text-anchor="middle" font-size="10" ${L('fill="#56544c">d² params</text>','fill="#56544c">d² Parameter</text>')}

  <text x="170" y="105" font-size="22" fill="#928f84" font-weight="600">≈</text>

  <!-- B tall thin -->
  <rect x="220" y="40" width="35" height="120" rx="6" fill="#15803d28" stroke="#15803d" stroke-width="2"/>
  <text x="237" y="108" text-anchor="middle" font-size="18" fill="#15803d" font-weight="700">B</text>
  <text x="237" y="180" text-anchor="middle" font-size="10" fill="#56544c">d × r</text>

  <text x="280" y="105" font-size="22" fill="#928f84" font-weight="600">·</text>

  <!-- A wide flat -->
  <rect x="310" y="78" width="160" height="35" rx="6" fill="#e11d4828" stroke="#e11d48" stroke-width="2"/>
  <text x="390" y="103" text-anchor="middle" font-size="18" fill="#e11d48" font-weight="700">A</text>
  <text x="390" y="135" text-anchor="middle" font-size="10" fill="#56544c">r × d</text>

  <!-- Trainable param count -->
  <line x1="500" y1="100" x2="525" y2="100" stroke="#928f84" stroke-width="2" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#928f84"/>
    </marker>
  </defs>

  <text x="535" y="92" font-size="11" fill="#6d28d9" font-weight="700" font-family="DM Mono, monospace">2dr</text>
  <text x="535" y="108" font-size="11" fill="#6d28d9" ${L('font-family="DM Mono, monospace">params</text>','font-family="DM Mono, monospace">Parameter</text>')}
  <text x="535" y="125" font-size="9" ${L('fill="#56544c">(if r=2,</text>','fill="#56544c">(bei r=2,</text>')}
  <text x="535" y="137" font-size="9" fill="#56544c">d=6: 24)</text>

  <!-- Note -->
  <text x="310" y="30" font-size="10" fill="#56544c" ${L('font-style="italic">"low rank" means r ≪ d</text>','font-style="italic">„Low Rank" heißt r ≪ d</text>')}
</svg>
</div>`;

  h += L(`<div class="info it"><div class="il">Why low rank works: an SVD perspective</div>
Any matrix has a <strong>singular value decomposition</strong> (SVD): <code>ΔW = U Σ V<sup>T</sup></code>, where Σ contains the singular values in decreasing order. The best rank-<code>r</code> approximation of <code>ΔW</code> (in Frobenius norm) is obtained by keeping only the <em>top r singular values</em>:
<div class="formula" style="margin:0.6rem 0;">ΔW<sub>r</sub> = U<sub>:,1:r</sub> · Σ<sub>1:r</sub> · V<sub>1:r,:</sub><sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// Eckart–Young theorem</span></div>
If <code>ΔW</code>'s singular values decay quickly (which Aghajanyan et al. showed they do for fine-tuning), the top few capture most of the energy. LoRA <strong>directly learns</strong> matrices <code>B</code> and <code>A</code> that absorb this top-r structure, without ever needing to compute or store the full <code>ΔW</code>.</div>`,`<div class="info it"><div class="il">Warum Low Rank funktioniert: die SVD-Perspektive</div>
Jede Matrix hat eine <strong>Singulärwertzerlegung</strong> (SVD): <code>ΔW = U Σ V<sup>T</sup></code>, wobei Σ die Singulärwerte in absteigender Reihenfolge enthält. Die beste Näherung vom Rang <code>r</code> an <code>ΔW</code> (in der Frobenius-Norm) erhält man, indem man nur die <em>größten r Singulärwerte</em> behält:
<div class="formula" style="margin:0.6rem 0;">ΔW<sub>r</sub> = U<sub>:,1:r</sub> · Σ<sub>1:r</sub> · V<sub>1:r,:</sub><sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// Satz von Eckart–Young</span></div>
Fallen die Singulärwerte von <code>ΔW</code> schnell ab (was Aghajanyan et al. fürs Fine-Tuning gezeigt haben), erfassen die ersten paar den Großteil der Energie. LoRA <strong>lernt direkt</strong> Matrizen <code>B</code> und <code>A</code>, die diese Top-r-Struktur aufnehmen, ohne je das vollständige <code>ΔW</code> berechnen oder speichern zu müssen.</div>`);

  h += L(`<div class="info iac"><div class="il">The payoff</div>
Trainable parameters drop from <code>d²</code> to <code>2dr</code>. For <code>d = 4096</code> (LLaMA-7B) and <code>r = 8</code>:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• Full fine-tuning (per layer):</td><td style="padding-left:1rem;">4096² = <strong>16 777 216</strong> params</td></tr>
<tr><td>• LoRA (per layer):</td><td style="padding-left:1rem;">2 · 4096 · 8 = <strong>65 536</strong> params</td></tr>
<tr><td>• Compression ratio:</td><td style="padding-left:1rem;"><strong>256× smaller</strong></td></tr>
</table></div>`,`<div class="info iac"><div class="il">Der Gewinn</div>
Die trainierbaren Parameter sinken von <code>d²</code> auf <code>2dr</code>. Für <code>d = 4096</code> (LLaMA-7B) und <code>r = 8</code>:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• Volles Fine-Tuning (pro Schicht):</td><td style="padding-left:1rem;">4096² = <strong>16 777 216</strong> Parameter</td></tr>
<tr><td>• LoRA (pro Schicht):</td><td style="padding-left:1rem;">2 · 4096 · 8 = <strong>65 536</strong> Parameter</td></tr>
<tr><td>• Kompressionsverhältnis:</td><td style="padding-left:1rem;"><strong>256× kleiner</strong></td></tr>
</table></div>`);

  return h;
}},

// ───────────────────── 4. DECOMPOSITION ─────────────────────
{id: 'decomp', get title(){return L('Decomposition','Zerlegung');}, get group(){return L('Decomposition','Zerlegung');},
render() {
  const S = computeState();
  let h = L(`<div class="stage-title">The LoRA Decomposition <span class="tag tac">DECOMPOSE</span></div>`,`<div class="stage-title">Die LoRA-Zerlegung <span class="tag tac">ZERLEGUNG</span></div>`);
  h += L(`<p class="stage-desc">Concretely, LoRA replaces the weight update with the product of two trainable matrices and freezes the original weight. Below are the actual matrices for the current rank <code>r = ${S.r}</code> — change the slider in the header to see how they grow and shrink.</p>`,`<p class="stage-desc">Konkret ersetzt LoRA das Gewichts-Update durch das Produkt zweier trainierbarer Matrizen und friert das ursprüngliche Gewicht ein. Unten stehen die tatsächlichen Matrizen für den aktuellen Rang <code>r = ${S.r}</code> — ändere den Regler im Header, um sie wachsen und schrumpfen zu sehen.</p>`);

  h += `<div class="formula"><span class="gry">W</span><sub>eff</sub> = <span class="gry">W</span> + (α/r) · <span class="grn">B</span><span class="red">A</span>&nbsp;&nbsp;&nbsp;<span class="cm">// d×d  =  d×d  +  d×r · r×d</span><br>
${L('shapes','Formen')}: &nbsp;[${D}×${D}] = [${D}×${D}] + [${D}×${S.r}] · [${S.r}×${D}]</div>`;

  // Show A, B, BA
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderMtx(S.B, `B [${D}×${S.r}]`, 'cb');
  h += `<span class="op">·</span>`;
  h += renderMtx(S.A, `A [${S.r}×${D}]`, 'ca');
  h += `<span class="op">=</span>`;
  h += renderMtx(S.BA, `BA [${D}×${D}]`, 'cba');
  h += `</div></div>`;

  h += L(`<div class="info ip"><div class="il">Notice the shape</div>
<code>B</code> is tall and skinny (${D}×${S.r}), <code>A</code> is short and wide (${S.r}×${D}). Their product <code>BA</code> is a full ${D}×${D} matrix — same shape as <code>W</code> — but it's mathematically constrained to have <strong>rank ≤ ${S.r}</strong>. No matter what values you put in <code>A</code> and <code>B</code>, you can never produce a <code>BA</code> with more than ${S.r} linearly independent rows or columns.</div>`,`<div class="info ip"><div class="il">Beachte die Form</div>
<code>B</code> ist hoch und schmal (${D}×${S.r}), <code>A</code> ist flach und breit (${S.r}×${D}). Ihr Produkt <code>BA</code> ist eine volle ${D}×${D}-Matrix — dieselbe Form wie <code>W</code> —, aber mathematisch auf <strong>Rang ≤ ${S.r}</strong> beschränkt. Egal welche Werte man in <code>A</code> und <code>B</code> einträgt, man kann nie ein <code>BA</code> mit mehr als ${S.r} linear unabhängigen Zeilen oder Spalten erzeugen.</div>`);

  // Adding to W
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Combining with the frozen weights</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Kombination mit den eingefrorenen Gewichten</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += `<div class="locked">${renderMtx(W, L('W (frozen)','W (eingefroren)'), 'cf')}</div>`;
  h += `<span class="op">+ ${(S.scale).toFixed(2)} ·</span>`;
  h += renderMtx(S.BA, 'BA', 'cba');
  h += `<span class="op">=</span>`;
  h += renderMtx(S.W_eff, 'W + (α/r)·BA', 'cacc');
  h += `</div></div>`;

  h += L(`<div class="info iac"><div class="il">The α/r scaling factor</div>
The factor <code>α/r = ${ALPHA}/${S.r} = ${S.scale.toFixed(2)}</code> normalizes the magnitude of the LoRA update. Without it, doubling <code>r</code> would also roughly double the size of <code>BA</code>'s entries, which would force you to re-tune the learning rate. With <code>α/r</code> scaling, you can change <code>r</code> freely without breaking your training recipe — α stays fixed (typically α = 8 or 16) and r becomes a pure capacity knob.</div>`,`<div class="info iac"><div class="il">Der Skalierungsfaktor α/r</div>
Der Faktor <code>α/r = ${ALPHA}/${S.r} = ${S.scale.toFixed(2)}</code> normalisiert die Größe des LoRA-Updates. Ohne ihn würde eine Verdopplung von <code>r</code> auch die Einträge von <code>BA</code> ungefähr verdoppeln, was ein Neu-Tunen der Lernrate erzwingen würde. Mit der <code>α/r</code>-Skalierung lässt sich <code>r</code> frei ändern, ohne das Trainingsrezept zu brechen — α bleibt fest (typisch α = 8 oder 16), und r wird zu einem reinen Kapazitätsregler.</div>`);

  return h;
}},

// ───────────────────── 5. INITIALIZATION ─────────────────────
{id: 'init', get title(){return L('Initialization','Initialisierung');}, get group(){return L('Decomposition','Zerlegung');},
render() {
  const S = computeState();
  // At initialization: A is random, B is zero
  const A_init = S.A.map(row => row.map(v => v));   // pretend it's the gaussian init
  const B_init = zeros(D, S.r);
  const BA_init = matmul(B_init, A_init);

  let h = L(`<div class="stage-title">Initialization: A Random, B = 0 <span class="tag tg">INIT</span></div>`,`<div class="stage-title">Initialisierung: A zufällig, B = 0 <span class="tag tg">INIT</span></div>`);
  h += L(`<p class="stage-desc">A clever trick from the LoRA paper: at the start of training, <code>A</code> is initialized with random Gaussian noise, but <code>B</code> is initialized to <strong>all zeros</strong>. This means <code>BA = 0 · A = 0</code> at step 0, so the LoRA-augmented model behaves <em>exactly like the original pre-trained model</em>.</p>`,`<p class="stage-desc">Ein cleverer Trick aus dem LoRA-Paper: Zu Trainingsbeginn wird <code>A</code> mit zufälligem Gauß-Rauschen initialisiert, <code>B</code> aber mit <strong>lauter Nullen</strong>. Damit ist <code>BA = 0 · A = 0</code> in Schritt 0, und das mit LoRA erweiterte Modell verhält sich <em>exakt wie das ursprüngliche vortrainierte Modell</em>.</p>`);

  h += `<div class="formula">A ~ 𝒩(0, σ²)&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('random Gaussian','zufällig gaußverteilt')}</span><br>B = <span class="grn">0</span>&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('zero matrix','Nullmatrix')}</span><br>⇒ BA = <span class="grn">0</span> · A = <span class="grn">0</span>&nbsp;&nbsp;&nbsp;⇒&nbsp;&nbsp;&nbsp;W<sub>eff</sub> = W + 0 = <span class="gry">W</span></div>`;

  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderMtx(B_init, L('B (initialized to 0)','B (mit 0 initialisiert)'), 'cz');
  h += `<span class="op">·</span>`;
  h += renderMtx(A_init, L('A (random Gaussian)','A (zufällig gaußverteilt)'), 'ca');
  h += `<span class="op">=</span>`;
  h += renderMtx(BA_init, `BA = 0`, 'cz');
  h += `</div></div>`;

  h += L(`<div class="info iib"><div class="il">Why this matters</div>
If both <code>A</code> and <code>B</code> were random at init, the LoRA branch would inject random noise into every layer — the model's outputs would be garbage, the loss would spike, and training would have to spend the first few thousand steps "undoing" the noise. By starting with <code>BA = 0</code>, the model begins as <em>exactly</em> the pre-trained checkpoint, then gradually moves away from it as gradients flow into <code>B</code> (and through <code>B</code> into <code>A</code>). It's a smooth, monotonic departure from the base model.</div>`,`<div class="info iib"><div class="il">Warum das wichtig ist</div>
Wären <code>A</code> und <code>B</code> bei der Initialisierung beide zufällig, würde der LoRA-Zweig Zufallsrauschen in jede Schicht einspeisen — die Modellausgaben wären Müll, der Loss würde hochschnellen, und das Training müsste die ersten paar tausend Schritte damit verbringen, das Rauschen „rückgängig zu machen". Mit <code>BA = 0</code> als Start beginnt das Modell als <em>exakt</em> der vortrainierte Checkpoint und entfernt sich dann allmählich davon, während Gradienten in <code>B</code> (und über <code>B</code> in <code>A</code>) fließen. Ein sanftes, monotones Abweichen vom Basismodell.</div>`);

  h += L(`<div class="info iac"><div class="il">The asymmetry trick</div>
Why not the other way around — <code>B</code> random, <code>A</code> zero? Mathematically equivalent: either way <code>BA = 0</code> at init. The convention of "<code>A</code> random, <code>B</code> zero" is the one used in the original paper and the Hugging Face PEFT library. Both work; the asymmetric initialization just needs <em>one</em> of them to be zero.</div>`,`<div class="info iac"><div class="il">Der Asymmetrie-Trick</div>
Warum nicht andersherum — <code>B</code> zufällig, <code>A</code> null? Mathematisch gleichwertig: So oder so ist <code>BA = 0</code> zu Beginn. Die Konvention „<code>A</code> zufällig, <code>B</code> null" ist die aus dem Original-Paper und der Hugging-Face-PEFT-Bibliothek. Beides funktioniert; die asymmetrische Initialisierung braucht nur, dass <em>eine</em> der beiden null ist.</div>`);

  return h;
}},

// ───────────────────── 6. FORWARD PASS ─────────────────────
{id: 'forward', get title(){return L('Forward Pass','Forward-Pass');}, get group(){return L('Decomposition','Zerlegung');},
render() {
  const S = computeState();
  let h = L(`<div class="stage-title">The Forward Pass <span class="tag tac">FORWARD</span></div>`,`<div class="stage-title">Der Forward-Pass <span class="tag tac">FORWARD</span></div>`);
  h += L(`<p class="stage-desc">During inference, the input <code>x</code> flows through <strong>both branches in parallel</strong>: the frozen <code>W</code> path and the LoRA <code>BA</code> path. Their outputs are summed.</p>`,`<p class="stage-desc">Bei der Inferenz fließt die Eingabe <code>x</code> <strong>parallel durch beide Zweige</strong>: den eingefrorenen <code>W</code>-Pfad und den LoRA-<code>BA</code>-Pfad. Ihre Ausgaben werden summiert.</p>`);

  h += `<div class="formula">h = <span class="gry">W</span>x + (α/r) · <span class="grn">B</span>(<span class="red">A</span>x)&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('note: B(Ax), not (BA)x — same result, much cheaper!','Hinweis: B(Ax), nicht (BA)x — gleiches Ergebnis, viel billiger!')}</span></div>`;

  h += L(`<div class="info ip"><div class="il">Why compute B(Ax) instead of (BA)x</div>
Mathematically <code>B(Ax) = (BA)x</code>, but the order of operations matters for efficiency:<br><br>
• <code>(BA)x</code> first computes <code>BA</code> (a full d×d matrix, <code>O(d²r)</code> ops to build, <code>O(d²)</code> memory) then multiplies by <code>x</code> (<code>O(d²)</code> ops) — total <strong>O(d²r + d²)</strong>.<br>
• <code>B(Ax)</code> first computes <code>Ax</code> (an r-dim vector, <code>O(dr)</code> ops) then <code>B(·)</code> (<code>O(dr)</code> ops) — total <strong>O(2dr)</strong>.<br><br>
For <code>d = 4096, r = 8</code>: that's <strong>~16M ops vs ~65k ops</strong>, a ~250× speedup. LoRA is cheap precisely because you never materialize <code>BA</code> at inference time.</div>`,`<div class="info ip"><div class="il">Warum B(Ax) statt (BA)x berechnen</div>
Mathematisch gilt <code>B(Ax) = (BA)x</code>, aber die Reihenfolge der Operationen ist für die Effizienz entscheidend:<br><br>
• <code>(BA)x</code> berechnet zuerst <code>BA</code> (eine volle d×d-Matrix, <code>O(d²r)</code> Operationen zum Aufbau, <code>O(d²)</code> Speicher) und multipliziert dann mit <code>x</code> (<code>O(d²)</code> Operationen) — insgesamt <strong>O(d²r + d²)</strong>.<br>
• <code>B(Ax)</code> berechnet zuerst <code>Ax</code> (einen r-dim Vektor, <code>O(dr)</code> Operationen), dann <code>B(·)</code> (<code>O(dr)</code> Operationen) — insgesamt <strong>O(2dr)</strong>.<br><br>
Für <code>d = 4096, r = 8</code>: das sind <strong>~16 M Operationen gegenüber ~65 k</strong>, ein ~250-facher Geschwindigkeitsgewinn. LoRA ist gerade deshalb billig, weil man <code>BA</code> bei der Inferenz nie materialisiert.</div>`);

  // Show input
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Step 1 · Input vector</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Schritt 1 · Eingabevektor</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderVec(X, 'x', 'cacc');
  h += `</div></div>`;

  // Frozen branch
  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Step 2 · Frozen branch — Wx</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Schritt 2 · Eingefrorener Zweig — Wx</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += `<div class="locked">${renderMtx(W, 'W', 'cf')}</div>`;
  h += `<span class="op">·</span>`;
  h += renderVec(X, 'x', 'cacc');
  h += `<span class="op">=</span>`;
  h += renderVec(S.Wx, 'Wx', 'cf');
  h += `</div></div>`;

  // LoRA branch
  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Step 3 · LoRA branch — first compress to r dims, then expand back</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Schritt 3 · LoRA-Zweig — erst auf r Dims komprimieren, dann wieder aufweiten</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderMtx(S.A, 'A', 'ca');
  h += `<span class="op">·</span>`;
  h += renderVec(X, 'x', 'cacc');
  h += `<span class="op">=</span>`;
  h += renderVec(S.Ax, `Ax (r=${S.r})`, 'ca');
  h += `</div></div>`;

  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderMtx(S.B, 'B', 'cb');
  h += `<span class="op">·</span>`;
  h += renderVec(S.Ax, 'Ax', 'ca');
  h += `<span class="op">=</span>`;
  h += renderVec(S.BAx, 'BAx', 'cb');
  h += `</div></div>`;

  // Sum
  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Step 4 · Combine — Wx + (α/r)·BAx</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Schritt 4 · Zusammenführen — Wx + (α/r)·BAx</h3>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += renderVec(S.Wx, 'Wx', 'cf');
  h += `<span class="op">+ ${S.scale.toFixed(2)} ·</span>`;
  h += renderVec(S.BAx, 'BAx', 'cb');
  h += `<span class="op">=</span>`;
  h += renderVec(S.h, L('h (output)','h (Ausgabe)'), 'cacc');
  h += `</div></div>`;

  h += L(`<div class="info iac"><div class="il">Compare to a vanilla layer</div>
Without LoRA, the layer would just compute <code>h = Wx</code>. LoRA <em>adds</em> a small correction <code>(α/r)·BAx</code> that nudges the output toward the fine-tuned task — a "residual" applied to the frozen pre-trained behavior, conceptually similar to a residual connection but in weight space.</div>`,`<div class="info iac"><div class="il">Vergleich mit einer gewöhnlichen Schicht</div>
Ohne LoRA würde die Schicht einfach <code>h = Wx</code> berechnen. LoRA <em>addiert</em> eine kleine Korrektur <code>(α/r)·BAx</code>, die die Ausgabe in Richtung der feinjustierten Aufgabe schubst — ein „Residuum" auf das eingefrorene vortrainierte Verhalten, konzeptionell ähnlich einer Residual-Verbindung, aber im Gewichtsraum.</div>`);

  return h;
}},

// ───────────────────── 7. RANK EXPLORER ─────────────────────
{id: 'rank-explorer', get title(){return L('Rank Explorer','Rang-Explorer');}, get group(){return L('Training','Training');},

  // Live A, B, BA
  h += `<div class="mtx-wrap"><div class="mtx-row">`;

  h += renderMtx(S.A, `A [${S.r}×${D}]`, 'ca');

<div class="param-card"><div class="lbl">LoRA (r=${S.r})</div><div class="big">${S.loraParams}</div><div class="sub">2dr = 2·${D}·${S.r} params</div></div>

</div>`,`<div class="param-grid">
<div class="param-card"><div class="lbl">Volles Fine-Tuning</div><div class="big">${S.fullParams}</div><div class="sub">d² = ${D}² Parameter</div></div>

<div class="param-card"><div class="lbl">Trainierbarer Anteil</div><div class="big">${ratio}%</div><div class="sub">${(S.fullParams/S.loraParams).toFixed(1)}× Kompression</div></div>
</div>`);

  // Visual bar
  h += `<div class="bar-wrap">
<div class="bar-lbl"><span>${L('LoRA params','LoRA-Parameter')}</span><span>${S.loraParams} / ${S.fullParams}</span></div>
<div class="bar-track"><div class="bar-fill" style="width:${ratio}%;background:var(--acc);"></div></div>
</div>`;

  // Real-world comparison
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Scaling to real models</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Übertragen auf echte Modelle</h3>`);
  h += L(`<p class="stage-desc">What happens if we apply this same ratio to one weight matrix in real architectures?</p>`,`<p class="stage-desc">Was passiert, wenn wir dasselbe Verhältnis auf eine Gewichtsmatrix in echten Architekturen anwenden?</p>`);
  const realModels = [
    {name: 'GPT-2 small', d: 768},
    {name: 'GPT-2 large', d: 1280},
    {name: 'LLaMA-7B', d: 4096},
    {name: 'LLaMA-65B', d: 8192},

  h += `<div class="glossary"><table>
<tr><th>${L('Model','Modell')}</th><th>d</th><th>${L('Full FT (per matrix)','Volles FT (pro Matrix)')}</th><th>LoRA r=${S.r} (${L('per matrix','pro Matrix')})</th><th>${L('Compression','Kompression')}</th></tr>`;
  realModels.forEach(m => {
    const full = m.d * m.d;
    const lora = 2 * m.d * S.r;

    h += `<tr><td><strong>${m.name}</strong></td><td class="val">${m.d}</td><td class="val">${full.toLocaleString()}</td><td class="val" style="color:var(--acc);">${lora.toLocaleString()}</td><td class="val">${comp}×</td></tr>`;
  });
  h += `</table></div>`;

  h += L(`<div class="info iac"><div class="il">How to pick r in practice</div>
The original paper found that <strong>r = 1 to 8 works surprisingly well</strong> for most tasks. Hu et al. showed that even <code>r = 1</code> can match full fine-tuning on some benchmarks. Common defaults:<br><br>
• <strong>r = 4 or 8</strong> — typical for instruction tuning, classification, simple adaptation<br>
• <strong>r = 16 or 32</strong> — for tasks that diverge more from the base model (different language, very specialized domain)<br>
• <strong>r = 64+</strong> — rarely needed; if you need this much capacity, full fine-tuning may be more appropriate
</div>`,`<div class="info iac"><div class="il">Wie man r in der Praxis wählt</div>
Das Original-Paper fand, dass <strong>r = 1 bis 8 für die meisten Aufgaben überraschend gut funktioniert</strong>. Hu et al. zeigten, dass selbst <code>r = 1</code> auf manchen Benchmarks volles Fine-Tuning erreicht. Übliche Standardwerte:<br><br>
• <strong>r = 4 oder 8</strong> — typisch für Instruction-Tuning, Klassifikation, einfache Anpassung<br>
• <strong>r = 16 oder 32</strong> — für Aufgaben, die stärker vom Basismodell abweichen (andere Sprache, sehr spezialisierte Domäne)<br>

</div>`);

  h += L(`<div class="info ig"><div class="il">The diminishing returns</div>
Counter-intuitively, increasing <code>r</code> beyond ~8 often does <em>not</em> improve task performance — it just adds more parameters that the optimizer doesn't really use. This is itself empirical evidence for the low-intrinsic-rank hypothesis: the useful subspace really is small.</div>`,`<div class="info ig"><div class="il">Der abnehmende Ertrag</div>
Kontraintuitiv: <code>r</code> über ~8 hinaus zu erhöhen verbessert die Aufgabenleistung oft <em>nicht</em> — es fügt nur Parameter hinzu, die der Optimizer nicht wirklich nutzt. Das ist selbst ein empirischer Beleg für die Hypothese des niedrigen intrinsischen Rangs: Der nützliche Unterraum ist wirklich klein.</div>`);

  h += L(`<div class="info if"><div class="il">A quirk of this toy demo</div>
LoRA's parameter savings (<code>2dr &lt; d²</code>) only hold when <code>r &lt; d/2</code>. In this 6×6 demo, that's <code>r ≤ 2</code>. At <code>r = 3</code> the LoRA matrices have exactly as many params as <code>W</code> (36 = 36), and at <code>r = 4</code> they have <em>more</em> (48 &gt; 36). This is a corner case of the small <code>d</code> we're using for visibility — in real models with <code>d = 4096+</code>, <code>r = 8</code> gives a 256× compression, and you'd never come anywhere near the breakeven point.</div>`,`<div class="info if"><div class="il">Eine Eigenheit dieser Spielzeug-Demo</div>
LoRAs Parameterersparnis (<code>2dr &lt; d²</code>) gilt nur für <code>r &lt; d/2</code>. In dieser 6×6-Demo heißt das <code>r ≤ 2</code>. Bei <code>r = 3</code> haben die LoRA-Matrizen genau so viele Parameter wie <code>W</code> (36 = 36), und bei <code>r = 4</code> haben sie <em>mehr</em> (48 &gt; 36). Das ist ein Grenzfall des kleinen <code>d</code>, das wir der Übersicht halber verwenden — in echten Modellen mit <code>d = 4096+</code> ergibt <code>r = 8</code> eine 256-fache Kompression, und man kommt dem Break-even nie auch nur nahe.</div>`);

  return h;
}},

</svg>
</div>`;

  h += L(`<div class="info iac"><div class="il">Memory budget per parameter</div>
With Adam in mixed precision:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• fp16 weight:</td><td style="padding-left:1rem;">2 bytes</td></tr>
<tr><td>• fp16 gradient:</td><td style="padding-left:1rem;">2 bytes</td></tr>
<tr><td>• fp32 momentum (m):</td><td style="padding-left:1rem;">4 bytes</td></tr>
<tr><td>• fp32 variance (v):</td><td style="padding-left:1rem;">4 bytes</td></tr>
<tr><td>• fp32 master copy:</td><td style="padding-left:1rem;">4 bytes</td></tr>
<tr><td><strong>Total per trained param:</strong></td><td style="padding-left:1rem;"><strong>~16 bytes</strong></td></tr>
<tr><td><strong>Per frozen param:</strong></td><td style="padding-left:1rem;"><strong>2 bytes (just the weight)</strong></td></tr>
</table>
<br>So freezing 99.99% of the model means 99.99% of the parameters cost 2 bytes instead of 16 — an <strong>8× memory reduction</strong> on top of the parameter reduction.</div>`,`<div class="info iac"><div class="il">Speicherbudget pro Parameter</div>
Mit Adam in Mixed Precision:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td>• fp16-Gewicht:</td><td style="padding-left:1rem;">2 Byte</td></tr>
<tr><td>• fp16-Gradient:</td><td style="padding-left:1rem;">2 Byte</td></tr>
<tr><td>• fp32-Momentum (m):</td><td style="padding-left:1rem;">4 Byte</td></tr>
<tr><td>• fp32-Varianz (v):</td><td style="padding-left:1rem;">4 Byte</td></tr>
<tr><td>• fp32-Master-Kopie:</td><td style="padding-left:1rem;">4 Byte</td></tr>
<tr><td><strong>Gesamt pro trainiertem Parameter:</strong></td><td style="padding-left:1rem;"><strong>~16 Byte</strong></td></tr>
<tr><td><strong>Pro eingefrorenem Parameter:</strong></td><td style="padding-left:1rem;"><strong>2 Byte (nur das Gewicht)</strong></td></tr>
</table>
<br>99,99 % des Modells einzufrieren heißt also, dass 99,99 % der Parameter 2 statt 16 Byte kosten — eine <strong>8-fache Speicherreduktion</strong> zusätzlich zur Parameterreduktion.</div>`);

  h += L(`<div class="info iib"><div class="il">The gradient still flows through W</div>
Even though <code>W</code> isn't updated, gradients still flow <em>through</em> it during backprop, because <code>A</code> and <code>B</code> sit in parallel with <code>W</code>. The chain rule for the LoRA branch is:<br>
<div class="formula" style="margin:0.6rem 0;">∂L/∂B = (∂L/∂h) · (Ax)<sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// outer product of upstream grad and Ax</span><br>∂L/∂A = B<sup>T</sup> · (∂L/∂h) · x<sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// also depends on x and B</span></div>
The frozen <code>W</code> never appears in these gradients, which is why it doesn't matter that we don't store its gradient.</div>`,`<div class="info iib"><div class="il">Der Gradient fließt trotzdem durch W</div>
Obwohl <code>W</code> nicht aktualisiert wird, fließen Gradienten beim Backprop weiterhin <em>durch</em> es hindurch, weil <code>A</code> und <code>B</code> parallel zu <code>W</code> sitzen. Die Kettenregel für den LoRA-Zweig lautet:<br>
<div class="formula" style="margin:0.6rem 0;">∂L/∂B = (∂L/∂h) · (Ax)<sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// äußeres Produkt aus Upstream-Gradient und Ax</span><br>∂L/∂A = B<sup>T</sup> · (∂L/∂h) · x<sup>T</sup>&nbsp;&nbsp;&nbsp;<span class="cm">// hängt auch von x und B ab</span></div>
Das eingefrorene <code>W</code> taucht in diesen Gradienten nie auf — deshalb ist es egal, dass wir seinen Gradienten nicht speichern.</div>`);

  return h;
}},

// ───────────────────── 10. INFERENCE ─────────────────────
{id: 'inference', get title(){return L('Inference Modes','Inferenzmodi');}, get group(){return L('Inference','Inferenz');},
render() {
  const S = computeState();
  let h = L(`<div class="stage-title">Inference: Merged vs Unmerged <span class="tag tac">INFERENCE</span></div>`,`<div class="stage-title">Inferenz: verschmolzen vs. getrennt <span class="tag tac">INFERENZ</span></div>`);
  h += L(`<p class="stage-desc">After training, you have two options for serving the LoRA-fine-tuned model. The choice depends on whether you'll need to switch tasks at runtime.</p>`,`<p class="stage-desc">Nach dem Training gibt es zwei Möglichkeiten, das mit LoRA feinjustierte Modell auszuliefern. Die Wahl hängt davon ab, ob man zur Laufzeit zwischen Aufgaben wechseln muss.</p>`);

  h += L(`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Option A · Merge into the base weights</h3>`,`<h3 style="margin-top:1rem;font-size:0.95rem;color:var(--txt);">Option A · In die Basisgewichte verschmelzen</h3>`);
  h += `<div class="formula"><span class="gry">W</span><sub>merged</sub> = <span class="gry">W</span> + (α/r) · <span class="grn">B</span><span class="red">A</span>&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('done once, then discard A and B','einmal ausführen, dann A und B verwerfen')}</span></div>`;
  h += L(`<div class="info iib"><div class="il">Pros</div>
• <strong>Zero inference overhead.</strong> The model is now indistinguishable from a fully fine-tuned one — same number of matmul ops per forward pass, same latency.<br>
• <strong>Compatible with any inference engine.</strong> No special LoRA support needed.</div>`,`<div class="info iib"><div class="il">Vorteile</div>
• <strong>Kein Inferenz-Overhead.</strong> Das Modell ist jetzt nicht von einem voll feinjustierten zu unterscheiden — gleiche Anzahl Matmul-Operationen pro Forward-Pass, gleiche Latenz.<br>
• <strong>Kompatibel mit jeder Inferenz-Engine.</strong> Keine spezielle LoRA-Unterstützung nötig.</div>`);
  h += L(`<div class="info if"><div class="il">Cons</div>
• <strong>Locked to one task.</strong> Once merged, you can't switch adapters without reloading the base model.<br>
• <strong>Loses the small-checkpoint benefit.</strong> The merged model is the size of the original.</div>`,`<div class="info if"><div class="il">Nachteile</div>
• <strong>Auf eine Aufgabe festgelegt.</strong> Einmal verschmolzen, kann man Adapter nicht wechseln, ohne das Basismodell neu zu laden.<br>
• <strong>Verliert den Vorteil des kleinen Checkpoints.</strong> Das verschmolzene Modell ist so groß wie das Original.</div>`);

  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Option B · Keep A and B separate</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Option B · A und B getrennt halten</h3>`);
  h += `<div class="formula">h = <span class="gry">W</span>x + (α/r) · <span class="grn">B</span>(<span class="red">A</span>x)&nbsp;&nbsp;&nbsp;<span class="cm">// ${L('compute both branches at runtime','beide Zweige zur Laufzeit berechnen')}</span></div>`;
  h += L(`<div class="info iib"><div class="il">Pros</div>
• <strong>Hot-swap adapters.</strong> Different requests can use different adapters without reloading the base.<br>
• <strong>Tiny checkpoints.</strong> Each adapter is a few MB; one base model serves them all.<br>
• <strong>Composable.</strong> Multiple adapters can be combined or interpolated.</div>`,`<div class="info iib"><div class="il">Vorteile</div>
• <strong>Adapter im laufenden Betrieb wechseln.</strong> Verschiedene Anfragen können verschiedene Adapter nutzen, ohne die Basis neu zu laden.<br>
• <strong>Winzige Checkpoints.</strong> Jeder Adapter ist wenige MB groß; ein Basismodell bedient sie alle.<br>
• <strong>Kombinierbar.</strong> Mehrere Adapter lassen sich kombinieren oder interpolieren.</div>`);
  h += L(`<div class="info if"><div class="il">Cons</div>
• <strong>Slight latency overhead</strong> — one extra small matmul per LoRA layer (but only <code>O(2dr)</code> per token, negligible compared to <code>O(d²)</code>).</div>`,`<div class="info if"><div class="il">Nachteile</div>
• <strong>Leichter Latenz-Overhead</strong> — eine zusätzliche kleine Matmul pro LoRA-Schicht (aber nur <code>O(2dr)</code> pro Token, vernachlässigbar gegenüber <code>O(d²)</code>).</div>`);

  // Show the merged matrix
  h += L(`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Live merged matrix</h3>`,`<h3 style="margin-top:1.2rem;font-size:0.95rem;color:var(--txt);">Verschmolzene Matrix live</h3>`);
  h += L(`<p class="stage-desc">For the current rank r=${S.r}, this is what the merged effective weight looks like:</p>`,`<p class="stage-desc">Für den aktuellen Rang r=${S.r} sieht das verschmolzene effektive Gewicht so aus:</p>`);
  h += `<div class="mtx-wrap"><div class="mtx-row">`;
  h += `<div class="locked">${renderMtx(W, L('W (frozen)','W (eingefroren)'), 'cf')}</div>`;
  h += `<span class="op">+ ${S.scale.toFixed(2)} ·</span>`;
  h += renderMtx(S.BA, 'BA', 'cba');
  h += `<span class="op">=</span>`;
  h += renderMtx(S.W_eff, 'W_merged', 'cacc');
  h += `</div></div>`;

  h += L(`<div class="info iac"><div class="il">In practice</div>
Production systems like <strong>vLLM</strong>, <strong>TGI</strong>, and <strong>Hugging Face PEFT</strong> support both modes. For batch-of-one serving you typically merge; for multi-tenant serving (hundreds of users with different fine-tunes) you keep adapters separate and use techniques like <em>S-LoRA</em> to batch requests across adapters.</div>`,`<div class="info iac"><div class="il">In der Praxis</div>
Produktionssysteme wie <strong>vLLM</strong>, <strong>TGI</strong> und <strong>Hugging Face PEFT</strong> unterstützen beide Modi. Für Batch-Größe 1 verschmilzt man typischerweise; für Multi-Tenant-Serving (Hunderte Nutzer mit verschiedenen Fine-Tunes) hält man die Adapter getrennt und nutzt Techniken wie <em>S-LoRA</em>, um Anfragen über Adapter hinweg zu batchen.</div>`);

  // ── Parameters cheat sheet: where does each knob live? ──
  h += L(`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">Where does each parameter live?</h3>`,`<h3 style="margin-top:1.5rem;font-size:0.95rem;color:var(--txt);">Wo sitzt welcher Parameter?</h3>`);
  h += L(`<p class="stage-desc">A common point of confusion is mixing up LoRA hyperparameters (<code>r</code>, <code>α</code>) with sampling hyperparameters (<code>temperature</code>, <code>top-k</code>, <code>top-p</code>). They operate at <strong>completely different stages</strong> of the pipeline and solve different problems.</p>`,`<p class="stage-desc">Ein häufiger Irrtum ist, LoRA-Hyperparameter (<code>r</code>, <code>α</code>) mit Sampling-Hyperparametern (<code>temperature</code>, <code>top-k</code>, <code>top-p</code>) zu verwechseln. Sie wirken auf <strong>völlig verschiedenen Stufen</strong> der Pipeline und lösen verschiedene Probleme.</p>`);

  h += L(`<div class="glossary"><table>
<tr><th>Parameter</th><th>Stage</th><th>What it controls</th></tr>
<tr><td class="sym" style="color:var(--a);">r (rank)</td><td class="val">Fine-tuning</td><td><strong>Capacity of the LoRA adapter.</strong> How many dimensions the low-rank update can use. Decided once when you set up training, affects trainable parameter count.</td></tr>
<tr><td class="sym" style="color:var(--a);">α (alpha)</td><td class="val">Fine-tuning</td><td><strong>Strength of the LoRA update.</strong> Scales <code>BA</code> by <code>α/r</code> before adding to <code>W</code>. Decouples capacity from magnitude so you can change <code>r</code> without re-tuning the learning rate.</td></tr>
<tr><td class="sym" style="color:var(--b);">learning rate</td><td class="val">Fine-tuning</td><td>Standard optimizer knob controlling how big each gradient step is. LoRA typically tolerates much higher learning rates than full fine-tuning because only A and B are updated.</td></tr>
<tr><td class="sym" style="color:var(--b);">batch size, epochs</td><td class="val">Fine-tuning</td><td>Standard training knobs. Unchanged by LoRA.</td></tr>
<tr><td class="sym" style="color:var(--acc);">temperature (T)</td><td class="val">Sampling</td><td><strong>Shape of the output distribution</strong> over the vocabulary. Divides the final logits by <code>T</code> before softmax. <code>T &lt; 1</code> sharper, <code>T &gt; 1</code> flatter. Nothing to learn — you pick it at generation time.</td></tr>
<tr><td class="sym" style="color:var(--acc);">top-k, top-p</td><td class="val">Sampling</td><td><strong>Truncation of the output distribution.</strong> Keep only the k most likely tokens, or the smallest set whose cumulative probability exceeds p. Also chosen at generation time.</td></tr>
</table></div>`,`<div class="glossary"><table>
<tr><th>Parameter</th><th>Stufe</th><th>Was er steuert</th></tr>
<tr><td class="sym" style="color:var(--a);">r (Rang)</td><td class="val">Fine-Tuning</td><td><strong>Kapazität des LoRA-Adapters.</strong> Wie viele Dimensionen das Low-Rank-Update nutzen darf. Einmal beim Aufsetzen des Trainings festgelegt, beeinflusst die Zahl trainierbarer Parameter.</td></tr>
<tr><td class="sym" style="color:var(--a);">α (Alpha)</td><td class="val">Fine-Tuning</td><td><strong>Stärke des LoRA-Updates.</strong> Skaliert <code>BA</code> mit <code>α/r</code>, bevor es zu <code>W</code> addiert wird. Entkoppelt Kapazität von Größe, sodass man <code>r</code> ändern kann, ohne die Lernrate neu zu tunen.</td></tr>
<tr><td class="sym" style="color:var(--b);">Lernrate</td><td class="val">Fine-Tuning</td><td>Üblicher Optimizer-Regler für die Größe jedes Gradientenschritts. LoRA verträgt typischerweise deutlich höhere Lernraten als volles Fine-Tuning, weil nur A und B aktualisiert werden.</td></tr>
<tr><td class="sym" style="color:var(--b);">Batch-Größe, Epochen</td><td class="val">Fine-Tuning</td><td>Übliche Trainingsregler. Von LoRA unverändert.</td></tr>
<tr><td class="sym" style="color:var(--acc);">Temperatur (T)</td><td class="val">Sampling</td><td><strong>Form der Ausgabeverteilung</strong> über das Vokabular. Teilt die finalen Logits vor dem Softmax durch <code>T</code>. <code>T &lt; 1</code> schärfer, <code>T &gt; 1</code> flacher. Nichts zu lernen — man wählt sie zur Generierungszeit.</td></tr>
<tr><td class="sym" style="color:var(--acc);">top-k, top-p</td><td class="val">Sampling</td><td><strong>Beschneiden der Ausgabeverteilung.</strong> Nur die k wahrscheinlichsten Token behalten oder die kleinste Menge, deren kumulierte Wahrscheinlichkeit p überschreitet. Ebenfalls zur Generierungszeit gewählt.</td></tr>
</table></div>`);

  h += L(`<div class="info ip"><div class="il">Why temperature is NOT a LoRA parameter</div>
LoRA lives <strong>inside</strong> the forward pass: it changes how every weight matrix transforms activations, producing different logits than the base model would. Temperature lives <strong>after</strong> the forward pass: it reshapes whatever logits the model produces before sampling. These stages are completely separate:
<div class="formula" style="margin:0.6rem 0;">Wx + (α/r)·BAx &nbsp;→ ... forward pass ... → &nbsp;logits &nbsp;→ &nbsp;logits/T &nbsp;→ &nbsp;softmax &nbsp;→ &nbsp;sample<br>
<span class="cm">└────── LoRA changes the distribution ──────┘    └── temperature shapes how you read it ──┘</span></div>
Put another way: <strong>LoRA changes what the model says; temperature changes how creative it sounds when saying it.</strong> A LoRA-fine-tuned model still uses temperature, top-k, and top-p at generation time — exactly the same way any other transformer does. See the GPT decoder simulator for the mechanics of temperature at the softmax step.</div>`,`<div class="info ip"><div class="il">Warum die Temperatur KEIN LoRA-Parameter ist</div>
LoRA lebt <strong>innerhalb</strong> des Forward-Pass: Es ändert, wie jede Gewichtsmatrix Aktivierungen transformiert, und erzeugt andere Logits, als das Basismodell erzeugen würde. Die Temperatur lebt <strong>nach</strong> dem Forward-Pass: Sie formt die Logits, die das Modell liefert, vor dem Sampling um. Diese Stufen sind völlig getrennt:
<div class="formula" style="margin:0.6rem 0;">Wx + (α/r)·BAx &nbsp;→ ... Forward-Pass ... → &nbsp;Logits &nbsp;→ &nbsp;Logits/T &nbsp;→ &nbsp;Softmax &nbsp;→ &nbsp;Sampling<br>
<span class="cm">└────── LoRA ändert die Verteilung ─────────┘    └── Temperatur formt, wie man sie liest ──┘</span></div>
Anders gesagt: <strong>LoRA ändert, was das Modell sagt; die Temperatur ändert, wie kreativ es dabei klingt.</strong> Ein mit LoRA feinjustiertes Modell nutzt zur Generierungszeit weiterhin Temperatur, top-k und top-p — genau wie jeder andere Transformer. Die Mechanik der Temperatur am Softmax-Schritt zeigt der GPT-Decoder-Simulator.</div>`);

  h += L(`<div class="info iib"><div class="il">Training-time vs inference-time, in one sentence</div>
<strong>Fine-tuning hyperparameters</strong> (<code>r</code>, <code>α</code>, learning rate) are decided <em>before</em> training and baked into the trained adapter. <strong>Sampling hyperparameters</strong> (<code>temperature</code>, <code>top-k</code>, <code>top-p</code>) are decided <em>per generation request</em> and can be changed on the fly without retraining anything.</div>`,`<div class="info iib"><div class="il">Trainingszeit vs. Inferenzzeit, in einem Satz</div>
<strong>Fine-Tuning-Hyperparameter</strong> (<code>r</code>, <code>α</code>, Lernrate) werden <em>vor</em> dem Training festgelegt und in den trainierten Adapter eingebacken. <strong>Sampling-Hyperparameter</strong> (<code>temperature</code>, <code>top-k</code>, <code>top-p</code>) werden <em>pro Generierungsanfrage</em> festgelegt und lassen sich im laufenden Betrieb ändern, ohne irgendetwas neu zu trainieren.</div>`);

  return h;
}},

</svg>

  h += L(`<div class="info iac"><div class="il">The economic argument</div>
Suppose you're a SaaS company offering "your own fine-tuned LLM" as a product, with 1000 customers. The math:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td><strong>Full fine-tuning:</strong></td><td style="padding-left:1rem;">1000 × 14 GB = <strong>14 TB</strong> of weights</td></tr>
<tr><td><strong>LoRA (r=8):</strong></td><td style="padding-left:1rem;">14 GB base + 1000 × 10 MB = <strong>~24 GB</strong></td></tr>
<tr><td><strong>Reduction:</strong></td><td style="padding-left:1rem;"><strong>~580×</strong></td></tr>
</table>
<br>Even better, the base model fits in GPU memory <em>once</em>, and adapters can be loaded from RAM/SSD on demand.</div>`,`<div class="info iac"><div class="il">Das wirtschaftliche Argument</div>
Angenommen, man ist ein SaaS-Unternehmen, das „dein eigenes feinjustiertes LLM" als Produkt anbietet, mit 1000 Kunden. Die Rechnung:<br><br>
<table style="font-family:var(--mono);font-size:0.78rem;">
<tr><td><strong>Volles Fine-Tuning:</strong></td><td style="padding-left:1rem;">1000 × 14 GB = <strong>14 TB</strong> Gewichte</td></tr>
<tr><td><strong>LoRA (r=8):</strong></td><td style="padding-left:1rem;">14 GB Basis + 1000 × 10 MB = <strong>~24 GB</strong></td></tr>
<tr><td><strong>Reduktion:</strong></td><td style="padding-left:1rem;"><strong>~580×</strong></td></tr>
</table>
<br>Noch besser: Das Basismodell passt <em>einmal</em> in den GPU-Speicher, und Adapter können bei Bedarf aus RAM/SSD geladen werden.</div>`);

  h += L(`<div class="info iib"><div class="il">Hot-swapping in production</div>
Frameworks like <strong>S-LoRA</strong>, <strong>Punica</strong>, and <strong>vLLM with multi-LoRA</strong> can serve thousands of distinct LoRA adapters from a single GPU. They batch incoming requests by base model (all sharing the same frozen W) and apply per-request LoRA branches in parallel. This is how Replicate, Together AI, and similar platforms host dozens of fine-tuned variants at low cost.</div>`,`<div class="info iib"><div class="il">Hot-Swapping in der Produktion</div>
Frameworks wie <strong>S-LoRA</strong>, <strong>Punica</strong> und <strong>vLLM mit Multi-LoRA</strong> können Tausende verschiedener LoRA-Adapter von einer einzigen GPU ausliefern. Sie batchen eingehende Anfragen nach Basismodell (alle teilen dasselbe eingefrorene W) und wenden die LoRA-Zweige pro Anfrage parallel an. So hosten Replicate, Together AI und ähnliche Plattformen Dutzende feinjustierter Varianten zu geringen Kosten.</div>`);
