{id: 'quiz', get title(){return L('Quiz','Quiz');}, get group(){return L('Quiz','Quiz');},
render() {
  let h = L(`<div class="stage-title">Test Your Understanding <span class="tag tg">QUIZ</span></div>`,`<div class="stage-title">Teste dein Verständnis <span class="tag tg">QUIZ</span></div>`);
  h += L(`<p class="stage-desc">Six questions covering the core ideas. Click an answer to check it.</p>`,`<p class="stage-desc">Sechs Fragen zu den Kernideen. Klicke eine Antwort an, um sie zu prüfen.</p>`);

  const questions = [
    {
      q: L("What does LoRA freeze and what does it train?","Was friert LoRA ein, und was trainiert es?"),
      opts: [
        {t: L("Freezes A and B; trains the base weights W","Friert A und B ein; trainiert die Basisgewichte W"), ok: false},
        {t: L("Freezes the base weights W; trains two small matrices A and B whose product is added to W","Friert die Basisgewichte W ein; trainiert zwei kleine Matrizen A und B, deren Produkt zu W addiert wird"), ok: true},
        {t: L("Freezes the embedding layer only; trains everything else","Friert nur die Embedding-Schicht ein; trainiert alles andere"), ok: false},
        {t: L("Trains nothing — LoRA is a zero-shot method","Trainiert nichts — LoRA ist ein Zero-Shot-Verfahren"), ok: false},
      ],
      fb: L("LoRA freezes the pre-trained weight matrix W and learns a low-rank update BA on the side. Only A and B receive gradients.","LoRA friert die vortrainierte Gewichtsmatrix W ein und lernt nebenbei ein Low-Rank-Update BA. Nur A und B erhalten Gradienten.")
    },
    {
      q: L("Why is B initialized to zero (and A to random Gaussian) at the start of training?","Warum wird B zu Trainingsbeginn mit null initialisiert (und A zufällig gaußverteilt)?"),
      opts: [
        {t: L("Because zero matrices are faster to multiply","Weil sich Nullmatrizen schneller multiplizieren lassen"), ok: false},
        {t: L("So that BA = 0 at step 0, making the LoRA-augmented model identical to the pre-trained model at the start of training","Damit BA = 0 in Schritt 0 gilt und das mit LoRA erweiterte Modell zu Trainingsbeginn identisch mit dem vortrainierten ist"), ok: true},
        {t: L("It's a regularization trick that prevents overfitting","Es ist ein Regularisierungstrick gegen Overfitting"), ok: false},
        {t: L("Because gradients don't flow through zero matrices","Weil Gradienten nicht durch Nullmatrizen fließen"), ok: false},
      ],
      fb: L("If both A and B were random, the LoRA branch would inject noise into every layer. Starting with B = 0 means BA = 0, so training begins from exactly the pre-trained behavior and gradually departs from it.","Wären A und B beide zufällig, würde der LoRA-Zweig Rauschen in jede Schicht einspeisen. Mit B = 0 zu starten heißt BA = 0, sodass das Training exakt beim vortrainierten Verhalten beginnt und sich allmählich davon entfernt.")
    },
    {
      q: L("If d = 4096 (LLaMA-7B hidden size) and r = 8, how many trainable parameters does LoRA add per weight matrix?","Wenn d = 4096 (verdeckte Größe von LLaMA-7B) und r = 8, wie viele trainierbare Parameter fügt LoRA pro Gewichtsmatrix hinzu?"),
      opts: [
        {t: "4096² = 16,777,216", ok: false},
        {t: "2 × 4096 × 8 = 65,536", ok: true},
        {t: "8² = 64", ok: false},
        {t: "4096 × 8 = 32,768", ok: false},
      ],
      fb: L("LoRA adds 2dr params per matrix: A is r×d (8 × 4096) and B is d×r (4096 × 8), totaling 2 · 4096 · 8 = 65,536. That's a 256× reduction from full fine-tuning.","LoRA fügt 2dr Parameter pro Matrix hinzu: A ist r×d (8 × 4096) und B ist d×r (4096 × 8), zusammen 2 · 4096 · 8 = 65 536. Das ist eine 256-fache Reduktion gegenüber vollem Fine-Tuning.")
    },
    {
      q: L("Why compute B(Ax) instead of (BA)x at inference time, even though they're mathematically equal?","Warum bei der Inferenz B(Ax) statt (BA)x berechnen, obwohl beides mathematisch gleich ist?"),
      opts: [
        {t: L("B(Ax) is more numerically stable","B(Ax) ist numerisch stabiler"), ok: false},
        {t: L("Computing Ax first goes through the small r-dim bottleneck, costing O(2dr) ops instead of O(d²) for materializing BA","Zuerst Ax zu berechnen geht durch den kleinen r-dim Flaschenhals und kostet O(2dr) Operationen statt O(d²) fürs Materialisieren von BA"), ok: true},
        {t: L("(BA)x doesn't preserve the rank constraint","(BA)x erhält die Rangbeschränkung nicht"), ok: false},
        {t: L("PyTorch can't backprop through (BA)x","PyTorch kann nicht durch (BA)x zurückpropagieren"), ok: false},
      ],
      fb: L("Mathematically B(Ax) = (BA)x, but operationally B(Ax) only touches r-dimensional intermediates and costs O(2dr) ops. (BA)x first materializes a full d×d matrix at O(d²r) cost, defeating the purpose of LoRA.","Mathematisch gilt B(Ax) = (BA)x, aber operativ berührt B(Ax) nur r-dimensionale Zwischenwerte und kostet O(2dr) Operationen. (BA)x materialisiert zuerst eine volle d×d-Matrix mit O(d²r) Kosten und macht den Zweck von LoRA zunichte.")
    },
    {
      q: L("What is the role of the α/r scaling factor?","Welche Rolle spielt der Skalierungsfaktor α/r?"),
      opts: [
        {t: L("It's the learning rate of the LoRA branch","Er ist die Lernrate des LoRA-Zweigs"), ok: false},
        {t: L("It normalizes the magnitude of the update so you can change r without re-tuning the learning rate","Er normalisiert die Größe des Updates, sodass man r ändern kann, ohne die Lernrate neu zu tunen"), ok: true},
        {t: L("It's the dropout probability applied to BA","Er ist die auf BA angewendete Dropout-Wahrscheinlichkeit"), ok: false},
        {t: L("It controls how many adapters are active simultaneously","Er steuert, wie viele Adapter gleichzeitig aktiv sind"), ok: false},
      ],
      fb: L("Without α/r scaling, doubling r would also roughly double the magnitude of BA. Decoupling α from r lets you change capacity without breaking your training recipe — α stays fixed, r becomes a pure capacity knob.","Ohne α/r-Skalierung würde eine Verdopplung von r auch die Größe von BA ungefähr verdoppeln. Die Entkopplung von α und r erlaubt es, die Kapazität zu ändern, ohne das Trainingsrezept zu brechen — α bleibt fest, r wird zu einem reinen Kapazitätsregler.")
    },
    {
      q: L("Which of these is NOT a benefit of LoRA over full fine-tuning?","Welches davon ist KEIN Vorteil von LoRA gegenüber vollem Fine-Tuning?"),
      opts: [
        {t: L("Smaller checkpoints (a few MB vs hundreds of GB)","Kleinere Checkpoints (wenige MB statt Hunderte GB)"), ok: false},
        {t: L("Lower GPU memory during training","Weniger GPU-Speicher beim Training"), ok: false},
        {t: L("Faster training of larger models on small hardware","Schnelleres Training größerer Modelle auf kleiner Hardware"), ok: false},
        {t: L("Higher peak accuracy than full fine-tuning on every task","Höhere Spitzengenauigkeit als volles Fine-Tuning bei jeder Aufgabe"), ok: true},
      ],
      fb: L("LoRA usually matches full fine-tuning, sometimes exceeds it slightly, but the headline benefit is parameter/memory/storage efficiency — not raw accuracy. For tasks that diverge wildly from the pre-training distribution, full fine-tuning may still win.","LoRA erreicht meist volles Fine-Tuning, übertrifft es manchmal leicht, aber der Hauptvorteil ist Parameter-/Speicher-/Speicherplatz-Effizienz — nicht rohe Genauigkeit. Bei Aufgaben, die stark von der Vortrainingsverteilung abweichen, kann volles Fine-Tuning immer noch gewinnen.")
    },
  ];

  questions.forEach((q, i) => {
    h += `<div class="quiz-q">
<div class="qnum">${L('Question','Frage')} ${i + 1}</div>
<div class="qtext">${q.q}</div>`;
    q.opts.forEach((o, j) => {
      h += `<button class="quiz-opt" onclick="quizCheck(this, ${o.ok}, 'q${i}fb')">${o.t}</button>`;
    });
    h += `<div class="quiz-fb" id="q${i}fb">${q.fb}</div>`;
    h += `</div>`;
  });

  h += L(`<div class="info iac"><div class="il">Done!</div>You've now seen the full LoRA story: the problem (full fine-tuning is expensive), the insight (updates have low intrinsic rank), the decomposition (W + BA), the math (forward pass, parameter counting, training), and the deployment patterns (merged inference, multi-adapter serving). The original paper [1] is short and very readable — recommended next step.</div>`,`<div class="info iac"><div class="il">Geschafft!</div>Du hast jetzt die ganze LoRA-Geschichte gesehen: das Problem (volles Fine-Tuning ist teuer), die Einsicht (Updates haben niedrigen intrinsischen Rang), die Zerlegung (W + BA), die Mathematik (Forward-Pass, Parameterzählung, Training) und die Deployment-Muster (verschmolzene Inferenz, Multi-Adapter-Serving). Das Original-Paper [1] ist kurz und sehr gut lesbar — empfohlener nächster Schritt.</div>`);

  return h;
}},

];

// ═══════ APP STATE ═══════
let currentStep = 0;

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = `<div class="side-label">${L('LoRA walkthrough','LoRA-Rundgang')}</div>`;
  const groups = {};
  STEPS.forEach((s, i) => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(i);
  });
  Object.keys(groups).forEach((g, gi) => {
    h += `<div class="side-label" style="margin-top:0.4rem;">${g}</div>`;
    groups[g].forEach(si => {
      const s = STEPS[si];
      const cls = si === currentStep ? 'on' : si < currentStep ? 'done' : '';
      h += `<button class="step-btn ${cls}" onclick="goStep(${si})"><span class="step-num">${si < currentStep ? '✓' : si + 1}</span>${s.title}</button>`;
    });
    if (gi < Object.keys(groups).length - 1) h += `<div class="step-divider"></div>`;
  });
  sb.innerHTML = h;
}

function renderMain() {
  const el = document.getElementById('main-content');
  const s = STEPS[currentStep];
  let h = `<div class="config">`;
  h += `<div class="cfg-item">d=<span>${D}</span></div>`;
  h += `<div class="cfg-item">r=<span>${RANK}</span></div>`;
  h += `<div class="cfg-item">α=<span>${ALPHA}</span></div>`;
  h += `<div class="cfg-item">α/r=<span>${(ALPHA/RANK).toFixed(2)}</span></div>`;
  h += `<div class="cfg-item">${L('trainable','trainierbar')}=<span>${2*D*RANK}/${D*D}</span></div>`;
  h += `<div class="cfg-item" style="margin-left:auto;">${L('step','Schritt')} <span>${currentStep+1}</span>/${STEPS.length}</div>`;
  h += `</div>`;
  h += s.render();
  h += `<div class="nav-row">`;
  h += `<button class="nav-btn nav-prev" onclick="goStep(${currentStep-1})" ${currentStep===0?'disabled':''}>${L('← Previous','← Zurück')}</button>`;
  h += `<button class="nav-btn nav-next" onclick="goStep(${currentStep+1})" ${currentStep===STEPS.length-1?'disabled':''}>${currentStep===STEPS.length-1?L('Complete','Fertig'):L('Next →','Weiter →')}</button>`;
  h += `</div>`;
  el.innerHTML = h;
}

function goStep(n) {
  if (n < 0 || n >= STEPS.length) return;
  currentStep = n;
  renderSidebar();
  renderMain();
  document.getElementById('main-content').scrollTop = 0;
}

function onRankChange() {
  RANK = parseInt(document.getElementById('rank-slider').value);
  document.getElementById('rank-val').textContent = RANK;
  renderMain();
}

function onAlphaChange() {
  ALPHA = parseInt(document.getElementById('alpha-slider').value);
  document.getElementById('alpha-val').textContent = ALPHA;
  renderMain();
}

function quizCheck(btn, ok, fbId) {
  const q = btn.parentElement;
  if (q.dataset.answered) return;
  q.dataset.answered = '1';
  if (ok) {
    btn.classList.add('right');
  } else {
    btn.classList.add('wrong');
    // highlight correct
    q.querySelectorAll('.quiz-opt').forEach(o => {
      const oc = o.getAttribute('onclick');
      if (oc && oc.includes('true')) o.classList.add('right');
    });
  }
  document.getElementById(fbId).classList.add('show');
}

// ═══════ INIT ═══════
renderSidebar();
renderMain();
